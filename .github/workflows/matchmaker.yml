# Deploy the matchmaker to Fly.io (openspec/changes/matchmaker task 4.1) with the FLY_API_TOKEN secret.
# A merge to main deploys it, as the web build; feat/server-browser deploys too while the server browser
# is being tested across machines (owner, 2026-10-23), and comes off this list when it merges.
name: matchmaker deploy
on:
  workflow_dispatch:
  push:
    branches: [main, feat/server-browser]
    paths:
      - "crates/sc-matchmaker/**"
      - "crates/sc-net/**"
      - "data/matchmaker/**"
      - "Dockerfile"
      - "fly.toml"
      - ".github/workflows/matchmaker.yml"
concurrency:
  group: matchmaker-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # One Machine (matchmaker design 5): each keeps its listings in memory, and a second one splits them, so a
      # server's code changes every time its poll lands on the other and a join fails half the time. Fly gives an
      # app two by default; --ha=false stops a deploy adding one, and the scale removes any already there.
      - name: Deploy
        run: |
          flyctl deploy --remote-only --ha=false
          flyctl scale count 1 --yes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Exactly one Machine runs
        run: |
          n=$(flyctl machines list --json | jq '[.[] | select(.state == "started")] | length')
          echo "running Machines: $n"
          test "$n" -eq 1
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
