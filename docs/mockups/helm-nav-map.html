    for (let i = 0; i < 5; i++) { const a = (i / 5) * Math.PI * 2 + rnd(b.id) * 2, rr = 3.2 + 2.2 * rnd(b.id + i); pts.push(`${(x + rr * Math.cos(a)).toFixed(1)},${(y + rr * Math.sin(a)).toFixed(1)}`); }
    return `<polygon points="${pts.join(" ")}" fill="#9aa0a8" stroke="#5d6570" stroke-width="1"/>`;
  }
  const r = Math.max(b.parent ? 4.5 : 6, rpx);
  return circle(x, y, r, srgb(b.id === "tamsin" ? b.look.ocean_srgb : b.look.land_srgb, b.id === "tamsin" ? 0.25 : 0.35), C.line2);
}
function lockRing(x, y, r, danger) {
  calls += 2;
  const fill = danger ? "url(#hatchRed)" : "url(#hatchFaint)", col = danger ? C.danger : C.faint;
  return `<path d="M${x - r} ${y}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0zM${x - r + 7} ${y}a${r - 7} ${r - 7} 0 1 1 ${2 * (r - 7)} 0a${r - 7} ${r - 7} 0 1 1 ${-2 * (r - 7)} 0z" fill="${fill}" fill-rule="evenodd" opacity="${danger ? 0.75 : 0.6}"/>` +
    `<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="${col}" stroke-width="1.5"/>`;
}
function shipGlyph(x, y, hdg, col, s = 20) {
  calls++;
  return `<g transform="translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${hdg}) scale(${s / 24})"><path d="M0 -12L7 8L0 4L-7 8Z" fill="${col}" stroke="${C.bg}" stroke-width="1.5"/></g>`;
}
function pip(x, y, stop, st) {
  // A route stop (design 5.3): done filled with a tick, the target double ringed in the accent, the ghost dashed.
  const ic = KIND_ICON[stop.kind];
  if (st === "done") return circle(x, y, 12, C.ok, "none") + icon("check", x, y, 14, C.ink, { sw: 3 });
  if (st === "target") return circle(x, y, 15, "none", C.accent, 1.5) + circle(x, y, 12, C.accent + "33", C.accent, 2) + icon(ic, x, y, 14, C.accent);
  if (st === "ghost") return circle(x, y, 12, C.text + "22", C.text, 2, 'stroke-dasharray="4 3"') + icon(ic, x, y, 14, C.text);
  return circle(x, y, 12, C.panel, C.dim, 1.5) + icon(ic, x, y, 14, C.dim);
}
function labelAt(x, y, str, col = C.dim, a = "start") { return text(x, y, 12, col, str.toUpperCase(), { a, ls: 1.4, w: 700 }); }

function drawMap(S) {
  const view = VIEWS[S.view], P = projector(view), system = S.view === "system";
  let s = rect(M.x, M.y, M.w, M.h, "#05080d", "none", 6);
  s += `<g clip-path="url(#mapclip)">`;
  const star = P([0, 0, 0]);
  // Belts: two dotted arcs and a faint band between them (design 5.2).
  for (const bt of PROPOSED.belts) {
    const r0 = bt.inner_m / view.mpp, r1 = bt.outer_m / view.mpp;
    calls += 3;
    s += `<path d="M${star[0] - r1} ${star[1]}a${r1} ${r1} 0 1 0 ${2 * r1} 0a${r1} ${r1} 0 1 0 ${-2 * r1} 0zM${star[0] - r0} ${star[1]}a${r0} ${r0} 0 1 1 ${2 * r0} 0a${r0} ${r0} 0 1 1 ${-2 * r0} 0z" fill="#9aa7b8" fill-rule="evenodd" opacity="0.07"/>`;
    for (const r of [r0, r1]) s += `<circle cx="${star[0]}" cy="${star[1]}" r="${r}" fill="none" stroke="#9aa7b8" stroke-width="2" stroke-linecap="round" stroke-dasharray="0.1 6" opacity="0.7"/>`;
    if (system) s += labelAt(star[0] - r1 * 0.80, star[1] + r1 * 0.47, bt.name, C.dim, "end");
    else s += labelAt(P(PLACES.shoals_relay.pos)[0] - 160, P(PLACES.shoals_relay.pos)[1] + 120, bt.name, C.dim);
  }
  // Orbits round the star (planets), 48 segments in the engine.
  for (const b of BODIES) {
    if (b.parent || b.kind === "asteroid") continue;
    const r = Math.hypot(b.pos_m[0], b.pos_m[2]) / view.mpp;
    if (r > 20000) continue;
    calls++; s += `<circle cx="${star[0]}" cy="${star[1]}" r="${r.toFixed(1)}" fill="none" stroke="${C.line2}" stroke-width="1"/>`;
  }
  // The star.
  if (star[0] > M.x - 40 && star[0] < M.x + M.w + 40) s += circle(star[0], star[1], 26, "url(#halo)") + circle(star[0], star[1], 9, srgb(SYS.star.colour_srgb, 0)) + labelAt(star[0] - 16, star[1] + 4, SYS.star.name, C.text, "end");
  // Mass lock rings: drawn once they are 6 px or more (design 5.2); red while a pick is inside one.
  for (const b of BODIES) {
    const r = (b.radius_m * JUMP.planet_radii) / view.mpp;
    if (r < 6) continue;
    const p = P(b.pos_m);
    s += lockRing(p[0], p[1], r, S.ghost && S.ghost.lockedBy === b.name);
  }
  if (!system) for (const pl of Object.values(PLACES)) if (pl.kind === "station" && pl.lock / view.mpp >= 6) { const p = P(pl.pos); s += lockRing(p[0], p[1], pl.lock / view.mpp, false); }
  // A station's orbit round its body, in an open cluster.
  if (!system) for (const pl of Object.values(PLACES)) {
    if (pl.kind !== "station" || !pl.body) continue;
    const b = P(body(pl.body).pos_m), r = SYS.stations.find((x) => x.id === pl.id).orbit_radius_m / view.mpp;
    if (r < 2000 && r > 8) { calls++; s += `<circle cx="${b[0]}" cy="${b[1]}" r="${r}" fill="none" stroke="${C.line2}" stroke-dasharray="3 4"/>`; }
  }
  // Bodies by kind.
  for (const b of BODIES) {
    if (system && b.parent) continue;   // a moon shows when its cluster is open
    const p = P(b.pos_m);
    if (p[0] < M.x - 30 || p[0] > M.x + M.w + 30 || p[1] < M.y - 30 || p[1] > M.y + M.h + 30) continue;
    s += bodyGlyph(b, p[0], p[1], view);
    const lr = Math.max(b.kind === "gas_giant" ? 22 : b.kind === "asteroid" ? 6 : 8, b.radius_m / view.mpp);
    if (b.kind === "asteroid") { if (!system) s += labelAt(p[0] + 9, p[1] + 4, b.name, C.dim); }
    else if (system) s += labelAt(p[0] + (b.id === "orrin" ? 4 : 0), p[1] + lr + 16, b.name, C.text, "middle");
    else s += labelAt(p[0], p[1] - lr - 8, b.name, C.text, "middle");
  }
  // Stations and points in an open cluster; the relay's reach shows its places together.
  const anchors = ROUTE.map((r) => (system ? P(CLUSTER_POS[CLUSTER_OF[r.place]]) : P(PLACES[r.place].pos)));
  const nearStop = (p) => anchors.some((a) => Math.hypot(a[0] - p[0], a[1] - p[1]) < 14);
  const at = (id) => (system ? P(CLUSTER_POS[CLUSTER_OF[id]]) : P(PLACES[id].pos));
  if (system) { const r = P(PLACES.shoals_relay.pos); calls++; s += `<path d="M${r[0]} ${r[1] - 6}l6 6-6 6-6-6z" fill="none" stroke="${C.text}" stroke-width="1.6"/>`; s += labelAt(r[0], r[1] + 22, "the relay", C.text, "middle"); }
  else for (const pl of Object.values(PLACES)) {
    const p = P(pl.pos);
    if (p[0] < M.x || p[0] > M.x + M.w || p[1] < M.y || p[1] > M.y + M.h) continue;
    calls++;
    if (pl.kind === "station") { s += `<rect x="${p[0] - 5}" y="${p[1] - 5}" width="10" height="10" fill="${C.panel}" stroke="${C.text}" stroke-width="1.6"/>`; if (!nearStop(p)) s += labelAt(p[0] + 12, p[1] + 4, pl.name, C.dim); }
    else s += `<path d="M${p[0]} ${p[1] - 6}l6 6-6 6-6-6z" fill="none" stroke="${C.text}" stroke-width="1.6"/>`;
  }
  // The route: a dim dashed line through the stops in order, from where the patrol began.
  const pts = [at("tamsin_station"), ...ROUTE.map((r) => at(r.place))];
  const inView = (p) => p[0] > M.x - M.w && p[0] < M.x + 2 * M.w && p[1] > M.y - M.h && p[1] < M.y + 2 * M.h;
  let d = "";
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i];
    if (Math.hypot(a[0] - b[0], a[1] - b[1]) < 2 || !inView(a) || !inView(b)) continue;
    d += `M${a[0].toFixed(1)} ${a[1].toFixed(1)}L${b[0].toFixed(1)} ${b[1].toFixed(1)}`;
  }
  if (d) { calls++; s += `<path d="${d}" fill="none" stroke="${C.dim}" stroke-width="1.5" stroke-dasharray="2 6" stroke-linecap="round" opacity="0.8"/>`; }
  // The stops (design 5.3), stacked beside their anchor in route order: placed first, so the ship can keep clear of them.
  const groups = {}, pips = [];
  ROUTE.forEach((r, i) => {
    const a = at(r.place), key = `${Math.round(a[0] / 12)},${Math.round(a[1] / 12)}`;
    (groups[key] = groups[key] || { a, list: [] }).list.push(i);
  });
  for (const g of Object.values(groups)) {
    const big = g.list.some((i) => ROUTE[i].place.startsWith("orrin") || ROUTE[i].place === "pell_beacon") && system;
    const home = ROUTE[g.list[0]].kind === "home";
    g.list.forEach((i, k) => pips.push({ i, x: home ? g.a[0] - 24 - k * 30 : g.a[0] + (big ? 40 : 24) + k * 30, y: g.a[1] }));
  }
  // The ship: at its place, or on a short leader beside it where its place is crowded (the side with most room).
  const shipAt = PLACES[S.at].pos, sp = P(shipAt);
  let shipPx = sp;
  if (system || nearStop(sp)) {
    const busy = [...pips.map((q) => [q.x, q.y]), star, [star[0] - 36, star[1]], ...BODIES.filter((b) => !b.parent).map((b) => P(b.pos_m)), ...BODIES.filter((b) => !b.parent && b.kind !== "asteroid").map((b) => { const q = P(b.pos_m); return [q[0], q[1] + 24]; })];
    const room = (c) => Math.min(...busy.map((q) => Math.hypot(q[0] - c[0], q[1] - c[1])));
    const cands = [[-34, -4], [-30, 28], [0, -36], [30, 30], [-30, -30], [34, -24], [-44, -30], [-56, 10], [-20, 44]].map((o) => [sp[0] + o[0], sp[1] + o[1]]);
    shipPx = cands.reduce((best, c) => (room(c) > room(best) + 0.5 ? c : best), cands[0]);
    calls++; s += `<path d="M${sp[0]} ${sp[1]}L${shipPx[0]} ${shipPx[1]}" stroke="${C.text}" stroke-width="1" opacity="0.6"/>`;
  }
  // The plotted course and the ghost.
  // At the system zoom a line ends on its stop's pip, so the course and the ghost stay apart inside one cluster.
  const pipOf = (i) => { const q = pips.find((x) => x.i === i); return [q.x, q.y]; };
  const tgt = ROUTE[S.target], tp = system ? pipOf(S.target) : P(PLACES[tgt.place].pos);
  const courseCol = S.jump === "spool" ? C.warn : C.accent;
  calls++; s += `<path d="M${shipPx[0]} ${shipPx[1]}L${tp[0]} ${tp[1]}" stroke="${courseCol}" stroke-width="2.5"/>`;
  if (S.ghost) {
    const gp = S.ghost.free ? P(S.ghost.free) : system ? pipOf(S.ghost.stop) : at(ROUTE[S.ghost.stop].place), bad = !!S.ghost.lockedBy;
    calls++; s += `<path d="M${shipPx[0]} ${shipPx[1]}L${gp[0]} ${gp[1]}" stroke="${bad ? C.danger : C.text}" stroke-width="2" stroke-dasharray="7 6" opacity="0.7"/>`;
    if (S.ghost.free) { calls += 2; s += `<circle cx="${gp[0]}" cy="${gp[1]}" r="11" fill="${C.bg}" stroke="${C.danger}" stroke-width="2"/><path d="M${gp[0] - 5} ${gp[1] - 5}l10 10M${gp[0] + 5} ${gp[1] - 5}l-10 10" stroke="${C.danger}" stroke-width="2.5" stroke-linecap="round"/>`; }
  }
  for (const q of pips) {
    const i = q.i, st = S.done.includes(i) ? "done" : i === S.target ? "target" : S.ghost && S.ghost.stop === i ? "ghost" : "open";
    s += pip(q.x, q.y, ROUTE[i], st);
  }
  // The ship last, on top: its own lock ring when it sits inside one.
  if (S.shipLocked) s += lockRing(shipPx[0], shipPx[1], 17, true);
  s += shipGlyph(shipPx[0], shipPx[1], S.hdg, C.text, 22);
  s += `</g>`;
  // Zoom chips and the scale bar.
  const chips = [["SYSTEM", S.view === "system"], ...(view.chip ? [[view.chip, true]] : [])];
  let cx = M.x + 8;
  for (const [w, on] of chips) {
    const tw = 22 + w.length * 8.6;
    s += rect(cx, M.y + 8, tw, 26, on ? C.accent + "26" : C.panel2, on ? C.accent : C.line2, 5, 1) + text(cx + tw / 2, M.y + 26, 12, on ? C.text : C.dim, w, { a: "middle", ls: 1.4, w: 700 });
    cx += tw + 6;
  }
  const scale = system ? [AU, "1 AU"] : S.view === "cinder" ? [5e6, "5,000 km"] : [0.1 * AU, "0.1 AU"];
  const len = scale[0] / view.mpp, sx = M.x + M.w - 16 - len, sy = M.y + M.h - 14;
  calls++; s += `<path d="M${sx} ${sy - 5}v5H${sx + len}v-5" fill="none" stroke="${C.dim}" stroke-width="1.5"/>` + text(sx + len / 2, sy - 8, 12, C.dim, scale[1], { a: "middle" });
  return s;
}

// ------------------------------------------------------------------ the right column
function targetCard(S, g, readOnly) {
  let s = panel(g, "TARGET");
  const ghost = S.ghost, stop = ghost && !ghost.free ? ROUTE[ghost.stop] : !ghost ? ROUTE[S.target] : null;
  const name = ghost && ghost.free ? "Open space" : PLACES[stop.place].name;
  const ic = ghost && ghost.free ? "free" : KIND_ICON[stop.kind];
  const col = ghost ? (ghost.lockedBy ? C.danger : C.text) : C.accent;
  s += rect(g.x + 16, g.y + 36, 56, 56, ghost ? C.panel2 : C.accent + "1f", col, 8, ghost ? 1.5 : 2, ghost && !ghost.lockedBy ? 'stroke-dasharray="5 4"' : "") + icon(ic, g.x + 44, g.y + 64, 30, col);
  s += text(g.x + 86, g.y + 62, 24, C.text, name, { w: 700 });
  // The state, a word with a shape.
  const [word, wcol, wic] = ghost ? (ghost.lockedBy ? ["MASS LOCK", C.danger, "lock"] : ["CLEAR", C.ok, "check"]) : ["PLOTTED", C.accent, "check"];
  s += icon(wic, g.x + 96, g.y + 82, 15, wcol) + text(g.x + 110, g.y + 87, 14, wcol, word + (ghost && ghost.lockedBy ? ` · ${ghost.lockedBy.toUpperCase()}` : ""), { ls: 1.5, w: 700 });
  if (readOnly) {
    s += icon("helm", g.x + 30, g.y + 150, 18, C.accent) + text(g.x + 46, g.y + 156, 16, C.dim, "Ana");
    return s;
  }
  const canPlot = !!ghost && !ghost.lockedBy;
  s += button({ x: g.x + 14, y: g.y + 118, w: 232, h: 64, icon: "plot", label: "PLOT", on: canPlot, off: !canPlot, fs: 22, is: 26 });
  const offNext = !ghost && S.target === S.done.length;
  s += button({ x: g.x + 256, y: g.y + 118, w: 138, h: 64, icon: "reset", label: "NEXT STOP", off: offNext, fs: 13, is: 18 });
  return s;
}
function alignCue(x, y, w, h, off, live) {
  // patrol-consoles.html's ALIGN glyph made live (design 8): the 5 degree cone drawn 6 times wide, the bow at its angle.
  const ax = x + w / 2, ay = y + h - 18, L = h - 36, al = off < JUMP.align_deg;
  // Inside the cone the angle is drawn 6 times true; beyond it, compressed so 90 degrees reaches the box's side.
  const vis = off <= JUMP.align_deg ? off * 6 : Math.min(78, 30 + ((off - JUMP.align_deg) * 48) / 85);
  const cone = JUMP.align_deg * 6 * (Math.PI / 180), bow = vis * (Math.PI / 180);
  let s = rect(x, y, w, h, C.panel2, C.line2, 8, 1);
  calls += 2;
  s += `<path d="M${ax} ${ay}L${ax - L * Math.sin(cone)} ${ay - L * Math.cos(cone)}A${L} ${L} 0 0 1 ${ax + L * Math.sin(cone)} ${ay - L * Math.cos(cone)}Z" fill="${al ? C.ok + "33" : "#2a374733"}" stroke="${al ? C.ok : live ? C.dim : C.faint}" stroke-width="1.5"/>`;
  const BL = Math.min(L * 0.92, (w / 2 - 8) / Math.max(Math.sin(bow), 0.01));
  s += `<path d="M${ax} ${ay}L${(ax + BL * Math.sin(bow)).toFixed(1)} ${(ay - BL * Math.cos(bow)).toFixed(1)}" stroke="${live ? (al ? C.ok : C.text) : C.faint}" stroke-width="4" stroke-linecap="round"/>`;
  s += text(x + w / 2, y + h + 22, 22, live ? (al ? C.ok : C.text) : C.faint, `${Math.round(off)}°`, { a: "middle", w: 700 });
  return s;
}
function jumpPanel(S, g) {
  let s = panel(g, "JUMP");
  const live = S.jump !== "lock";
  s += alignCue(g.x + 16, g.y + 32, 112, 126, S.off, live);
  s += button({ x: g.x + 144, y: g.y + 34, w: 250, h: 52, icon: "course", label: "ALIGN", on: S.ap, off: !live || S.jump === "cool", fs: 18, is: 22 });
  const jst = S.jump, sub = jst === "lock" ? "mass lock" : jst === "cool" ? `cooldown ${S.cool} s` : jst === "spool" ? `${Math.round(40 * (1 - S.spool))} s` : "hold";
  s += button({ x: g.x + 144, y: g.y + 98, w: 250, h: 84, icon: "jump", label: "JUMP", on: jst === "live" || jst === "spool", off: jst === "lock" || jst === "cool", fs: 26, is: 28, col: jst === "spool" ? C.warn : C.accent });
  s += text(g.x + 300, g.y + 168, 14, jst === "lock" ? C.danger : C.dim, sub, { a: "middle" });
  if (jst === "spool") s += ring(g.x + 358, g.y + 140, 20, S.spool, C.warn);
  if (jst === "lock") s += icon("lock", g.x + 358, g.y + 140, 22, C.danger);
  return s;
}
function orderPanel(S, g) {
  let s = panel(g, "ORDER");
  s += button({ x: g.x + 14, y: g.y + 34, w: 380, h: 84, icon: "jump", label: "JUMP", on: true, col: C.ok, fs: 28, is: 30, sub: "hold" });
  const lights = [["PLOT", "ok"], ["ALIGN", S.off < JUMP.align_deg ? "ok" : "warn"], ["POWER", "ok"]];
  lights.forEach(([w, st], i) => {
    const x = g.x + 40 + i * 130, y = g.y + 150, col = st === "ok" ? C.ok : C.warn;
    s += st === "ok" ? circle(x, y, 10, col) + icon("check", x, y, 12, C.ink, { sw: 3 }) : circle(x, y, 10, "none", col, 3, 'stroke-dasharray="44 19"');
    s += text(x + 18, y + 5, 14, st === "ok" ? C.text : col, w, { ls: 1.5, w: 700 });
  });
  return s;
}

// ------------------------------------------------------------------ the page
function draw() {
  const S = STATES[state];
  calls = 0;
  let s = DEFS + rect(0, 0, 1280, 720, C.bg, "none", 0);
  s += titleBand(S) + lookBand(S);
  s += panel(grid(0, 0, 8, 4), "MAP") + drawMap(S);
  if (S.station === "captain") s += targetCard(S, grid(8, 0, 4, 2), true) + orderPanel(S, grid(8, 2, 4, 2));
  else s += targetCard(S, grid(8, 0, 4, 2), false) + jumpPanel(S, grid(8, 2, 4, 2));
  s += statusStrip(S);
  document.getElementById("screen").innerHTML = s;
  for (const b of document.querySelectorAll("#bar button[data-k]")) b.classList.toggle("on", b.dataset.k === state);
  document.getElementById("cost").textContent = `UI: ${calls} draw items in SVG (the engine batches them into the console's 16 calls) · presents helm-nav-map`;
}
const bar = document.getElementById("bar");
bar.innerHTML = "<b>Helm NAV map</b>";
for (const [k, v] of Object.entries(STATES)) {
  const b = document.createElement("button");
  b.textContent = v.label; b.dataset.k = k; b.type = "button";
  b.onclick = () => { state = k; draw(); };
  bar.appendChild(b);
}
bar.insertAdjacentHTML("beforeend", '<span class="cost" id="cost"></span>');
function fit() {
  const st = document.getElementById("stage"), k = Math.min(st.clientWidth / 1280, st.clientHeight / 720);
  const w = document.getElementById("wrap");
  w.style.transform = `scale(${k})`;
  w.style.left = `${(st.clientWidth - 1280 * k) / 2}px`; w.style.top = `${(st.clientHeight - 720 * k) / 2}px`;
}
addEventListener("resize", fit);
fit();
draw();
window.MOCKUP_SHOTS = Object.keys(STATES).map((k) => ({ name: k, setup: () => { state = k; draw(); } }));
window.MOCKUP_READY = true;
</script>
</body>
