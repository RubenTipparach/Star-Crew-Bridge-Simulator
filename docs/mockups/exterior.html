<!doctype html>
<!--
  exterior.html: the SCS Tern from outside, presenting four changes at once:
  ship-frames (the interior held level while the hull rolls, the far and near
  exterior layers, attachments posed in the ship frame, hand-off at a tick),
  weapons-and-shields (turrets, arcs baked from the hull, the lead solver and
  hit chance, point defence, the Gannet, six shield faces), shuttle-bay-and-fighters
  (a Swift dropped from the port bay and another recovered into the starboard
  bay) and flight-and-navigation (the assisted Newtonian ship, the recovery and
  launch holds, the dampers' demand).

  Built from data/ships/tern/layout.json through shipkit.js (inlined below by
  tools/mockups/inline.py; never hand-edit between the INLINE markers). The
  simulation steps a fixed 1/30 s tick and is seeded, so every shot is the same
  every run. Numbers come from the four designs; where the mockup simplifies a
  rule (fighters steer kinematically, the ship's inertia is a rate limit) the
  info panel says so.
-->
<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tern Exterior Combat</title>
<style>

          --ok: #66bb6a; --warn: #ffb300; --danger: #ef5350; --friend: #4fc3f7; --hostile: #ff6a5a; --missile: #ffc04d; }

  canvas { display: block; }
  .controls { position: fixed; left: 12px; bottom: 12px; z-index: 20; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; display: flex; gap: 4px 5px; flex-wrap: wrap; align-items: center; max-width: calc(100vw - 300px); box-sizing: border-box; }
  .controls .grp { color: var(--dim); font-size: 11px; margin: 0 2px 0 6px; }
  .controls button { background: #18202a; color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 3px 7px; font: 12px system-ui, sans-serif; cursor: pointer; }
  .controls button.on { border-color: var(--accent); color: var(--accent); }
  .info { position: fixed; right: 12px; top: 12px; z-index: 20; width: 318px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: 11.5px; color: #c9d4df; box-sizing: border-box; max-height: calc(100vh - 150px); overflow: hidden; }
  .info b { color: var(--fg); }
  .info h4 { margin: 6px 0 2px; font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; }
  .info table { border-collapse: collapse; width: 100%; table-layout: fixed; }
  .info td { padding: 0 2px; height: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; }
  .info td.k { font-family: system-ui, sans-serif; color: var(--dim); }
  .info .bar { display: inline-block; width: 100%; height: 6px; background: #1a222c; border-radius: 2px; position: relative; vertical-align: middle; }
  .info .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; }
  .info .ev { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10.5px; color: #b6c2ce; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; height: 14px; }
  .info .note { color: #7f8fa0; font-size: 10.5px; margin-top: 4px; }
  #ov { position: fixed; inset: 0; z-index: 5; pointer-events: none; overflow: hidden; }
  .tag { position: absolute; font: 600 10.5px/1.2 ui-monospace, Menlo, Consolas, monospace; white-space: nowrap; }
  .tag .bx { position: absolute; border: 1.5px solid currentColor; box-sizing: border-box; }
  .tag .tx { position: absolute; left: 0; top: 0; padding: 1px 4px; background: rgba(4,7,12,0.7); border-radius: 2px; }
  .cap { position: absolute; background: rgba(6,9,14,0.86); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; font-size: 12px; color: #d8e2ec; box-sizing: border-box; }
  .cap b { color: #fff; }
  .cap .big { font: 600 15px/1.3 system-ui, sans-serif; }
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
  .sight { position: absolute; color: #9ff0c0; font: 600 12px/1.3 ui-monospace, Menlo, Consolas, monospace; }
  .hudbar { display: inline-block; width: 120px; height: 7px; background: rgba(20,40,30,0.8); border: 1px solid #3c6a50; position: relative; vertical-align: middle; margin-left: 6px; }
  .hudbar i { position: absolute; left: 0; top: 0; bottom: 0; background: #9ff0c0; }
  @media (max-width: 640px) { .controls { max-width: calc(100vw - 24px); bottom: 120px; } .info { display: none; } }

<script>
/*
 * shipkit.js: the one place a mockup turns a ship layout into three.js objects.
 *
 * Every Star Crew mockup reads the same layout (data/ships/<id>/layout.json), so
 * the bridge, the deck plan, the systems view and the exterior cannot disagree
 * about where a room or a door is (CLAUDE.md sections 8 and 11). This file is
 * the shared interpretation of that layout: palette, lighting states, the Pi 5
 * budget meter, room shells with door openings cut, the hull loft and labels.
 *
 * It is a classic script, not a module, so a mockup still works when opened
 * straight from disk. tools/mockups/inline.py copies it into each page between
 * the "INLINE shipkit" markers; edit it here, never in a page. Functions that
 * build geometry take THREE as their first argument because the page owns the
 * three.js import.
 *
 * Axes (from the layout): +X port, +Y up, +Z bow, metres.
 */
(function () {
  "use strict";

  /** The layout inlined into the page as <script id="ship-layout" type="application/json">. */
  function layout() {
    const el = document.getElementById("ship-layout");
    if (!el) throw new Error("shipkit: no #ship-layout script in the page (run tools/mockups/inline.py)");
    return JSON.parse(el.textContent);
  }

  /**
   * The Raspberry Pi 5 (1 GB) budget a mockup is measured against. These are
   * the provisional numbers from openspec/changes/engine-stack/design.md,
   * "The Pi 5 budget"; that table is the source, and this copy is checked
   * against its marker by tools/mockups/inline.py --check.
   */
  const PI_BUDGET = {
    board: "Pi 5 (1 GB)",
    triangles: 200000,       // visible triangles per frame, all passes
    drawCalls: 300,          // draw calls per frame, all passes
    textureMB: 96,           // texture memory
    viewscreenPx: [1024, 512], // render-to-texture size for the main viewscreen
    frameMs: 16.7,           // 60 frames a second target (33.3 ms floor), 3D at 1280x720
  };

  /** Named colour roles. Mockups use roles, not hex values (CLAUDE.md section 10). */
  const PALETTE = {
    space: 0x05070d,
    hullLight: 0x8f9aa8,
    hullDark: 0x4a5462,
    hullAccent: 0xc9643b,
    floor: 0x3a404a,
    floorCorridor: 0x454b55,
    wall: 0x6b7480,
    wallDark: 0x525a66,
    ceiling: 0x2c3138,
    trim: 0x9aa4b0,
    console: 0x2a3038,
    screen: 0x48d6ff,
    screenWarm: 0xffb347,
    glass: 0x9fd8ff,
    door: 0x8a6d3b,
    doorFrame: 0xd0a040,
    hazard: 0xe8c547,
    alert: 0xff2a2a,
    emergency: 0xff8a1c,
    lampWarm: 0xffe2b0,
    lampCool: 0xbfe0ff,
    // station roles, used for seats, labels and console accents
    role: {
      command: 0xf2f2f2,
      helm: 0x4fc3f7,
      tactical: 0xef5350,
      engineering: 0xffb300,
      science: 0x66bb6a,
      comms: 0xab47bc,
      flight_ops: 0x26c6da,
      gunner: 0xff7043,
    },
    // compartment kinds, used by plan views
    kind: {
      room: 0x5c6b7a,
      corridor: 0x7d8792,
      bay: 0x4a6a8a,
      crawlspace: 0x6a5a4a,
      airlock: 0xb08a3a,
      pod: 0xa05050,
    },
  };

  /**
   * Interior lighting states. Every interior mockup shows at least normal and
   * red alert (CLAUDE.md section 11). In the engine these are baked vertex
   * colour sets blended by a per-compartment uniform; here they are light
   * colours and intensities.
   */
  const LIGHTING = {
    normal: { label: "Normal", ambient: 0x2a3340, ambientI: 0.55, lamp: 0xffe9c8, lampI: 1.0, strip: 0x9fd8ff, stripI: 0.6, fog: 0x0b0e14 },
    red_alert: { label: "Red alert", ambient: 0x2a0d10, ambientI: 0.45, lamp: 0xff3030, lampI: 0.75, strip: 0xff2020, stripI: 1.0, fog: 0x120406 },
    emergency: { label: "Emergency power", ambient: 0x120c08, ambientI: 0.3, lamp: 0xff8a1c, lampI: 0.35, strip: 0xff8a1c, stripI: 0.8, fog: 0x060403 },
  };

  // ---------------------------------------------------------------- lookups

  function byId(list, id) {
    for (const x of list) if (x.id === id) return x;
    return null;
  }
  function compartment(L, id) { return byId(L.compartments, id); }
  function portalsOf(L, compId) { return L.portals.filter((p) => p.between.indexOf(compId) >= 0); }
  function stationsIn(L, compId) { return (L.stations || []).filter((s) => s.compartment === compId); }
  function systemsIn(L, compId) { return (L.systems || []).filter((s) => s.compartment === compId); }
  function deckById(L, id) { return byId(L.decks, id); }

  /** Volume in cubic metres and floor area in square metres of a compartment. */
  function measure(comp) {
    let v = 0, a = 0;
    for (const b of comp.boxes) {
      const dx = b.x[1] - b.x[0], dy = b.y[1] - b.y[0], dz = b.z[1] - b.z[0];
      v += dx * dy * dz; a += dx * dz;
    }
    return { volume_m3: v, floor_m2: a };
  }

  /** Union bounds of a compartment's boxes. */
  function bounds(comp) {
    const r = { x: [Infinity, -Infinity], y: [Infinity, -Infinity], z: [Infinity, -Infinity] };
    for (const b of comp.boxes) for (const k of "xyz") { r[k][0] = Math.min(r[k][0], b[k][0]); r[k][1] = Math.max(r[k][1], b[k][1]); }
    return r;
  }
  function center(comp) {
    const b = bounds(comp);
    return [(b.x[0] + b.x[1]) / 2, (b.y[0] + b.y[1]) / 2, (b.z[0] + b.z[1]) / 2];
  }

  /** Half extents of a portal's opening on its two in-plane axes. */
  function portalHalf(p) {
    const s = p.size_m;
    if (p.axis === "x") return { z: s[0] / 2, y: s[1] / 2 };
    if (p.axis === "z") return { x: s[0] / 2, y: s[1] / 2 };
    return { x: s[0] / 2, z: s[1] / 2 };
  }

  // ------------------------------------------------------------ room shells

  const EPS = 1e-4;

  // Each face of a box: the axis it is normal to, which end, and its two in-plane axes (u, v).
  const FACES = [
    { key: "floor", axis: "y", end: 0, u: "x", v: "z", inward: [0, 1, 0] },
    { key: "ceiling", axis: "y", end: 1, u: "x", v: "z", inward: [0, -1, 0] },
    { key: "wall", axis: "x", end: 0, u: "z", v: "y", inward: [1, 0, 0] },
    { key: "wall", axis: "x", end: 1, u: "z", v: "y", inward: [-1, 0, 0] },
    { key: "wall", axis: "z", end: 0, u: "x", v: "y", inward: [0, 0, 1] },
    { key: "wall", axis: "z", end: 1, u: "x", v: "y", inward: [0, 0, -1] },
  ];

  /**
   * Rectangle minus holes, as a list of cells. Holes are clipped to the
   * rectangle. Cells come from the grid of every hole edge, so the result is
   * exact and has no slivers, at the price of a few extra triangles.
   */
  function rectMinusHoles(r, holes) {
    const hs = holes
      .map((h) => ({ u0: Math.max(h.u0, r.u0), u1: Math.min(h.u1, r.u1), v0: Math.max(h.v0, r.v0), v1: Math.min(h.v1, r.v1) }))
      .filter((h) => h.u1 - h.u0 > EPS && h.v1 - h.v0 > EPS);
    if (!hs.length) return [r];
    const us = [r.u0, r.u1], vs = [r.v0, r.v1];

      const closing = -new V3().subVectors(b.pos, cam.position).normalize().dot(new V3().subVectors(b.vel, S.ship.vel));
      el(`TGT ${name}${b.state ? " (" + JSTATE[b.state] + ")" : ""}<br>RANGE ${fmt(st.range)} m &nbsp; CLOSING ${fmt(closing)} m/s<br>HIT ${fmt(st.hit * 100)}% &nbsp; AIM ERR ${fmt(st.rms / DEG, 2)} deg rms`, cx + 70, cy + 70, "sight");
    } else el("NO TARGET IN ARC", cx + 70, cy + 70, "sight");
    el(`DORSAL TURRET, MANNED &nbsp; ZOOM 60 deg<br>CAP <span class="hudbar"><i style="width:${(100 * st.cap) / D.cannon.cap}%"></i></span> ${fmt(st.cap, 1)} MJ<br>HEAT<span class="hudbar"><i style="width:${(100 * st.heat) / D.cannon.sink}%;background:${st.lock ? "#ff5252" : "#9ff0c0"}"></i></span> ${fmt(st.heat, 1)} MJ${st.lock ? " LOCKOUT" : ""}<br>${st.inArc ? "ARC CLEAR" : "<span style='color:#ff8a7a'>HULL IN ARC: HOLD</span>"}`, 24, Hh - 230, "sight");
    // off-screen arrows to other threats (star-crew-64's arrows)
    for (const j of S.jackals) if (j.alive && (!st.target || j !== st.target.body)) {
      const s = project(j.pos, cam, vp); if (s && s.x > 0 && s.x < W && s.y > 0 && s.y < Hh) { tagBody(j.pos, 4, j.id, "#ff8a7a", cam, vp); continue; }
      const dL = j.pos.clone().applyMatrix4(cam.matrixWorldInverse), a = Math.atan2(-dL.y, dL.x), r = Math.min(W, Hh) * 0.42;
      el(`<svg width="20" height="20" viewBox="-10 -10 20 20" style="transform:rotate(${a}rad)"><path d="M8 0L-6 -6L-3 0L-6 6Z" fill="#ff8a7a"/></svg>`, cx + Math.cos(a) * r - 10, cy + Math.sin(a) * r - 10, "sight");
    }
  } else if (view === "cockpit") {
    const s1 = S.swifts[0], vp = { x: 0, y: 0, w: W, h: Hh }, rel = s1.vel.clone().sub(S.ship.vel);
    el(`<svg width="60" height="60" viewBox="-30 -30 60 60"><path d="M-22 0H-8M8 0H22M0 -8V-22" stroke="#9ff0c0" stroke-width="1.5" fill="none"/></svg>`, W / 2 - 30, Hh / 2 - 30, "sight");
    tagBody(S.ship.pos, 40, `SCS Tern ${fmt(S.ship.pos.distanceTo(s1.pos))} m`, "#7fd8ff", cam, vp);
    for (const j of S.jackals) if (j.alive && j.pos.distanceTo(s1.pos) < 2500) tagBody(j.pos, 4, `${j.id} ${fmt(j.pos.distanceTo(s1.pos))} m`, "#ff8a7a", cam, vp);
    el(`SWIFT 1 (drone pilot in this mockup) &nbsp; ASSIST FULL<br>SPEED ${fmt(rel.length())} m/s REL TERN &nbsp; ${fmt(s1.vel.length())} m/s SYS<br>PROP <span class="hudbar"><i style="width:86%"></i></span> &nbsp; CAP <span class="hudbar"><i style="width:100%"></i></span><br>SHIELD 8.0 MJ &nbsp; HULL 6.0 MJ &nbsp; DARTS 2 &nbsp; ${s1.phase.toUpperCase()}`, W / 2 - 230, Hh - 210, "sight", "width:470px");
  } else {
    const vp = { x: 0, y: 0, w: W, h: Hh };
    for (const j of S.jackals) if (j.alive && j.pos.distanceTo(cam.position) < 3500) tagBody(j.pos, 4, `${j.id} ${JSTATE[j.state]} ${fmt(j.pos.distanceTo(S.ship.pos))} m`, "#ff8a7a", cam, vp);
    if (S.hound.alive) tagBody(S.hound.pos, 26, `Hound ${fmt(S.hound.pos.distanceTo(S.ship.pos) / 1000, 2)} km`, "#ff8a7a", cam, vp);
    for (const m of S.missiles) if (m.alive) tagBody(m.pos, 3, `${m.name} ${fmt(m.pos.distanceTo(m.owner === "tern" ? S.hound.pos : S.ship.pos))} m to go`, "#ffc04d", cam, vp);
    for (const c of S.swifts) if (c.phase !== "cradle" && c.phase !== "captured") tagBody(c.pos, 4, `${c.name} ${c.phase === "approach" ? "recovery " + fmt(c.capDist || 0) + " m" : c.phase}`, "#7fd8ff", cam, vp);
  }
  for (let i = used; i < pool.length; i++) pool[i].style.display = "none";
}

// ------------------------------------------------------------ the info panel
const info = document.getElementById("info");
function bar(f, col) { return `<span class="bar"><i style="width:${clamp(f, 0, 1) * 100}%;background:${col}"></i></span>`; }
function updateInfo() {
  if (view === "split" || view === "gunner" || view === "cockpit") { info.style.display = "none"; return; }
  info.style.display = "";
  const sh = S.ship, e = shipEuler(), br = S.damp.find((c) => c.id === "bridge");
  let h = `<b>t ${fmt(S.t, 1)} s</b>, tick ${S.tick} at 30 Hz, seed ${S.seed}${paused ? ", paused" : ""}<br>`;
  h += `Tern ${fmt(sh.vel.length())} m/s, bank ${fmt(e.bank)} deg, yaw ${fmt(sh.w.y / DEG, 1)} deg/s, main ${fmt(sh.aMain, 1)} m/s^2${sh.hold ? ", <b>" + sh.hold + "</b>" : ""}<br>`;
  h += `bridge dampers ${fmt(br.D.length(), 1)} / ${fmt(D.dampers.rated * dampSupply)} m/s^2, residual ${fmt(br.E.length(), 2)}`;
  h += `<h4>Turrets (arcs baked from the hull)</h4><table><col style="width:62px"><col style="width:74px"><col style="width:40px"><col><col>`;
  for (const st of S.tur) {
    const tg = st.target ? (st.target.body === S.hound ? "Hound" : st.target.body.id || st.target.body.name) : "none";
    h += `<tr><td class="k">${st.T.name}${st.manned ? "*" : ""}</td><td>${tg}${st.target && st.target.pd ? " PD" : ""}</td><td>${st.sol ? fmt(st.hit * 100) + "%" : ""}</td><td>${bar(st.cap / D.cannon.cap, "#4fc3f7")}</td><td>${bar(st.heat / D.cannon.sink, st.lock ? "#ff5252" : "#ffb300")}</td></tr>`;
  }
  h += `</table><div class="note">hit chance, capacitor, heat; * manned (scripted gunner). Coverage: ${COVER.share.map((s) => fmt(s, 1) + "%").join(", ")}; every direction by 2 or more: ${fmt(COVER.atLeast2, 1)}%</div>`;
  h += `<h4>Shield faces (MJ)</h4><table>`;
  for (let i = 0; i < 6; i += 2) h += `<tr>${[i, i + 1].map((k) => `<td class="k" style="width:58px">${FACE_NAMES[k]}</td><td style="width:26px">${fmt(S.shield.charge[k])}</td><td>${bar(S.shield.charge[k] / D.shield.face, S.shield.charge[k] / D.shield.face < 0.2 ? "#ff5252" : S.shield.charge[k] / D.shield.face < 0.5 ? "#ffb300" : "#4fc3f7")}</td>`).join("")}</tr>`;
  h += `</table><h4>Tubes and bays</h4>`;
  h += `<div class="ev">tube 1 ${S.tubes[0].state}; tube 2 ${S.tubes[1].state}; racks ${S.magazine.racks}</div>`;
  h += `<div class="ev">port bay: ${S.bays.p.step}${S.bays.p.hold ? " (hold)" : ""}</div><div class="ev">starboard bay: ${S.bays.s.step}</div>`;
  h += `<h4>Events</h4>` + S.events.slice(-6).map((ev) => `<div class="ev">${fmt(ev.t, 1)} s: ${ev.text}</div>`).join("");
  h += `<div class="note">Tern LOD0 ${TERN_TRIS.toLocaleString()} triangles of 12,000, ${TERN_CALLS} calls (+1 shield); kit hull caps rewound: ${HULL.flipped} triangles. Fighters steer kinematically here.</div>`;
  info.innerHTML = h;
}

// ------------------------------------------------------------ controls
const ctl = document.getElementById("controls");
const buttons = {};
function group(label) { const s = document.createElement("span"); s.className = "grp"; s.textContent = label; ctl.appendChild(s); }
function button(key, text, fn) { const b = document.createElement("button"); b.textContent = text; b.onclick = () => { fn(); sync(); }; ctl.appendChild(b); buttons[key] = b; return b; }
function setView(v) {
  view = v; controls.enabled = v === "orbit";
  if (v === "orbit") { orbitState.last.copy(S.ship.pos); cam.position.copy(S.ship.pos).add(new V3(90, 45, -110)); controls.target.copy(S.ship.pos); }
}
group("View");
for (const [k, t] of [["chase", "Chase"], ["orbit", "Free orbit"], ["gunner", "Dorsal gunner"], ["cockpit", "Swift cockpit"], ["split", "Split: decoupling"]]) button("view:" + k, t, () => setView(k));
group("Orders");
button("launch", "Launch Swift 1", () => launchCraft("p"));
button("recover", "Recover Swift 2", () => recoverCraft("s"));
button("fire", "Fire tube 1", () => fireTube(0));
button("shield", "Shield shape", () => { showShield = !showShield; });
group("Dampers");
for (const f of [1, 0.5, 0.25, 0]) button("damp:" + f, `${f * 100}%`, () => { dampSupply = f; });
group("Bridge");
for (const k of ["normal", "red_alert"]) button("light:" + k, K.LIGHTING[k].label, () => { lighting = k; applyLighting(); });
group("Sim");
button("pause", "Pause", () => { paused = !paused; });
button("restart", "Restart", () => { reset(1); paused = false; });
function sync() {
  for (const [k, b] of Object.entries(buttons)) {
    let on = k === "view:" + view || k === "light:" + lighting || k === "damp:" + dampSupply;
    if (k === "shield") on = showShield; if (k === "pause") on = paused;
    b.classList.toggle("on", on);
  }
}
addEventListener("resize", () => renderer.setSize(innerWidth, innerHeight));

// ------------------------------------------------------------ shots (seeded; time stepped inside each setup)
function shot(fn) { return () => { shotCam = null; dampSupply = 1; showShield = false; lighting = "red_alert"; applyLighting(); fn(); paused = true; frameNo = 0; sync(); }; }
const fixedCam = (eyeL, lookL, fov) => (c) => { c.fov = fov || 50; placeShipCam(c, eyeL, lookL); };
K.registerShots([
  { name: "chase", setup: shot(() => { reset(1); runUntil(() => S.t >= 32.0, 40); setView("chase"); }) },
  { name: "broadside", setup: shot(() => {
    reset(1); runUntil(() => { const e = lastEvent("pd-kill"); return e && S.t - e.t >= 0.2; }, 60);
    const e = lastEvent("pd-kill"); const at = e ? e.pos.clone().addScaledVector(S.ship.vel, S.t - e.t) : S.hound.pos.clone();
    setView("shot");
    shotCam = (c) => { c.fov = 45; const sp = S.ship.pos, d = at.clone().sub(sp).normalize(), side = new V3().crossVectors(d, new V3(0, 1, 0)).normalize();
      c.position.copy(sp).addScaledVector(d, -105).addScaledVector(side, 38).add(new V3(0, 26, 0)); c.up.set(0, 1, 0); c.lookAt(sp.clone().addScaledVector(d, 210)); c.updateMatrixWorld(true); };
  }) },
  { name: "missile-launch", setup: shot(() => { reset(1); runUntil(() => { const e = lastEvent("gannet-launch"); return e && S.t - e.t >= 0.8; }, 40); setView("shot"); shotCam = fixedCam(new V3(15, 9, 30), new V3(1, 1.5, 55), 48); }) },
  { name: "fighter-drop", setup: shot(() => { lighting = "normal"; reset(1); runUntil(() => { const e = lastEvent("release"); return e && S.t - e.t >= 1.1; }, 40); setView("shot"); shotCam = fixedCam(new V3(30, -25, -36), new V3(7.75, -9, -9), 50); }) },
  { name: "fighter-recovery", setup: shot(() => { reset(1); runUntil(() => { const e = lastEvent("capture"); return e && S.t - e.t >= 1.6; }, 110); setView("shot"); shotCam = fixedCam(new V3(-30, -23, -38), new V3(-7.75, -7.5, -9), 50); }) },
  { name: "fighter-cockpit", setup: shot(() => { reset(1); runUntil(() => S.t > 30 && S.swifts[0].phase === "flying" && S.swifts[0].pos.distanceTo(toWorld(S.swifts[0].station, new V3())) < 12, 70); setView("cockpit"); }) },
  { name: "gunner-view", setup: shot(() => { reset(1); runUntil(() => { const st = S.tur[0]; return S.t > 6 && st.target && st.target.body.state && st.sol && st.range < 1000 && st.hit > 0.05 && st.shots > 2; }, 60); setView("gunner"); }) },
  { name: "decoupling-split", setup: shot(() => { lighting = "red_alert"; applyLighting(); reset(1); runUntil(() => S.t > 15 && shipEuler().bank < -38 && Math.abs(S.ship.w.y) > 4 * DEG, 60); setView("split"); }) },
  { name: "decoupling-normal", setup: shot(() => { lighting = "normal"; applyLighting(); reset(1); runUntil(() => S.t > 36 && shipEuler().bank > 12 && Math.abs(S.ship.w.y) > 1.5 * DEG, 80); setView("split"); }) },
  { name: "shields-hit", setup: shot(() => {
    reset(1, { turretMode: "fighters only" });
    runUntil(() => { const e = lastEvent("shield-hit"); return e && e.E >= 20 && S.t - e.t >= 0.06; }, 60);
    const e = lastEvent("shield-hit"), f = e ? e.face : 2, n = [new V3(0, 0, 1), new V3(0, 0, -1), new V3(1, 0, 0), new V3(-1, 0, 0), new V3(0, 1, 0), new V3(0, -1, 0)][f];
    setView("shot");
    shotCam = (c) => { c.fov = 50; placeShipCam(c, D.shield.centre.clone().addScaledVector(n, 120).add(new V3(n.z !== 0 ? 50 : 0, 38, n.z === 0 ? -55 : 0)), D.shield.centre.clone()); };
  }) },
]);
window.EXT_DEBUG = { reset, runUntil, get S() { return S; }, step, lastEvent, COVER, TERN_TRIS, HULL };

// ------------------------------------------------------------ start
reset(1);
applyLighting();
if (navigator.webdriver) { runUntil(() => S.t >= 32.0, 40); paused = true; }
else runUntil(() => S.t >= 2.0, 10);
setView(navigator.webdriver ? "orbit" : "chase"); sync();
let first = true, lastT = performance.now(), acc = 0;
renderer.setAnimationLoop(() => {
  const now = performance.now(), dt = Math.min(0.25, (now - lastT) / 1000); lastT = now;
  if (!paused) { acc += dt; let n = 0; while (acc >= DT && n < 8) { step(); acc -= DT; n++; } if (n >= 8) acc = 0; }
  syncScene(view);
  hud.beginFrame(renderer);
  render();
  hud.endFrame(renderer);
  overlay();
  if (frameNo % 6 === 0 || first) updateInfo();
  frameNo++;
  if (first) { first = false; K.markReady(); }
});
</script>
</body>
</html>
