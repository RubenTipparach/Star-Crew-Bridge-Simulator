<!doctype html>
<!--
  exterior.html: the SCS Tern from outside, presenting four changes at once:
  ship-frames (the interior held level while the hull rolls, the far and near
  exterior layers, attachments posed in the ship frame, hand-off at a tick),
  weapons-and-shields (turrets, arcs baked from the hull, the lead solver and
  hit chance, point defence, the Gannet, six shield faces), shuttle-bay-and-fighters
  (a Swift dropped from the port bay and another recovered into the starboard
  bay) and flight-and-navigation (the assisted Newtonian ship, the recovery and
  launch holds, the dampers' demand).

  Built from data/ships/tern/layout.json (schema 2: rooms are convex brushes
  that follow the hull), data/ships/tern/detailing.json and the Material Maker
  layers of data/materials/materials.json through shipkit.js (all inlined below
  by tools/mockups/inline.py; never hand-edit between the INLINE markers). The
  hull is textured with the "hull" and "hull_dark" layers and lit by the sun;
  the bridge and the launch bays are the kit's textured, detailed compartment
  meshes, baked from their own lamps in the chosen lighting state. The
  simulation steps a fixed 1/30 s tick and is seeded, so every shot is the same
  every run. Numbers come from the four designs; where the mockup simplifies a
  rule (fighters steer kinematically, the ship's inertia is a rate limit) the
  info panel says so.
-->

<style>

  .controls button.on { border-color: var(--accent); color: var(--accent); }

  .info b { color: var(--fg); }
  .info h4 { margin: 6px 0 2px; font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; }
  .info table { border-collapse: collapse; width: 100%; table-layout: fixed; }

  .info td.k { font-family: system-ui, sans-serif; color: var(--dim); }
  .info .bar { display: inline-block; width: 100%; height: 6px; background: #1a222c; border-radius: 2px; position: relative; vertical-align: middle; }
  .info .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; }
  .info .ev { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10.5px; color: #b6c2ce; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; height: 14px; }
  .info .note { color: #7f8fa0; font-size: 10.5px; margin-top: 4px; }
  #ov { position: fixed; inset: 0; z-index: 5; pointer-events: none; overflow: hidden; }
  .tag { position: absolute; font: 600 10.5px/1.2 ui-monospace, Menlo, Consolas, monospace; white-space: nowrap; }
  .tag .bx { position: absolute; border: 1.5px solid currentColor; box-sizing: border-box; }
  .tag .tx { position: absolute; left: 0; top: 0; padding: 1px 4px; background: rgba(4,7,12,0.7); border-radius: 2px; }
  .cap { position: absolute; background: rgba(6,9,14,0.86); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; font-size: 12px; color: #d8e2ec; box-sizing: border-box; }
  .cap b { color: #fff; }
  .cap .big { font: 600 15px/1.3 system-ui, sans-serif; }
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
  .sight { position: absolute; color: #9ff0c0; font: 600 12px/1.3 ui-monospace, Menlo, Consolas, monospace; }
  .hudbar { display: inline-block; width: 120px; height: 7px; background: rgba(20,40,30,0.8); border: 1px solid #3c6a50; position: relative; vertical-align: middle; margin-left: 6px; }
  .hudbar i { position: absolute; left: 0; top: 0; bottom: 0; background: #9ff0c0; }
  @media (max-width: 640px) { .controls { max-width: calc(100vw - 24px); bottom: 120px; } .info { display: none; } }

{"schema":"starcrew.detailing/1","status":"Proposed (2026-10-05) by openspec/changes/deck-pipeline, section 5a. Read by docs/mockups/lib/shipkit.js today and by deckc once it is built; the sizes are first choices judged on mockup screenshots, not measurements.","_rules":["The detail a ship's decks are dressed with is generated from its layout by one rule set, so every room of a class reads alike and no room is decorated by hand (deck-pipeline section 5a; adapted from Undercity's tools/godot/detailing.py and its UT99 checklist, fps-game-demo f6cd25c).","Detail is not air: coves, ribs, beams and trims stand inside a compartment's brushes and the air model ignores them (life-support quotes brush volumes).","No z-fighting: every detail face is either pressed back to back against a wall, floor or ceiling (and not drawn), or stands at least 1 cm clear of any parallel face (CLAUDE.md section 8). Raised floor plates are raise_m above the floor for that reason.","Lengths in metres. A detail that would cross a portal opening is cut back to clear it; one that would be shorter than min_piece_m is dropped."],"frames":{"_doc":"Ship frames: ribs on the walls and beams under the ceiling at fixed stations along the keel, frame k at z = origin_z_m + k * spacing_m. Walls that run fore and aft carry ribs at the frames; walls that run athwartships carry stiffeners at x = (k + 1/2) * spacing_m. A room taller than the cove's tall_room_m gets the deep beams and ribs.","spacing_m":2.0,"origin_z_m":0.0,"end_clear_m":0.35,"rib_width_m":0.24,"rib_depth_m":0.12,"tall_rib_depth_m":0.22,"beam_width_m":0.24,"beam_depth_m":0.18,"deep_beam_depth_m":0.38,"portal_clear_m":0.1},"cove":{"_doc":"A 45 degree panel between every solid wall and the ceiling: the hull's octagonal section, echoed inside. Not drawn along an edge open to another brush of the same compartment.","size_m":0.35,"tall_size_m":0.6,"tall_room_m":3.6},"baseboard":{"height_m":0.14,"depth_m":0.03},"door_frame":{"_doc":"Every door, wall hatch and pressure door is framed: jambs and a lintel fill a ring cut around the clear opening (size_m stays the clear opening crew pass through), proud of the wall on each side. Pressure doors are heavier and hazard-striped. A status strip glows on the lintel.","jamb_m":0.16,"lintel_m":0.22,"proud_m":0.06,"pressure_jamb_m":0.26,"pressure_proud_m":0.12,"status_strip_m":[0.5,0.05]},"window_frame":{"frame_m":0.14,"proud_m":0.08,"sill_depth_m":0.16},"floor_portal":{"_doc":"A hazard rim on the floor around every hatch, ladder well, hoist and bay door, and a trim collar under the ceiling around it. Ladders get rails and rungs from the lower floor to ladder_above_m over the upper one.","rim_width_m":0.15,"raise_m":0.012,"collar_width_m":0.1,"collar_depth_m":0.1,"ladder_rail_m":0.05,"ladder_width_m":0.5,"rung_spacing_m":0.3,"ladder_above_m":1.0},"railing":{"_doc":"Along an edge where a brush opens onto a lower floor of the same compartment (a hangar gallery over the hangar floor): two rails, posts and a kick plate.","min_drop_m":0.5,"height_m":1.05,"post_m":0.06,"post_spacing_m":1.5,"inset_m":0.05,"kick_m":0.12},"platforms":{"_doc":"Raised floors that are solid, not air (a dais, a work ring, a sub-platform; bridge-stations section 11a): a riser and a hazard nosing on every edge that is not against a wall, a railing on rail edges with gaps at stairs, treads of tread_rise_m.","tread_rise_m":0.225,"nosing_m":0.05,"nosing_raise_m":0.012,"rail_height_m":0.75,"rail_mid_m":0.375,"rail_m":0.05,"rail_inset_m":0.08,"rail_end_m":0.1,"rail_post_spacing_m":1.2},"kicks":{"_doc":"Kick lights (openspec/changes/kick-lights): indirect light at the foot of platform edges and consoles. platform: every edge of a kind in on is undercut at its foot by a recess height_m high and depth_m deep (the wall banks' own toe kick), a strip on a chamfer chamfer_m square at the back of the recess's ceiling, facing out and down. props: each console family's strips in prop space (props.json's frame: +Y up, +Z towards the operator, the origin on the floor at the centre of the back): y_m and z_m the strip's bottom and top edges (z at each), x_m its half width, x_inset_m in from the prop's bounds, or beside_m out from the bounds (a strip each side), normal the way it faces, type its fixture type (kick_strip unless named: column_strip for the light columns behind the terminals).","platform":{"height_m":0.1,"depth_m":0.08,"chamfer_m":0.03,"on":["riser","rail"]},"props":{"wall_bank":[{"name":"front","y_m":[0.005,0.095],"z_m":[0.532,0.532],"x_inset_m":0.03,"normal":[0,0,1]},{"name":"columns","type":"column_strip","y_m":[0.15,2.05],"z_m":[0.012,0.012],"beside_m":[0.03,0.08],"normal":[0,0,1]}],"free_console":[{"name":"front","y_m":[0.06,0.1],"z_m":[0.286,0.295],"x_m":0.34,"normal":[0,-0.227,0.974]},{"name":"back","y_m":[0.06,0.1],"z_m":[-0.012,-0.012],"x_m":0.34,"normal":[0,0,-1]}]}},"runner":{"_doc":"A deck plate strip down the middle of every corridor.","width_m":0.9,"raise_m":0.012,"end_clear_m":0.05},"conduits":{"_doc":"Two pipes along the top of every fore-and-aft corridor wall, below the cove and clear of the ribs.","radii_m":[0.06,0.04],"gap_m":0.06,"drop_m":0.1,"sides":8},"lamps":{"_doc":"The lamp rule (deck-pipeline section 5): lamps sit in the bays between frames, never on a beam. A bay gets round(area / area_per_lamp_m2) lamps across its width, a corridor bay at least one, a pod one. Every emergency_every-th lamp of a compartment is on the emergency bus. A room taller than tall_room_m gets high-bay lamps: radius and size scale with its height over 3 m, and they hang hang_m below the ceiling.","area_per_lamp_m2":8.0,"min_bay_m":1.0,"wall_clear_m":0.6,"emergency_every":3,"panel_m":[0.9,0.45],"corridor_panel_m":[0.7,0.35],"housing_m":0.06,"radius_m":3.0,"tall_room_m":3.6,"hang_m":0.4,"keep_out_m":0.5},"finishes":{"_doc":"Which material (data/materials/materials.json) each generated surface takes, by the compartment's finish in the layout.","crew":{"floor":"deck_tiles","wall":"bulkhead","ceiling":"ceiling","cove":"trim","rib":"trim","beam":"trim","baseboard":"trim","frame":"trim","frame_hazard":"hazard","status":"light_panel","kick_strip":"light_panel","window_frame":"trim","rim":"hazard","collar":"trim","ladder":"trim","runner":"deck_plate","pipe":"machinery","railing":"trim","kickplate":"hazard","lamp_housing":"trim","lamp":"light_panel","platform":"deck_tiles","riser":"trim","nosing":"hazard","stair":"deck_plate"},"working":{"floor":"deck_plate","wall":"bulkhead","ceiling":"machinery","cove":"trim","rib":"machinery","beam":"machinery","baseboard":"hazard","frame":"trim","frame_hazard":"hazard","status":"light_panel","kick_strip":"light_panel","window_frame":"trim","rim":"hazard","collar":"machinery","ladder":"trim","runner":"deck_tiles","pipe":"machinery","railing":"trim","kickplate":"hazard","lamp_housing":"machinery","lamp":"light_panel","platform":"deck_plate","riser":"machinery","nosing":"hazard","stair":"deck_plate"}}}
</script>

<script id="ship-materials" type="application/json">
{"manifest":{"schema":"starcrew.materials/1","status":"Built (2026-10-05) by tools/materials/postprocess.py into assets/textures/<name>.png; see the material-maker skill. No engine code reads these layers yet. The ramps are first choices made by eye on the contact sheet (docs/screenshots/materials/contact-sheet.png), not decisions.","_rules":["This file is the one source for Star Crew's surface materials: which Material Maker graph each comes from, its size in the world, and how its render is post-processed. The deck build, the mockups and the engine read it; nothing keeps a second list.","Every material is one layer of one texture array. Every layer is 128 x 128 px (layers.px), RGBA8, whatever the material.","Interior layers span 2.0 m, so 64 px per metre; exterior layers span 4.0 m, so 32 px per metre (layers.*_span_m). A surface's UVs are its world position divided by its material's span_m, so texel density never changes between materials of the same space.","tile_m is the world size of one repeat of the graph. A graph smaller than the span is tiled k x k inside the layer; a graph larger than the span gives the layer its top-left 1/k. Either way span_m / tile_m (or its inverse) is whole, so the layer tiles seamlessly.","Sampling: nearest on magnification, mipmapped on minification (layers.mag_filter, layers.min_filter), so a wall up close shows crisp texels and a far one does not shimmer.","The baked vertex light multiplies the texel. There is no per-pixel lighting on the Pi 5, so a graph's normal map and occlusion are baked into the albedo under one fixed key light from the top of the layer (bake.key_light_tangent), by relief.","Alpha is the emission mask: 255 shows the texel at full brightness whatever the light, 0 lights it only by the baked vertex light; in between blends the two. Non-emissive layers have alpha 0 everywhere, so an image viewer shows them as transparent; their colour is intact. Never premultiply alpha or let a tool strip colour under zero alpha.","Knobs, with postprocess.py DEFAULTS for any left out: ramp [[r, g, b] dark, [r, g, b] light] in 0-1 sRGB recolours by luminance, stretched so the material's darkest texels (bake.ramp_stretch_percentiles low) take the dark colour and its lightest the light one (default none); ramp_mix 0-1 blends the ramp over the original (default 1); relief 0-1 blends the albedo toward albedo * shade (default 1); relief_ambient 0-1 is the shade of a face turned away from the key light (default 0.45); colours 2-256 is a median-cut palette per layer, null for none (default 32); emissive true takes the alpha from the graph's emission map (default false).","layer is the material's index in the array. It is stable: a compiled deck names materials by it. Add a material at the end; never renumber.","Units: metres (_m), pixels (px), sRGB colour components in 0-1."],"layers":{"px":128,"interior_span_m":2.0,"exterior_span_m":4.0,"format":"RGBA8: sRGB colour, linear alpha (the emission mask)","mag_filter":"NEAREST","min_filter":"LINEAR_MIPMAP_LINEAR"},"bake":{"key_light_tangent":[0.0,1.0,1.0],"luminance_weights":[0.2126,0.7152,0.0722],"ramp_stretch_percentiles":[1.0,99.0]},"materials":{"bulkhead":{"layer":0,"role":"Walls of every compartment.","source":{"graph":"tech_panel","provenance":"fps-game-demo f6cd25c tools/material_maker/ptex/tech_panel.ptex, authored by its build_ptex.py"},"tile_m":2.0,"span_m":2.0,"ramp":[[0.12,0.15,0.19],[0.6,0.65,0.7]],"ramp_mix":0.9,"relief":1.0,"colours":32},"deck_tiles":{"layer":1,"role":"Floors in crew spaces: bridge, corridors, quarters, mess, medbay.","source":{"graph":"floor_tiles","provenance":"fps-game-demo f6cd25c tools/material_maker/ptex/floor_tiles.ptex, authored by its build_ptex.py"},"tile_m":2.0,"span_m":2.0,"ramp":[[0.05,0.06,0.08],[0.4,0.44,0.5]],"ramp_mix":0.9,"relief":1.0,"colours":32},"deck_plate":{"layer":2,"role":"Floors in working spaces: engineering, hangar, bays, cargo, magazine, torpedo room, drive.","source":{"graph":"diamond_plate","provenance":"fps-game-demo f6cd25c tools/material_maker/ptex/diamond_plate.ptex: Material Maker example metal_pattern (MIT, Rodolphe Suescun and contributors) with fps's metallic patch"},"tile_m":2.0,"span_m":2.0,"ramp":[[0.14,0.15,0.17],[0.41,0.44,0.48]],"ramp_mix":0.9,"relief":1.0,"colours":32},"ceiling":{"layer":3,"role":"Ceilings of every compartment.","source":{"graph":"ceiling_tiles","provenance":"fps-game-demo f6cd25c tools/material_maker/ptex/ceiling_tiles.ptex, authored by its build_ptex.py"},"tile_m":2.0,"span_m":2.0,"ramp":[[0.12,0.13,0.15],[0.55,0.57,0.6]],"ramp_mix":0.9,"relief":1.0,"colours":32},"trim":{"layer":4,"role":"Frames, ribs, baseboards, door frames and beams.","source":{"graph":"tech_panel","provenance":"fps-game-demo f6cd25c tools/material_maker/ptex/tech_panel.ptex, authored by its build_ptex.py"},"tile_m":4.0,"span_m":2.0,"ramp":[[0.22,0.24,0.27],[0.8,0.82,0.85]],"ramp_mix":0.9,"relief":1.0,"colours":32},"hazard":{"layer":5,"role":"Bay edges, stair nosings and hatch rims.","source":{"graph":"hazard_stripes","provenance":"fps-game-demo f6cd25c tools/material_maker/ptex/hazard_stripes.ptex, authored by its build_ptex.py"},"tile_m":1.0,"span_m":2.0,"relief":1.0,"colours":32},"light_panel":{"layer":6,"role":"Lamp fixtures: ceiling panels and strips. Emissive.","source":{"graph":"light_panel","provenance":"fps-game-demo f6cd25c tools/material_maker/ptex/light_panel.ptex, authored by its build_ptex.py"},"tile_m":1.0,"span_m":2.0,"relief":1.0,"colours":32,"emissive":true},"machinery":{"layer":7,"role":"System housings, the reactor, pipes and console bodies.","source":{"graph":"rust_metal","provenance":"fps-game-demo f6cd25c tools/material_maker/ptex/rust_metal.ptex, authored by its build_ptex.py"},"tile_m":2.0,"span_m":2.0,"ramp":[[0.1,0.105,0.115],[0.38,0.385,0.38]],"ramp_mix":0.95,"relief":1.0,"colours":32},"crate":{"layer":8,"role":"Cargo crates.","source":{"graph":"crate","provenance":"fps-game-demo f6cd25c tools/material_maker/ptex/crate. <script>
/*
 * shipkit.js: the one place a mockup turns a ship layout into three.js objects.
 *
 * Every Star Crew mockup reads the same layout (data/ships/<id>/layout.json), so
 * the bridge, the deck plan, the systems view and the exterior cannot disagree
 * about where a room or a door is (CLAUDE.md sections 8 and 11). This file is
 * the shared interpretation of that layout: palette, lighting states, the Pi 5
 * budget meter, room shells with door openings cut, the generated detail (frames,
 * coves, trims, door frames, conduits, lamps), the Material Maker texture array,
 * the hull loft and labels.
 *
 * Layout schema starcrew.ship-layout/2: a compartment's air is the union of
 * convex prisms ("brushes"), a footprint polygon in plan and a floor and ceiling
 * height, so rooms follow the hull (openspec/changes/reference-ship-tern). The
 * detail rules and their sizes are data/ships/<id>/detailing.json
 * (openspec/changes/deck-pipeline, section 5a); the materials are
 * data/materials/materials.json (openspec/changes/surface-materials). This kit is
 * the mockups' implementation of those rules; deckc will be the engine's.
 *
 * It is a classic script, not a module, so a mockup still works when opened
 * straight from disk. tools/mockups/inline.py copies it into each page between
 * the "INLINE shipkit" markers; edit it here, never in a page. Functions that
 * build geometry take THREE as their first argument because the page owns the
 * three.js import.
 *
 * Axes (from the layout): +X port, +Y up, +Z bow, metres. Plan points are [x, z].
 */
(function () {
  "use strict";

  /** The layout inlined into the page as <script id="ship-layout" type="application/json">. */
  function layout() {
    const el = document.getElementById("ship-layout");
    if (!el) throw new Error("shipkit: no #ship-layout script in the page (run tools/mockups/inline.py)");
    const L = JSON.parse(el.textContent);
    if (L.schema !== "starcrew.ship-layout/2") throw new Error("shipkit: layout schema " + L.schema + ", expected starcrew.ship-layout/2");
    return L;
  }

  /** A ship data file inlined as <script id="ship-data-<name>">, e.g. "detailing", "power". */
  function shipData(name) {
    const el = document.getElementById("ship-data-" + name);
    if (!el) throw new Error(`shipkit: no #ship-data-${name} script in the page (add <!-- INLINE data:<ship>/${name} --> markers and run tools/mockups/inline.py)`);
    return JSON.parse(el.textContent);
  }

  /**
   * The Raspberry Pi 5 (1 GB) budget a mockup is measured against. These are
   * the provisional numbers from openspec/changes/engine-stack/design.md,
   * "The Pi 5 budget"; that table is the source, and this copy is checked
   * against its marker by tools/mockups/inline.py --check.
   */
  const PI_BUDGET = {
    board: "Pi 5 (1 GB)",
    triangles: 200000,       // visible triangles per frame, all passes
    drawCalls: 300,          // draw calls per frame, all passes
    textureMB: 96,           // texture memory
    viewscreenPx: [1024, 512], // render-to-texture size for the main viewscreen
    frameMs: 16.7,           // 60 frames a second target (33.3 ms floor), 3D at 1280x720
  };

  /** Named colour roles. Mockups use roles, not hex values (CLAUDE.md section 10). */
  const PALETTE = {
    space: 0x05070d,
    hullLight: 0x8f9aa8,
    hullDark: 0x4a5462,
    hullAccent: 0xc9643b,
    floor: 0x3a404a,
    floorCorridor: 0x454b55,
    wall: 0x6b7480,
    wallDark: 0x525a66,
    ceiling: 0x2c3138,
    trim: 0x9aa4b0,
    console: 0x2a3038,
    screen: 0x48d6ff,
    screenWarm: 0xffb347,
    glass: 0x9fd8ff,
    door: 0x8a6d3b,
    doorFrame: 0xd0a040,
    hazard: 0xe8c547,
    alert: 0xff2a2a,
    emergency: 0xff8a1c,
    lampWarm: 0xffe2b0,
    lampCool: 0xbfe0ff,
    statusOk: 0x5ee08a,
    // station roles, used for seats, labels and console accents
    role: {
      command: 0xf2f2f2,
      helm: 0x4fc3f7,
      tactical: 0xef5350,
      engineering: 0xffb300,
      science: 0x66bb6a,
      comms: 0xab47bc,
      flight_ops: 0x26c6da,
      gunner: 0xff7043,
    },
    // upholstery and bedding in the side rooms (command-suite): the captain's rooms, and the crew's
    furniture: { captain: 0x8a3b3b, crew: 0x3f5f88 },
    // portal kinds, used by plan views and door markers (one table for the mockups and
    // tools/deck_plans.py, which parses it from here)
    portal: {
      door: 0xd0a040,
      pressure_door: 0xff8a1c,
      hatch: 0x9aa4b0,
      ladder: 0xbfe0ff,
      hoist: 0xffb347,
      window: 0x9fd8ff,
      bay_door: 0xff2a2a,
    },
    // compartment kinds, used by plan views
    kind: {

      corridor: 0x7d8792,
      bay: 0x4a6a8a,
      crawlspace: 0x6a5a4a,
      airlock: 0xb08a3a,
      pod: 0xa05050,
    },
  };

  /**

   * colours and intensities. status is the door status strips' colour; kick the kick strips' (openspec/changes/
   * kick-lights: the blue of the owner's reference K1 in normal light).
   */
  const LIGHTING = {
