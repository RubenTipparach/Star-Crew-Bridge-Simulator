    /** An axis-aligned or oriented block at c (half sizes along e1, e2, e3), all six faces, one row. */
    function block(role, c, axes, hs, rowName) {
      const [v0, v1] = row(rowName);
      for (let a = 0; a < 3; a++) for (const s of [1, -1]) {
        const b1 = (a + 1) % 3, b2 = (a + 2) % 3, o = add(c, mul(axes[a], s * hs[a]));
        const p = [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([i, j]) => add(o, add(mul(axes[b1], i * hs[b1]), mul(axes[b2], j * hs[b2]))));
        quadUv(role, p, [[0, v0], [2 * hs[b1] / fit.span, v0], [2 * hs[b1] / fit.span, v1], [0, v1]], mul(axes[a], s));
      }
    }

    // Pipe runs.
    for (const run of E.runs || []) {
      const P = run.points_m, r = run.dia_m / 2, n = run.dia_m >= 0.3 ? 8 : 6, R = run.dia_m;
      const d = []; for (let i = 0; i + 1 < P.length; i++) d.push(unit(sub(P[i + 1], P[i])));
      const tl = [0];   // tangent length cut from each corner by its elbow
      for (let i = 1; i + 1 < P.length; i++) tl.push(R * Math.tan(Math.acos(Math.max(-1, Math.min(1, dot(d[i - 1], d[i])))) / 2));
      tl.push(0);
      const rings = []; let u = 0;
      const push = (c, t, du) => { u += du; rings.push({ c, t, u }); };
      push(P[0], d[0], 0);
      for (let i = 0; i + 1 < P.length; i++) {
        const end = sub(P[i + 1], mul(d[i], tl[i + 1]));
        push(end, d[i], Math.hypot(...sub(end, rings[rings.length - 1].c)));
        if (i + 2 < P.length && tl[i + 1] > 1e-6) {   // the elbow at P[i+1], from d[i] to d[i+1]
          const th = Math.acos(Math.max(-1, Math.min(1, dot(d[i], d[i + 1])))), m = unit(sub(d[i + 1], mul(d[i], Math.cos(th))));
          const C = add(end, mul(m, R)), seg = Math.max(1, Math.round((4 * th) / (Math.PI / 2)));
          for (let k = 1; k <= seg; k++) {
            const ph = (th * k) / seg;
            push(add(C, add(mul(m, -R * Math.cos(ph)), mul(d[i], R * Math.sin(ph)))), unit(add(mul(m, Math.sin(ph)), mul(d[i], Math.cos(ph)))), (R * th) / seg);
          }
        }
      }
      tube("fit_pipe", rings, r, n, "pipe");
      // Flanges: at a free end (the reactor's nozzle, the ceiling, a loop's joint) and every 6 m; a port has its own.
      const endFlange = (e, at, t) => {
        if (e.port || e.tee) return;
        if (e.reactor !== undefined) { ring(add(at, mul(t, 0.24)), t, r, r * 1.35, 0.08, n, "collar"); return; }
        if (e.ceiling) { ring(add(at, mul(t, -0.05)), t, r, r * 1.4, 0.1, n, "collar"); return; }
        ring(at, t, r, r * 1.3, 0.06, n, "collar");
      };
      endFlange(run.from, P[0], mul(d[0], run.from.reactor !== undefined ? 1 : -1));
      if (!run.to.loop) endFlange(run.to, P[P.length - 1], run.to.reactor !== undefined ? mul(d[d.length - 1], -1) : d[d.length - 1]);
      const total = rings[rings.length - 1].u;
      for (let s = 6; s < total - 1; s += 6) {
        let k = 1; while (k < rings.length - 1 && rings[k].u < s) k++;
        const g0 = rings[k - 1], g1 = rings[k], f = (s - g0.u) / Math.max(1e-6, g1.u - g0.u);
        if (Math.abs(dot(g0.t, g1.t)) > 0.999) ring(add(g0.c, mul(sub(g1.c, g0.c), f)), g0.t, r, r * 1.3, 0.06, n, "collar");
      }
      // Collars where a vertical leg passes a slab: on its top and under it.
      for (let i = 0; i + 1 < P.length; i++) {
        if (Math.abs(d[i][1]) < 0.999) continue;
        const lo = Math.min(P[i][1], P[i + 1][1]), hi = Math.max(P[i][1], P[i + 1][1]);
        for (const sl of slabs || []) {
          if (lo < sl.y - sl.below_m - 0.1 && hi > sl.y + 0.1) {
            for (const [y, s] of [[sl.y + 0.03, 1], [sl.y - sl.below_m - 0.03, -1]]) ring([P[i][0], y, P[i][2]], [0, 1, 0], r, r + 0.08, 0.06, n, "collar");
          }
        }
      }
      // Hangers: a rod from the pipe's top up to what is over it, and a clamp band round the pipe.
      for (const [x, y0, y1, z] of run.hangers || []) {
        const c = [x, y0 - r, z];
        let t = d[0], best = Infinity;   // the leg the hanger stands on: the nearest to it
        for (let i = 0; i < d.length; i++) {
          const q = sub(c, P[i]), s = Math.max(0, Math.min(Math.hypot(...sub(P[i + 1], P[i])), dot(q, d[i]))), e = Math.hypot(...sub(q, mul(d[i], s)));
          if (e < best) { best = e; t = d[i]; }
        }
        ring(c, t, r, r + 0.03, 0.05, n, "collar");
        tube("fit_rod", [{ c: [x, y0 + 0.03, z], t: [0, 1, 0], u: 0 }, { c: [x, y1, z], t: [0, 1, 0], u: y1 - y0 }], 0.02, 6, "rail");
      }
    }
    // Trays and busbars: a box per leg, its width across both legs at a corner; a junction box at each corner.
    for (const tr of E.trays || []) {
      const P = tr.points_m, [w, dpt] = tr.size_m, j = Math.max(w, dpt) / 2;
      const d = []; for (let i = 0; i + 1 < P.length; i++) d.push(unit(sub(P[i + 1], P[i])));
      const horiz = d.map((v) => Math.abs(v[1]) < 0.5);
      for (let i = 0; i < d.length; i++) {
        let wa;
        if (horiz[i]) wa = unit([-d[i][2], 0, d[i][0]]);
        else { const h = d[i + 1] && horiz[i + 1] ? d[i + 1] : d[i - 1] && horiz[i - 1] ? d[i - 1] : [1, 0, 0]; wa = unit([-h[2], 0, h[0]]); }
        const a = i > 0 ? add(P[i], mul(d[i], j)) : P[i], b = i + 2 < P.length ? sub(P[i + 1], mul(d[i], j)) : P[i + 1];
        member("fit_tray", a, b, wa, w, dpt, horiz[i] ? "housing" : "kick");
        // A turn in the horizontal plane gets a flat junction the tray's depth; a turn up or down a cube.
        if (i + 2 < P.length) block("fit_tray", P[i + 1], [[1, 0, 0], [0, 1, 0], [0, 0, 1]], [j, horiz[i] && horiz[i + 1] ? dpt / 2 : j, j], "kick");
      }
    }
    // Railings: posts at every vertex and at most 1.6 m apart, a top rail capped at each corner, a mid rail. Each member
    // differs from the one it crosses by at least 1 cm a side (posts 30 mm, mid rail 50, top rail 60, caps 75), so no two
    // share a plane (CLAUDE.md section 8).
    const H = 1.05, tr = 0.03, mr = 0.025, pr = 0.015, cr = 0.0375;
    for (const rl of E.railings || []) {
      const P = rl.points_m.slice(); if (rl.closed) P.push(P[0]);
      const corner = (i) => rl.closed || (i > 0 && i < P.length - 1);
      for (let i = 0; i + 1 < P.length; i++) {
        const a = P[i], b = P[i + 1], t = unit(sub(b, a)), th = unit([t[0], 0, t[2]]), wa = unit([-th[2], 0, th[0]]);
        const top = (p) => [p[0], p[1] + H, p[2]], mid = (p) => [p[0], p[1] + H * 0.5, p[2]];
        const cut = (p, s, by) => add(p, mul(t, (s * by) / Math.max(0.3, Math.hypot(t[0], t[2]))));
        member("fit_railing", top(cut(a, corner(i) ? 1 : 0, tr)), top(cut(b, corner(i + 1) ? -1 : 0, tr)), wa, 2 * tr, 2 * tr, "rail");
        member("fit_railing", mid(cut(a, 1, pr + 0.02)), mid(cut(b, -1, pr + 0.02)), wa, 2 * mr, 2 * mr, "rail");
        const len = Math.hypot(...sub(b, a)), k = Math.max(1, Math.ceil(len / 1.6));
        const post = (p) => member("fit_railing", p, [p[0], p[1] + H - tr, p[2]], [1, 0, 0], 2 * pr, 2 * pr, "rail");
        for (let q = 0; q < k; q++) post(add(a, mul(sub(b, a), q / k)));
        if (!rl.closed && i + 2 === P.length) post(b);
        if (corner(i + 1) || (rl.closed && i + 2 === P.length)) block("fit_railing", top(b), [[1, 0, 0], [0, 1, 0], [0, 0, 1]], [cr, cr, cr], "rail");
      }
    }
    for (const rd of E.rods || []) tube("fit_rod", [{ c: rd.from_m, t: unit(sub(rd.to_m, rd.from_m)), u: 0 }, { c: rd.to_m, t: unit(sub(rd.to_m, rd.from_m)), u: Math.hypot(...sub(rd.to_m, rd.from_m)) }], rd.dia_m / 2, 6, "rail");
    for (const rw of E.runways || []) member("fit_tray", rw.from_m, rw.to_m, [1, 0, 0], rw.size_m[0], rw.size_m[1], "housing", ["+w", "-w", "+d", "-d"]);
  }

  function hullGeometry(THREE, L, opts) {
    opts = opts || {};
    const inflate = opts.inflate_m || 0;
    const secs = L.hull.sections.slice().sort((a, b) => a.z_m - b.z_m);
    const ring = (s) => {
      const hw = s.half_beam_m + inflate, top = s.top_m + inflate, bot = s.bottom_m - inflate, c = s.chamfer_m;
      // Eight points, counter-clockwise seen from the bow (+Z), starting at the top port corner.
      return [
        [hw - c, top], [-(hw - c), top], [-hw, top - c], [-hw, bot + c],
        [-(hw - c), bot], [hw - c, bot], [hw, bot + c], [hw, top - c],
      ].map((p) => [p[0], p[1], s.z_m]);
    };
    const rings = secs.map(ring);
    const pos = [];
    const tri = (a, b, c) => pos.push(...a, ...b, ...c);
    for (let i = 0; i + 1 < rings.length; i++) {
      const r0 = rings[i], r1 = rings[i + 1];
      for (let k = 0; k < 8; k++) {
        const k2 = (k + 1) % 8;
        tri(r0[k], r0[k2], r1[k2]);
        tri(r0[k], r1[k2], r1[k]);
      }
    }
    // Caps: stern (first ring) and bow (last ring), fanned from the centre.
    const cap = (r, flip) => {
      const c = r.reduce((a, p) => [a[0] + p[0] / 8, a[1] + p[1] / 8, a[2] + p[2] / 8], [0, 0, 0]);
      for (let k = 0; k < 8; k++) {
        const k2 = (k + 1) % 8;
        if (flip) tri(c, r[k2], r[k]); else tri(c, r[k], r[k2]);
      }
    };
    cap(rings[0], true);
    cap(rings[rings.length - 1], false);
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
    g.computeVertexNormals();
    // Every face winds outward: the stern cap (first ring) is flipped, the bow cap is not
    // (checked by the exterior mockup, which counts any triangle facing the loft axis).
    if (opts.mats) {
      const name = opts.material || "hull", li = opts.mats.layer[name], span = opts.mats.span[name];
      const n = pos.length / 3, uv = new Float32Array(n * 2);
      for (let i = 0; i < n; i += 3) {
        // One projection per face, from the face normal, so a face's texels do not shear.
        const a = pos.slice(i * 3, i * 3 + 3), b = pos.slice(i * 3 + 3, i * 3 + 6), c = pos.slice(i * 3 + 6, i * 3 + 9);
        const ab = [b[0] - a[0], b[1] - a[1], b[2] - a[2]], ac = [c[0] - a[0], c[1] - a[1], c[2] - a[2]];
        const fn = [ab[1] * ac[2] - ab[2] * ac[1], ab[2] * ac[0] - ab[0] * ac[2], ab[0] * ac[1] - ab[1] * ac[0]];
        const ax = Math.abs(fn[0]), ay = Math.abs(fn[1]), az = Math.abs(fn[2]);
        for (let k = 0; k < 3; k++) {
          const p = pos.slice((i + k) * 3, (i + k) * 3 + 3);
          const q = ax >= ay && ax >= az ? [p[2], p[1]] : ay >= az ? [p[0], p[2]] : [p[0], p[1]];
          uv[(i + k) * 2] = q[0] / span; uv[(i + k) * 2 + 1] = q[1] / span;
        }
      }
      g.setAttribute("color", new THREE.BufferAttribute(new Float32Array(n * 3).fill(1), 3));
      g.setAttribute("surfUv", new THREE.BufferAttribute(uv, 2));
      g.setAttribute("surfLayer", new THREE.BufferAttribute(new Float32Array(n).fill(li), 1));
      g.setAttribute("surfGlow", new THREE.BufferAttribute(new Float32Array(n), 1));
    }
    return g;
  }

  /** Half-width of the hull at height y and station z (the octagon's x extent there), or 0 outside it. */
  function hullHalfWidth(L, y, z) {
    const secs = L.hull.sections.slice().sort((a, b) => a.z_m - b.z_m);
    if (z < secs[0].z_m || z > secs[secs.length - 1].z_m) return 0;
    let s = secs[0];
    for (let i = 0; i + 1 < secs.length; i++) {
      const a = secs[i], b = secs[i + 1];
      if (z >= a.z_m && z <= b.z_m) {
        const t = (z - a.z_m) / (b.z_m - a.z_m || 1);
        s = {};
        for (const k of ["half_beam_m", "top_m", "bottom_m", "chamfer_m"]) s[k] = a[k] + (b[k] - a[k]) * t;
        break;
      }
    }
    if (y > s.top_m || y < s.bottom_m) return 0;
    return Math.max(0, Math.min(s.half_beam_m, s.half_beam_m - s.chamfer_m + (s.top_m - y), s.half_beam_m - s.chamfer_m + (y - s.bottom_m)));
  }

  // ----------------------------------------------------------------- labels

  /** A camera-facing text sprite. size_m is the label's height in metres. */
  function label(THREE, text, opts) {
    opts = opts || {};
    const px = 64, pad = 16;
    const cv = document.createElement("canvas");
    const ctx = cv.getContext("2d");
    ctx.font = `600 ${px}px system-ui, sans-serif`;
    const w = Math.ceil(ctx.measureText(text).width) + pad * 2;
    cv.width = w; cv.height = px + pad * 2;
    ctx.font = `600 ${px}px system-ui, sans-serif`;
    ctx.fillStyle = opts.bg || "rgba(8,12,18,0.78)";
    ctx.fillRect(0, 0, cv.width, cv.height);
    if (opts.accent !== undefined) {
      ctx.fillStyle = "#" + new THREE.Color(opts.accent).getHexString();
      ctx.fillRect(0, 0, 10, cv.height);
    }
    ctx.fillStyle = opts.color || "#e8eef5";
    ctx.textBaseline = "middle";
    ctx.fillText(text, pad + (opts.accent !== undefined ? 6 : 0), cv.height / 2);
    const tex = new THREE.CanvasTexture(cv);
    tex.colorSpace = THREE.SRGBColorSpace;
    const mat = new THREE.SpriteMaterial({ map: tex, depthTest: opts.depthTest !== false, transparent: true });
    const s = new THREE.Sprite(mat);
    const h = opts.size_m || 0.5;
    s.scale.set((h * cv.width) / cv.height, h, 1);
    s.renderOrder = 10;
    return s;
  }

  // ------------------------------------------------------------ budget HUD

  /**
   * The Pi 5 cost meter every mockup shows (CLAUDE.md section 11). Call
   * hud.beginFrame(renderer) before the frame's first render and
   * hud.endFrame(renderer) after its last; it sums every pass (a viewscreen's
   * render-to-texture included). Set hud.textureBytes (loadMaterials' bytes) to
   * add the texture memory line.
   */
  function budgetHud(opts) {
    opts = opts || {};
    const el = document.createElement("div");
    el.className = "pi-budget";
    el.style.cssText = [
      "position:fixed", "right:12px", "bottom:12px", "z-index:20", "font:12px/1.35 ui-monospace,Menlo,Consolas,monospace",
      "color:#d8e2ec", "background:rgba(6,9,14,0.82)", "border:1px solid #2b3540", "border-radius:6px", "padding:8px 10px",
      "min-width:210px", "max-width:260px", "pointer-events:none",
    ].join(";");
    document.body.appendChild(el);
    let frames = 0, acc = { t: 0, c: 0 }, last = performance.now(), shown = { t: 0, c: 0, fps: 0 };
    const bar = (v, max) => {
      const f = Math.min(1, v / max);
      const color = v > max ? "#ff5252" : v > 0.8 * max ? "#ffb300" : "#66bb6a";
      return `<div style="height:5px;background:#1c242d;border-radius:3px;margin:2px 0 5px"><div style="height:5px;width:${(f * 100).toFixed(1)}%;background:${color};border-radius:3px"></div></div>`;
    };
    const hud = {
      el, textureBytes: opts.textureBytes || 0,
      beginFrame(renderer) { renderer.info.autoReset = false; renderer.info.reset(); },
      endFrame(renderer) {
        acc.t += renderer.info.render.triangles; acc.c += renderer.info.render.calls; frames++;
        const now = performance.now();
        if (now - last > 500) {
          shown = { t: Math.round(acc.t / frames), c: Math.round(acc.c / frames), fps: (frames * 1000) / (now - last) };
          acc = { t: 0, c: 0 }; frames = 0; last = now;
          render();
        }
      },
      /** The latest averaged numbers, for screenshots and tests. */
      read() { return { triangles: shown.t, drawCalls: shown.c, textureMB: hud.textureBytes / 1048576 }; },
    };
    function render() {
      const b = PI_BUDGET, mb = hud.textureBytes / 1048576;
      el.innerHTML =
        `<div style="font-weight:700;margin-bottom:4px">${PI_BUDGET.board} budget (provisional)</div>` +
        `triangles ${shown.t.toLocaleString()} / ${b.triangles.toLocaleString()}${bar(shown.t, b.triangles)}` +
        `draw calls ${shown.c} / ${b.drawCalls}${bar(shown.c, b.drawCalls)}` +
        (mb ? `textures ${mb.toFixed(2)} / ${b.textureMB} MB${bar(mb, b.textureMB)}` : "") +
        `<div style="color:#8a98a8">desktop ${shown.fps.toFixed(0)} fps: not a Pi measurement</div>` +
        (opts.note ? `<div style="color:#8a98a8">${opts.note}</div>` : "");
    }
    return hud;
  }

  /**
   * Screenshot hooks for tools/mockups/shoot.mjs. A mockup registers named

  // ------------------------------------------------------------ panel chrome

  /**
   * A small close button on each of a page's floating panels, so a viewer on a phone can clear the
   * view (owner, 2026-10-06: "There's lots of popups, cluttered on my phone. Add little x marks so I
   * can close some of these and get a better view"). The panels are the title block, the Pi 5 meter
   * and, by convention, any element of class controls, info, legend or route, id side, or with a
   * data-closable attribute (CLOSABLE). A closed panel is hidden, never removed, and a "Show panels"
   * pill at the top brings them all back; which ones a viewer closed is remembered in their own
   * browser when it lets the page store it. On a phone the page opens with only its controls showing. The buttons are a layer of their own, kept on each
   * panel's top right corner every frame, so a page that rewrites a panel's contents (the meter, an
   * info panel) never loses its button. markReady() calls it once, after the page has built its panels.
   */
  const CLOSABLE = ".mockup-title, .pi-budget, .controls, .info, .legend, .route, #side, [data-closable]";
  const PHONE_PX = 760;   // the pages' own narrow-screen breakpoint
  function panelChrome() {
    if (panelChrome.done || typeof document === "undefined") return;
    panelChrome.done = true;
    const css = document.createElement("style");
    css.textContent =
      ".mk-closed{display:none!important}" +
      ".mk-x{position:fixed;z-index:40;width:30px;height:30px;margin:0;padding:0;border:0;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}" +
      ".mk-x span{display:block;width:20px;height:20px;box-sizing:border-box;border-radius:50%;background:#141a22;border:1px solid #3a4654;color:#c8d4e0;font:600 14px/18px system-ui,sans-serif;text-align:center}" +
      ".mk-x:hover span,.mk-x:focus-visible span{border-color:#48d6ff;color:#48d6ff}" +
      ".mk-x:focus{outline:none}" +
      ".mk-show{position:fixed;z-index:40;left:50%;top:10px;transform:translateX(-50%);background:#141a22;color:#c8d4e0;border:1px solid #3a4654;border-radius:14px;padding:4px 12px;font:12px/1.3 system-ui,sans-serif;cursor:pointer}" +
      ".mk-show:hover,.mk-show:focus-visible{border-color:#48d6ff;color:#48d6ff}";
    document.head.appendChild(css);
    const panels = Array.from(document.querySelectorAll(CLOSABLE));
    const key = "mk-closed:" + location.pathname.split("/").pop() + ":" + document.title;
    // A viewer's own choice, when their browser kept it; otherwise a phone (narrower than PHONE_PX) opens with
    // only the controls, since the panels cover the view there, and a desktop with every panel.
    let closed = null;
    try { closed = JSON.parse(localStorage.getItem(key) || "null"); } catch (_) { closed = null; }
    if (!Array.isArray(closed)) closed = innerWidth < PHONE_PX ? panels.map((p, i) => (p.matches(".controls") ? -1 : i)).filter((i) => i >= 0) : [];
    const save = () => {
      try { localStorage.setItem(key, JSON.stringify(panels.map((p, i) => (p.classList.contains("mk-closed") ? i : -1)).filter((i) => i >= 0))); } catch (_) { /* storage blocked: closing still works for this visit */ }

    function mayUseReserve(i) {

    // ======================================================= STEP: power and heat

      for (let i = 0; i < m; i++) { let t = rhs[i]; for (let k = 0; k < i; k++) t -= K[i * m + k] * Pn[k]; Pn[i] = t / K[i * m + i]; }
      for (let i = m - 1; i >= 0; i--) { let t = Pn[i]; for (let k = i + 1; k < m; k++) t -= K[k * m + i] * Pn[k]; Pn[i] = t / K[i * m + i]; }
    }
    const inS = SPECIES.map(() => new Float64Array(NN)), inH = new Float64Array(NN);
    function flowSolve() {
      derive();
      const FL = AT.flow;
      // 1. Secant conductance of every open link, from the start-of-step pressures.
      for (const l of links) {
        l.G = 0; l.F = 0;
        const A = l.area * l.open; if (A <= 1e-9) continue;
        const pa = P[l.a], pb = l.b === SPACE ? 0 : P[l.b];
        const up = pa >= pb ? l.a : l.b, pUp = Math.max(pa, pb);
        if (pUp < FL.min_pressure_pa) continue;
        const dpe = Math.max(Math.abs(pa - pb), FL.linear_below_pa);
        const r = Math.max(0, (pUp - dpe) / pUp);
        const ndot = (l.cd * A * pUp * psi(r)) / Math.sqrt(MW[up] * R * T[up]);
        l.G = ndot / dpe; // mol/(s Pa)
      }
      // 2. Implicit pressure solve: (V/RT) P' + dt L P' = n, space held at 0 Pa.
      K.fill(0);
      for (let i = 0; i < NN; i++) { K[i * NN + i] = vol[i] / (R * T[i]); rhs[i] = ntot[i]; }
      for (const l of links) {
        if (l.G <= 0) continue;
        const g = dt * l.G;
        K[l.a * NN + l.a] += g;
        if (l.b !== SPACE) { K[l.b * NN + l.b] += g; K[l.a * NN + l.b] -= g; K[l.b * NN + l.a] -= g; }
      }
      cholSolve();
      for (let i = 0; i < NN; i++) if (Pn[i] < 0) Pn[i] = 0;
      // 3. Fluxes, then upwind transport in order of falling new pressure (exact, positive).
      for (let i = 0; i < NN; i++) { order[i] = i; inH[i] = 0; for (let k = 0; k < 4; k++) inS[k][i] = 0; }
      const ord = Array.from(order).sort((x, y) => Pn[y] - Pn[x] || x - y);
      const outs = Array.from({ length: NN }, () => []);
      for (const l of links) {
        if (l.G <= 0) continue;
        l.F = dt * l.G * (Pn[l.a] - (l.b === SPACE ? 0 : Pn[l.b])); // mol over the step, a -> b positive
        l.flow = l.F / dt;
        if (l.F > 0) outs[l.a].push([l, l.b, l.F]); else if (l.F < 0) outs[l.b].push([l, l.a, -l.F]);
      }
      for (const i of ord) {
        let avail = 0; const av = [0, 0, 0, 0];
        for (let k = 0; k < 4; k++) { av[k] = n[k][i] + inS[k][i]; avail += av[k]; }
        const Uav = U[i] + inH[i];
        let O = 0; for (const o of outs[i]) O += o[2];
        if (avail <= 0) { for (let k = 0; k < 4; k++) n[k][i] = av[k]; U[i] = Uav; continue; }
        const scale = O > avail ? avail / O : 1;
        const Tm = Uav / (avail * CV + cfit[i]);
        for (const [, j, amt0] of outs[i]) {
          const amt = amt0 * scale;
          if (j === SPACE) { st.lostOverboard += amt; continue; }
          for (let k = 0; k < 4; k++) inS[k][j] += (amt * av[k]) / avail;
          inH[j] += amt * CP * Tm;
        }
        const keep = 1 - (O * scale) / avail;
        for (let k = 0; k < 4; k++) n[k][i] = av[k] * keep;

      }

    }
    function mixing() {
      const FL = AT.flow;
      // Door exchange: a small base rate, plus the buoyant two-way flow a hot room drives through
      // an opening (q = c W H sqrt(g H dT / T)), scaled by the gravity generator's field.
      const g = FL.gravity_m_s2 * gravityG();
      for (const l of links) {
        if (!l.mix || l.open <= 0) continue;
        const A = l.area * l.open;
        const H = l.mixH;
        const dT = Math.abs(T[l.a] - T[l.b]), Tm = 0.5 * (T[l.a] + T[l.b]);
        const q = (FL.mixing_m3_s_per_m2 * A + FL.buoyant_exchange_coefficient * A * Math.sqrt((g * H * dT) / Tm)) * dt;
        const mol = Math.min(q * Math.min(ntot[l.a] / vol[l.a], ntot[l.b] / vol[l.b]), FL.mixing_max_fraction * Math.min(ntot[l.a], ntot[l.b]));
        exchange(l.a, l.b, mol);
      }
      // Fan circulation through open vents: rooms and the duct trade equal moles.
      const fan = fanRatio();
      for (let i = 0; i < N; i++) {
        const v = links[ventOf[i]]; if (v.open <= 0 || fan <= 0) continue;
        const q = achFlow[i] * fan * v.open * dt;
        const mol = Math.min(q * Math.min(ntot[i] / vol[i], ntot[DUCT] / vol[DUCT]), FL.mixing_max_fraction * Math.min(ntot[i], ntot[DUCT]));
        exchange(i, DUCT, mol);
      }
      derive();
    }
    function fanRatio() {
      const i = loadIdx.air_handler, l = loads[i];
      if (st.t === 0) return 1; // before the first power solve the fans are taken as running
      if (st.demand[i] <= 0) return 0;
      const r = st.alloc[i] / st.demand[i];
      if (r < l.min_ratio) return 0;
      return r * Math.min(st.setpoint[i], l.setpoint_max);
    }
    /** The artificial gravity field in g: the generator's delivered fraction of nominal, zero below its minimum. */
    function gravityG() {
      const i = loadIdx.gravity_generator;
      if (st.demand[i] <= 0) return st.t === 0 ? 1 : 0;
      return st.alloc[i] / loads[i].nominal_mw;
    }
    function supplyRatio(id) { const i = loadIdx[id]; return st.demand[i] > 0 ? st.alloc[i] / st.demand[i] : 0; }

    function stepPlant() {
      const PL = AT.plant, D = DUCT;
      derive();
      // O2 generator: holds the supply air's oxygen partial pressure.
      const og = PL.o2_generator, oi = loadIdx.o2_generator;
      const po2 = (P[D] * n[O2][D]) / Math.max(1e-9, ntot[D]) / 1000;
      const wantRate = og.max_mol_s * clamp((og.target_po2_kpa - po2) / og.band_kpa, 0, 1) * Math.min(st.setpoint[oi], loads[oi].setpoint_max);
      st.plant.o2_want_mw = wantRate * og.energy_mj_per_mol;
      const o2Rate = st.demand[oi] > 0 ? (st.alloc[oi] / og.energy_mj_per_mol) : 0;
      addGas(D, O2, o2Rate * dt, T[D]); st.plant.o2_mol_s = o2Rate; st.plant.water_kg += o2Rate * dt * og.water_kg_per_mol;
      // Scrubbers: CO2 and smoke out of the supply air.
      const sc = PL.co2_scrubbers, si = loadIdx.co2_scrubbers;
      const sr = (st.demand[si] > 0 ? st.alloc[si] / loads[si].nominal_mw : 0);
      const thr = sc.throughput_m3_s * sr;
      const co2Take = Math.min(sc.max_mol_s * sr, (sc.co2_efficiency * thr * n[CO2][D]) / vol[D]) * dt;
      const smTake = Math.min(n[SMOKE][D], (sc.smoke_efficiency * thr * n[SMOKE][D] * dt) / vol[D]);
      const tD = T[D];
      n[CO2][D] -= Math.min(co2Take, n[CO2][D]); n[SMOKE][D] -= smTake; U[D] -= (co2Take + smTake) * CP * tD;
      st.plant.scrub_mol_s = co2Take / dt;
      // Make-up from the reserve bottles keeps the supply pressure.
      const mk = PL.makeup; derive();
      let mkRate = 0;
      // Make-up stops if the duct itself is falling below stop_if_duct_below_kpa (a leak the
      // reserves would only feed), except while the board is refilling a sealed compartment.
      const refilling = st.repress.some((x) => x > 0);
      if (st.makeupOn && P[D] / 1000 < mk.start_below_kpa && (P[D] / 1000 > mk.stop_if_duct_below_kpa || refilling)) {
        mkRate = mk.max_mol_s * clamp((mk.target_kpa - P[D] / 1000) / 1.0, 0, 1);
        const rn = stores.reserve_n2, ro = stores.reserve_o2;
        const qn = Math.min(mkRate * dt * SA.mole_fraction.n2, rn.mol[N2]), qo = Math.min(mkRate * dt * SA.mole_fraction.o2, ro.mol[O2]);
        rn.mol[N2] -= qn; ro.mol[O2] -= qo; addGas(D, N2, qn, TH.initial_k); addGas(D, O2, qo, TH.initial_k);
      }
      st.plant.makeup_mol_s = mkRate;
      // Thermal control conditions the supply air (cooling to the hull panels, electric heat).
      derive();
      const tc = PL.thermal_control, ti = loadIdx.thermal_control;
      const tr = st.demand[ti] > 0 ? st.alloc[ti] / st.demand[ti] : 0;
      const Cd = ntot[D] * CV + cfit[D];
      let Q = ((T[D] - tc.supply_setpoint_k) * Cd) / dt; // W to remove (negative: to add)
      Q = clamp(Q, -tc.heating_max_mw * MWW * tr, tc.cooling_max_mw * MWW * tr);
      U[D] -= Q * dt; st.plant.tc_mw = Q / MWW;
      // Heater demand for the next solve: what it would have liked to add this step.
      const Qwant = ((tc.supply_setpoint_k - T[D]) * Cd) / dt;
      st.plant.heater_mw = clamp(Qwant / MWW, 0, tc.heating_max_mw);
    }

    function stepRoomHeat() {
      // Heat from loads, lights, crew; bulkhead conduction; hull loss.
      for (const c of st.crew) if (!c.dead && c.comp != null) roomHeat[c.comp] += c.working ? AT.metabolism.heat_w_work : AT.metabolism.heat_w_rest;
      for (let i = 0; i < NN; i++) U[i] += roomHeat[i] * dt;
      derive();
      for (const e of adj) { const q = TH.bulkhead_u_w_per_m2_k * e.area * (T[e.a] - T[e.b]) * dt; U[e.a] -= q; U[e.b] += q; }
      for (let i = 0; i < N; i++) U[i] -= TH.hull_u_w_per_m2_k * extArea[i] * (T[i] - TH.hull_skin_k) * dt;
      derive();
    }

    function stepPumps() {
      const BP_ = BP, bay = st.bay;
      st.bay.pump_mw_want = 0;
      if (bay.target != null) {
        const i = idx[bay.target];
        const pb = P[i], prc = receiverKpa() * 1000;
        if (bay.mode === "pumpdown") {
          if (pb / 1000 <= BP_.stop_kpa || prc / 1000 >= stores.bay_receiver.def.max_kpa) {
            bay.mode = "ready"; bay.t_ready = st.t - bay.t0; setLink("valve_" + bay.target, 1);
            log("Bay pumps stop at " + (pb / 1000).toFixed(1) + " kPa after " + bay.t_ready.toFixed(0) + " s: launch permitted; the vent valve takes the rest");
          }
          else {
            const S_ = BP_.displacement_m3_s * Math.min(1, st.setpoint[loadIdx.hangar_pumps]);
            const lnr = Math.log(Math.max(1, prc / Math.max(pb, 1)));
            bay.pump_mw_want = BP_.base_mw + (S_ * pb * lnr) / BP_.efficiency / MWW;
            const ratio = supplyRatio("hangar_pumps");
            const molRate = (S_ * ratio * pb) / (R * T[i]);
            const g = takeMix(i, Math.min(molRate * dt, 0.5 * ntot[i]));
            for (let k = 0; k < 4; k++) stores.bay_receiver.mol[k] += g[k];
            bay.moved_mol += g[0] + g[1] + g[2] + g[3];
            bay.energy_mj += (st.alloc[loadIdx.hangar_pumps] * dt);
          }
        } else if (bay.mode === "ready") {
          if (pb < 100) setLink("valve_" + bay.target, 0);
        } else if (bay.mode === "repress") {
          const rc = stores.bay_receiver; const nt = storeMol(rc);
          const room = prc - pb;
          if (room < 1000 || pb / 1000 >= SA.pressure_kpa - 0.5) { bay.mode = "idle"; log(comps[i].name + " repressurized from the receiver to " + (pb / 1000).toFixed(1) + " kPa"); repressurize(bay.target); bay.target = null; }
          else {
            const mol = Math.min(BP_.repress_max_mol_s * dt, nt * 0.5, (room * vol[i]) / (R * T[i]) * 0.5);
            for (let k = 0; k < 4; k++) addGas(i, k, (rc.mol[k] * mol) / nt, rc.def.temperature_k);
            for (let k = 0; k < 4; k++) rc.mol[k] -= (rc.mol[k] * mol) / nt;
          }
        }
      }
      // Airlock pump: airlock air back into the cabin.
      const al = st.airlock; al.pump_mw_want = 0;
      if (al.mode === "out_pump") {
        const i = idx[AL.compartment], j = idx[AL.pump_into];
        if (P[i] / 1000 <= AL.stop_kpa) { al.mode = "out_ready"; setLink(AL.outer, 1); log("Airlock pumped down at t=" + (st.t - al.t0).toFixed(1) + " s; outer door opening"); }
        else {
          const lnr = Math.log(Math.max(1, P[j] / Math.max(P[i], 1)));

      }

    }

    // ======================================================= FIRE
    function fO2(i) {
      const x = ntot[i] > 0 ? n[O2][i] / ntot[i] : 0;
      return clamp((x - FI.extinct_o2_fraction) / (FI.full_o2_fraction - FI.extinct_o2_fraction), 0, 1) *
        clamp((P[i] / 1000 - FI.extinct_kpa) / (FI.full_kpa - FI.extinct_kpa), 0, 1);
    }
    function stepFire() {
      const alpha = FI.growth_alpha_kw_per_s2 * 1000;
      const MIST = FI.suppression.water_mist, INERT = FI.suppression.inert_gas;
      for (let i = 0; i < N; i++) {
        const f = st.fire[i];
        // Inert gas flooding: replace room gas with nitrogen until the design O2 fraction.
        if (f.inert > 0) {
          // Flood and hold: replace room gas with nitrogen (relief overboard) while O2 is above design.
          const x = n[O2][i] / Math.max(1e-9, ntot[i]);
          if (x > INERT.design_o2_fraction) {
            const k = Math.log(SA.mole_fraction.o2 / INERT.design_o2_fraction) / INERT.time_s;
            const mol = Math.min(ntot[i] * k * dt, stores[INERT.store].mol[N2]);
            const tk = T[i];
            const g = takeMix(i, mol); st.lostOverboard += g[0] + g[1] + g[2] + g[3];
            stores[INERT.store].mol[N2] -= mol; addGas(i, N2, mol, tk);

          }
          f.inert = Math.max(0, f.inert - dt);
          if (f.inert <= 0) { delete st.damperForced[comps[i].id]; log("Inert gas soak ends in " + comps[i].name); }
        }
        if (f.mist > 0) { f.mist -= dt; U[i] -= MIST.cooling_mw * MWW * dt; }
        derive();
        if (f.hrr <= 0) {
          // Spread: hot air with fuel and oxygen ignites (deterministic threshold).
          if (T[i] > FI.autoignition_k && f.fuel > 0 && fO2(i) > 0) { f.hrr = FI.seed_kw * 1000; log("Fire spreads into " + comps[i].name); }
          continue;
        }
        const max = FI.hrr_max_kw_per_m2 * 1000 * floor[i] * fO2(i) * (f.fuel > 0 ? 1 : 0);
        let cut = 0;
        if (f.ext > 0) { cut += FI.extinguisher.hrr_cut_kw_per_s * 1000 * (f.extN || 1); f.ext -= dt; }
        if (f.mist > 0) cut += MIST.hrr_cut_kw_per_s * 1000;
        if (cut > 0) f.hrr -= cut * dt;
        else if (f.hrr < max) f.hrr = Math.min(max, f.hrr + dt * 2 * Math.sqrt(alpha * f.hrr));
        if (f.hrr > max) f.hrr += ((max - f.hrr) * dt) / FI.decay_time_s;
        if (f.hrr < FI.out_below_kw * 1000) { f.hrr = 0; log("Fire out in " + comps[i].name); continue; }
        let o2 = (f.hrr * dt) / (FI.mj_per_mol_o2 * MWW);
        if (o2 > 0.5 * n[O2][i]) { o2 = 0.5 * n[O2][i]; f.hrr = (o2 * FI.mj_per_mol_o2 * MWW) / dt; }

    /** Hot air damages what is in the room: systems, switchboards and (more slowly) the reactor. */
    function stepFireDamage() {
      for (let i = 0; i < N; i++) {
        const over = T[i] - FI.system_damage_above_k;
        if (over <= 0) continue;
        const pts = FI.system_damage_pct_per_s_per_k * over * dt;
        for (let li = 0; li < loads.length; li++) if (loads[li].compartment === comps[i].id) st.integrity[li] = Math.max(0, st.integrity[li] - pts);
        for (const nd of PW.nodes) if (nd.compartment === comps[i].id) { const h = st.nodeHealth[nd.id] == null ? 1 : st.nodeHealth[nd.id]; const left = h - pts / 100; st.nodeHealth[nd.id] = left < DM.nodes.destroyed_below ? 0 : left; }
        if (comps[i].id === L.systems.find((x) => x.id === PW.reactor.system).compartment) st.reactor.integrity = Math.max(0, st.reactor.integrity - pts * FI.reactor_damage_factor);
      }
    }
    function ignite(compId, kw) {
      const i = idx[compId], f = st.fire[i];
      if (f.fuel <= 0) return false;
      f.hrr = Math.max(f.hrr, (kw || FI.seed_kw) * 1000);
      log("Fire in " + comps[i].name + " (" + (f.hrr / 1000).toFixed(0) + " kW)");
      return true;
    }

    // ======================================================= automation
    function stepAutomation() {
      derive();
      // Rate of pressure fall of every node since the last sub-step (Pa/s, positive falling).
      for (let i = 0; i < NN; i++) { st.fall[i] = st.t > 0 ? (st.pHist[i] - P[i]) / dt : 0; st.pHist[i] = P[i]; }
      // Vent dampers (life-support, "Ventilation"). A damper trips shut on excess net flow
      // (more than damper_trip_fraction_per_s of its room's gas a second: a leak or a fire's
      // expansion; ordinary heating is about a hundred times less), unless the flow is a refill
      // of a rising room. A tripped damper waits until its room has stopped falling for
      // damper_retry_s, then reopens if the room is near the duct's pressure, or refills it
      // (repressurize) if the room is above auto_repress_above_kpa; a room below that stays
      // isolated for the damage control board. Dampers also shut on low pressure, smoke, a
      // low duct, or no fan. A forced state (venting, isolation) overrides; a refill ends at
      // the make-up threshold, and is abandoned if the room falls while it runs (still leaking).
      const fan = fanRatio();
      const ductLow = P[DUCT] / 1000 < VE.duct_low_kpa;
      for (let i = 0; i < N; i++) {
        const v = links[ventOf[i]], id = comps[i].id;
        if (st.repress[i]) {
          if (P[i] / 1000 >= AT.plant.makeup.start_below_kpa) { delete st.damperForced[id]; st.repress[i] = 0; st.trip[i] = 0; log(comps[i].name + " back to " + (P[i] / 1000).toFixed(1) + " kPa"); }
          else if (st.fall[i] > VE.damper_falling_pa_per_s && v.open >= 1) { delete st.damperForced[id]; st.repress[i] = 0; st.trip[i] = VE.damper_retry_s; st.hold[i] = 1; log("Refill of " + comps[i].name + " stopped: it is still leaking"); }
          else { v.target = 1; continue; }
        }
        const forced = st.damperForced[id];
        if (forced != null) { v.target = forced ? 1 : 0; continue; }
        const refill = v.flow < 0 && st.fall[i] < 0;
        if (Math.abs(v.flow) > VE.damper_trip_fraction_per_s * ntot[i] && !refill) st.trip[i] = VE.damper_retry_s;
        else if (st.trip[i] > 0) {
          if (st.fall[i] > VE.damper_falling_pa_per_s) st.trip[i] = VE.damper_retry_s;
          else if ((st.trip[i] -= dt) <= 0) {
            const dpk = (P[DUCT] - P[i]) / 1000;
            if (Math.abs(dpk) < VE.damper_reset_kpa) st.trip[i] = 0;
            else if (P[i] / 1000 > VE.auto_repress_above_kpa && !st.hold[i]) { st.trip[i] = 0; repressurize(id); continue; }
            else st.trip[i] = dt; // isolated until the board acts
          }
        }
        if (!st.damperAuto) continue;
        const ppm = (n[SMOKE][i] / Math.max(1e-9, ntot[i])) * 1e6;
        const shut = fan <= 0 || st.trip[i] > 0 || P[i] / 1000 < VE.damper_close_below_kpa || ppm > VE.damper_close_smoke_ppm || ductLow;
        v.target = shut ? 0 : 1;
      }
      // Doors between two compartments close themselves on a pressure alarm: either side below
      // auto_close_below_kpa and falling faster than auto_close_fall_kpa_per_s, unless the
      // damage control board holds them. Doors to space are commanded, never automatic.
      if (st.pdoorAuto) for (const l of links) {
        if (l.target <= 0 || l.b === SPACE || PK.auto_close_kinds.indexOf(l.kind) < 0 || l.manualHold) continue;
        const alarm = (k) => P[k] / 1000 < PK.auto_close_below_kpa && st.fall[k] / 1000 > PK.auto_close_fall_kpa_per_s;
        if (alarm(l.a) || alarm(l.b)) { l.target = 0; log(l.id + " closing itself (pressure alarm)"); }
      }
      // Water mist: automatic discharge on a fire above 1 MW in a protected room.
      for (const id of FI.suppression.water_mist.compartments) {
        const i = idx[id], f = st.fire[i];
        const WM = FI.suppression.water_mist;

    b += `<path d="M${cx} ${cy - R - 16}V${cy - R + 16}" stroke="${C.text}" stroke-width="3"/></g>`;
    b += text(cx, h - 14, 44, C.text, String(Math.round(G.hdg) % 360).padStart(3, "0") + "°", { a: "middle", w: 700 });
    const secs = Math.abs(wrap180(G.hdgOrder - G.hdg)) / Math.max(0.1, turnRate());
    if (secs > 0.5) b += text(cx, h - 62, 15, accent(), `${String(Math.round(G.hdgOrder) % 360).padStart(3, "0")}° in ${secs.toFixed(0)} s`, { a: "middle" });
    return b;
  });
  s += panel("EVADE", grid(8, 2, 4, 2), (w, h) => {
    const ev = [["JINK", "jink"], ["SPIRAL", "spiral"], ["PORT", "breakp"], ["STBD", "breaks"]];
    const bw = (w - 24 - 3 * 8) / 4;
    let b = "";
    ev.forEach(([k, ic], i) => {
      b += button({ x: 12 + i * (bw + 8), y: 10, w: bw, h: h - 22, icon: ic, label: k, stack: true, is: 34, on: G.evade === k, act: `evade:${k}`, tip: `Evasive: ${k.toLowerCase()} (${i + 1})` });
      if (G.evade === k) b += `<rect x="${12 + i * (bw + 8) + 8}" y="${h - 20}" width="${(bw - 16) * clamp(G.evadeT / 8, 0, 1)}" height="4" rx="2" fill="${accent()}"/>`;
    });
    return b;
  });
  return s;
}

// =================================================================== TACTICAL
function tactical() {
  let s = "";
  s += panel("TARGETS", grid(0, 0, 3, 4), (w, h) => {
    let b = "", y = 6;
    const list = G.contacts.filter((c) => c.hull > 0).sort((a, b) => (a.iff === "hostile" ? 0 : 1) - (b.iff === "hostile" ? 0 : 1) || rangeKm(a) - rangeKm(b));
    for (const c of list.slice(0, 4)) {
      const sel = c.id === G.target, col = C[c.iff];
      b += `<g data-act="target:${c.id}"${tipAttr(`${c.cls}, ${c.iff}`)}><rect x="10" y="${y}" width="${w - 20}" height="80" rx="8" fill="${sel ? col + "1f" : C.panel2}" stroke="${sel ? col : C.line2}" stroke-width="${sel ? 2 : 1}"/>`;
      b += shipGlyph(c, 44, y + 40, 36, 0, col);
      b += text(80, y + 34, 24, C.text, c.id, { w: 700 });
      b += text(w - 22, y + 34, 18, C.text, `${rangeKm(c).toFixed(1)} km`, { a: "end" });
      if (c.scan >= 0.3) b += bar(80, y + 50, w - 102, 8, c.hull / 100, c.hull > 50 ? col : C.warn);
      else b += `<g${tipAttr("Hull unknown until Science scans it")}>` + bar(80, y + 50, w - 102, 8, 0, C.faint) + icon("scan", w - 30, y + 54, 14, C.faint) + "</g>";
      b += "</g>";
      y += 88;
    }
    return b;
  });
  s += panel("PLOT", grid(3, 0, 5, 4), (w, h) => {
    const p = plot(w, h - 52, G.tacRange);
    let b = p.s;
    // Shield ring: four arcs by face, thickness and colour by charge. Click a face to favour it.
    const faceArc = [[-40, 40], [140, 220], [230, 310], [50, 130]];
    faceArc.forEach(([a0, a1], f) => {
      const k = G.stored[f] / Math.max(1, G.capMj * G.share[f]), col = k > 0.5 ? C.ok : k > 0.2 ? C.warn : C.danger;
      b += `<path d="${arcPath(p.cx, p.cy, 26, a0, a1)}" stroke="${col}" stroke-width="${3 + 9 * G.share[f]}" fill="none" opacity="${0.35 + 0.65 * k}" data-act="favour:${f}"${tipAttr(`${FACES[f]} shield: favour it`)}/>`;
    });
    b += shipGlyph({ cls: "corvette", iff: "friendly" }, p.cx, p.cy, 22, 0, C.text);
    for (const m of G.inbound) { const [x, y] = pol(p.cx, p.cy, 32 + m.t * 40, m.brg); b += `<g transform="translate(${x},${y}) rotate(${m.brg + 180})"><path d="M0 -8L6 6L0 2L-6 6Z" fill="${C.danger}"/></g>`; }
    for (const m of G.missiles) { const [x, y] = p.P(m.x, m.y); b += `<circle cx="${x}" cy="${y}" r="3.5" fill="${C.ok}"/>`; }
    for (const c of G.contacts) {
      if (c.hull <= 0) continue;
      const [x, y] = p.P(c.x, c.y);
      if (Math.hypot(x - p.cx, y - p.cy) > p.R) continue;
      // The line to the target: dashed while aimed, solid green while a turret fires on it.
      if (c.id === G.target) b += `<path d="M${p.cx} ${p.cy}L${x} ${y}" stroke="${G.turrets.some((t) => t.firing && t.mode !== "PD") ? C.ok : C.hostile}" stroke-width="${G.turrets.some((t) => t.firing && t.mode !== "PD") ? 2.5 : 1.5}" stroke-dasharray="${G.turrets.some((t) => t.firing && t.mode !== "PD") ? "10 4" : "3 5"}" opacity="0.8"/>`;
      b += `<g data-act="target:${c.id}"${tipAttr(c.id)}>` + shipGlyph(c, x, y, 20, wrap180(c.hdg - G.hdg), C[c.iff], c.id === G.target) + "</g>";
    }
    b += rangeChip(8, 4, G.tacRange, "tacrange");
    const pre = [["balance", "Balanced", -1], ["fwd", "Bow", 0], ["aft", "Stern", 1], ["port", "Port", 2], ["stbd", "Starboard", 3]];
    const bw = (w - 20 - 4 * 6) / 5;
    pre.forEach(([ic, tip, f], i) => { b += button({ x: 10 + i * (bw + 6), y: h - 46, w: bw, h: 38, icon: ic, act: `favour:${f}`, tip: `Shields: ${tip}`, is: 20, on: G.preset === f }); });
    return b;
  });
  s += panel("TURRETS", grid(8, 0, 4, 2), (w, h) => {
    let b = "";
    const tw = (w - 20 - 3 * 6) / 4;
    G.turrets.forEach((t, i) => {
      const x = 10 + i * (tw + 6), cx = x + tw / 2, cy = 52, ok = works(t.load);
      const hc = t.cooling ? C.danger : t.heat > 0.7 ? C.warn : C.ok;
      b += `<g data-act="tmode:${i}"${tipAttr(`${t.id} turret: tap to change mode`)}><rect x="${x}" y="4" width="${tw}" height="${h - 14}" rx="8" fill="${C.panel2}" stroke="${t.firing ? C.ok : C.line2}"/>`;
      b += `<path d="${arcPath(cx, cy, 30, -140, 140)}" stroke="#1c2734" stroke-width="6" fill="none"/>`;
      if (t.heat > 0.01) b += `<path d="${arcPath(cx, cy, 30, -140, -140 + 280 * clamp(t.heat, 0, 1))}" stroke="${hc}" stroke-width="6" fill="none"/>`;
      b += `<circle cx="${cx}" cy="${cy}" r="13" fill="${ok < 0.3 ? C.faint : C.text}"/>`;
      const [ax, ay] = pol(cx, cy, 24, t.aim);
      b += `<path d="M${cx} ${cy}L${ax} ${ay}" stroke="${ok < 0.3 ? C.faint : C.text}" stroke-width="5" stroke-linecap="round"/>`;
      b += text(cx, cy + 5, 13, C.bg, t.short, { a: "middle", w: 700 });
      if (t.op) b += icon("person", cx - 14, 104, 16, ROLE.gunner) + text(cx - 3, 109, 14, C.text, t.op);
      else b += icon("auto", cx, 104, 16, C.dim);
      const mc = t.mode === "HOLD" ? C.warn : t.mode === "PD" ? "#8fd3ff" : C.text;
      b += `<rect x="${x + 8}" y="${h - 46}" width="${tw - 16}" height="26" rx="5" fill="#0c121a" stroke="${mc}66"/>` + text(cx, h - 28, 14, mc, t.mode, { a: "middle", ls: 1.5 });
      b += "</g>";
    });
    return b;
  });
  s += panel("TUBES", grid(8, 2, 4, 2), (w, h) => {
    let b = "";
    const c = contact(G.target), p = missileHit(c), ready = G.tubes.findIndex((t) => t.state === "READY");
    G.tubes.forEach((t, i) => {
      const y = 8 + i * 52, col = t.state === "READY" ? C.ok : t.state === "LOADING" ? C.warn : C.faint;
      b += `<g ${t.state === "EMPTY" && G.magazine > 0 ? `data-act="load:${i}"` : ""}${tipAttr(t.state === "EMPTY" ? "Load" : t.state === "LOADING" ? `Loading, ${(TUBE_LOAD_S - t.t).toFixed(0)} s` : "Ready")}>`;
      b += `<rect x="10" y="${y}" width="190" height="42" rx="21" fill="#101822" stroke="${col}" stroke-width="2"/>`;
      if (t.state === "LOADING") b += `<rect x="14" y="${y + 4}" width="${182 * (t.t / TUBE_LOAD_S)}" height="34" rx="17" fill="${C.warn}" opacity="0.35"/>`;
      if (t.state === "READY") b += icon("tubes", 105, y + 21, 30, C.ok);
      if (t.state === "EMPTY") b += icon("load", 105, y + 21, 22, G.magazine ? C.dim : C.faint);
      b += "</g>";
    });
    for (let k = 0; k < 6; k++) b += `<rect x="${12 + k * 32}" y="${h - 22}" width="24" height="10" rx="3" fill="${k < G.magazine ? C.text : "#1c2734"}"${tipAttr("Missiles in the magazine")}/>`;
    // FIRE: hold 0.6 s. Its ring shows the chance to hit, computed by the rule that resolves it.
    const fx = 214, fw = w - fx - 10, cxF = fx + fw / 2, cyF = h / 2 - 4;
    const can = ready >= 0 && c && c.iff === "hostile";
    b += `<path d="${arcPath(cxF, cyF, 62, 0, 359.99)}" stroke="#1c2734" stroke-width="8" fill="none"/>`;
    if (can) b += `<path d="${arcPath(cxF, cyF, 62, 0, 360 * p)}" stroke="${p > 0.5 ? C.ok : C.warn}" stroke-width="8" fill="none"${tipAttr("Chance to hit")}/>`;
    b += `<g ${can ? `data-hold="fire"` : ""}${tipAttr(can ? "Hold to fire" : "No tube ready or no hostile target")}><circle cx="${cxF}" cy="${cyF}" r="52" fill="${can ? "#3a0d14" : C.panel2}" stroke="${can ? C.danger : C.line2}" stroke-width="2"/>`;
    if (HOLD.key === "fire") b += `<circle cx="${cxF}" cy="${cyF}" r="${52 * clamp((now() - HOLD.t0) / HOLD_S, 0, 1)}" fill="${C.danger}" opacity="0.4"/>`;
    b += text(cxF, cyF + 2, 22, can ? C.text : C.faint, "FIRE", { a: "middle", w: 700, ls: 2 });
    if (can) b += text(cxF, cyF + 24, 15, p > 0.5 ? C.ok : C.warn, `${Math.round(p * 100)}%`, { a: "middle" });
    return b + "</g>";
  });
  return s;
}

// =================================================================== ENGINEERING
let PREVIEW = null; // { gid, sp, r } while a fader is dragged: the solve's answer at that setpoint
function engineering() {
  let s = "";
  s += panel("POWER", grid(0, 0, 8, 4), (w, h) => {
    let b = "";
    // Supply against demand, one bar: delivered (fill), wanted (tick), reactor rating (end).
    let want = 0; for (let i = 0; i < LOADS.length; i++) want += st.want[i];
    const got = st.rxOut + st.batOut, rated = PW.reactor.thermal_rated_mw * PW.reactor.conversion_efficiency * PW.reactor.throttle_max;
    const sx = 50, sw = w - 200, k = (v) => sx + sw * clamp(v / rated, 0, 1);
    b += icon("bolt", 26, 22, 20, reactorUp() ? C.text : C.emergency);
    b += `<rect x="${sx}" y="12" width="${sw}" height="20" rx="4" fill="#16202c"${tipAttr("Power in use against the reactor's maximum")}/>`;
    b += `<rect x="${sx}" y="12" width="${k(st.rxOut) - sx}" height="20" rx="4" fill="${C.ok}" opacity="0.8"/>`;
    if (st.batOut > 0.05) b += `<rect x="${k(st.rxOut)}" y="12" width="${k(got) - k(st.rxOut)}" height="20" fill="${C.emergency}"${tipAttr("From the battery")}/>`;
    if (want > got + 0.05) b += `<rect x="${k(got)}" y="12" width="${k(want) - k(got)}" height="20" fill="url(#short)"${tipAttr("Wanted, not delivered")}/>`;
    b += `<defs><pattern id="short" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="3" height="6" fill="${C.danger}"/></pattern></defs>`;
    b += text(w - 16, 28, 18, C.text, `${got.toFixed(1)} / ${rated.toFixed(0)} MW`, { a: "end" });
    // One fader per load group, like a mixing desk.
    const n = GROUPS.length, fx0 = 14, fw = (w - 28) / n, ty = 70, th = h - 70 - 92;
    const yOf = (v) => ty + th * (1 - v / 1.5);
    GROUPS.forEach((g, i) => {
      const x = fx0 + i * fw, cx = x + fw / 2, gn = groupNow(g), nom = nominalMw(g);
      const pv = PREVIEW && PREVIEW.gid === g.id ? PREVIEW : null;
      const short = gn.got < gn.want - Math.max(0.01, 0.02 * gn.want), off = gn.sp <= 0;
      b += icon(g.id, cx, 52, 22, off ? C.faint : short ? C.danger : C.text);
      b += `<g data-drag="fader:${g.id}"${tipAttr(`${g.name}: ${gn.got.toFixed(2)} of ${gn.want.toFixed(2)} MW wanted`)}>`;
      b += `<rect x="${cx - 13}" y="${ty}" width="26" height="${th}" rx="6" fill="#101822" stroke="${C.line2}"/>`;
      b += `<path d="M${cx - 18} ${yOf(1)}H${cx + 18}" stroke="${C.dim}" stroke-dasharray="3 3"/>`;
      const wantK = gn.want / nom, gotK = gn.got / nom;
      if (short) b += `<rect x="${cx - 9}" y="${yOf(wantK)}" width="18" height="${yOf(gotK) - yOf(wantK)}" fill="url(#short)"/>`;
      b += `<rect x="${cx - 9}" y="${yOf(gotK)}" width="18" height="${ty + th - yOf(gotK)}" rx="3" fill="${off ? C.faint : gn.sp > 1 ? C.warn : C.ok}" opacity="0.9"/>`;
      if (pv) b += `<rect x="${cx - 9}" y="${yOf(pv.r.alloc_mw / nom)}" width="18" height="${ty + th - yOf(pv.r.alloc_mw / nom)}" rx="3" fill="${accent()}" opacity="0.45"/>`;
      const hy = yOf(pv ? pv.sp : gn.sp);
      b += `<rect x="${cx - 22}" y="${hy - 7}" width="44" height="14" rx="4" fill="${pv ? accent() : C.text}"/>`;
      b += "</g>";
      b += text(cx, ty + th + 22, 15, off ? C.faint : C.text, off ? "OFF" : `${Math.round((pv ? pv.sp : gn.sp) * 100)}`, { a: "middle", w: 700 });
      // Priority: one to three pips; tap to cycle.
      b += `<g data-act="prio:${g.id}"${tipAttr("Priority: 1 is fed first")}><rect x="${cx - 22}" y="${ty + th + 28}" width="44" height="24" rx="5" fill="transparent"/>`;
      for (let p = 0; p < 3; p++) b += `<circle cx="${cx - 12 + p * 12}" cy="${ty + th + 40}" r="4" fill="${p < 4 - gn.prio ? accent() : "#1c2734"}"/>`;
      b += "</g>";
    });
    const pre = [["CRUISE", "cruise"], ["COMBAT", "combat"], ["SILENT", "silent"], ["EMERG", "emergency"]];
    const bw = (w - 24 - 3 * 8) / 4;
    pre.forEach(([k, id], i) => { b += button({ x: 12 + i * (bw + 8), y: h - 42, w: bw, h: 34, label: k, act: `preset:${id}`, on: st.preset === id, fs: 14 }); });
    return b;
  });
  s += panel("REACTOR", grid(8, 0, 4, 2), (w, h) => {
    const R = st.reactor, run = reactorUp();
    let b = "";
    // Output gauge: a half dial from 0 to the reactor's maximum throttle; the target as a needle.
    const cx = 92, cy = 104, rr = 66, A = (k) => -120 + 240 * clamp(k / PW.reactor.throttle_max, 0, 1);
    b += `<path d="${arcPath(cx, cy, rr, -120, 120)}" stroke="#1c2734" stroke-width="14" fill="none"/>`;
    b += `<path d="${arcPath(cx, cy, rr, -120, A(1))}" stroke="none" fill="none"/><path d="${arcPath(cx, cy, rr, A(1), 120)}" stroke="${C.warn}" stroke-width="3" fill="none" opacity="0.6"/>`;
    if (R.throttle > 0.005) b += `<path d="${arcPath(cx, cy, rr, -120, A(R.throttle))}" stroke="${run ? C.ok : C.emergency}" stroke-width="14" fill="none"${tipAttr(`Output ${(R.P_e / 1e6).toFixed(1)} MW`)}/>`;
    const [nx, ny] = pol(cx, cy, rr + 12, A(R.target));
    b += `<circle cx="${nx}" cy="${ny}" r="5" fill="${C.text}"${tipAttr("Target")}/>`;
    b += text(cx, cy + 4, 30, run ? C.text : C.emergency, run ? `${Math.round(R.throttle * 100)}%` : "SCRAM", { a: "middle", w: 700 });
    if (!run && R.scramCause) b += text(cx, cy + 24, 11, C.dim, String(R.scramCause).toUpperCase().slice(0, 18), { a: "middle", ls: 1.2 });
    // Heat: the blanket and the coolant loop, each a thermometer with its limit.
    const therm = (x, ic, T, lo, warn, lim, tip) => {
      const k = (T - lo) / (lim * 1.08 - lo), col = T >= lim ? C.danger : T >= warn ? C.warn : C.ok;
      let g = `<g${tipAttr(tip + `: ${Math.round(T)} K`)}>` + bar(x - 8, 14, 16, 112, k, col, true);
      g += `<path d="M${x - 13} ${14 + 112 * (1 - (lim - lo) / (lim * 1.08 - lo))}h26" stroke="${C.danger}" stroke-width="2"/>`;
      return g + icon(ic, x, 140, 16, col) + "</g>";
    };
    b += therm(196, "flame", R.T, 300, PW.reactor.heat.warn_k, PW.reactor.heat.scram_k, "Reactor heat");
    b += therm(232, "drop", st.loop.T, 280, PW.reactor.scram.loop_over_k - 20, PW.reactor.scram.loop_over_k, "Coolant");
    const soc = st.battery.soc_mj / PW.battery.capacity_mj;
    b += `<g${tipAttr(`Battery ${Math.round(soc * 100)}%`)}>` + bar(260, 14, 16, 112, soc, soc > 0.3 ? C.ok : C.warn, true) + icon("battery", 268, 140, 16, C.text) + "</g>";
    const armed = ARMED.key === "scram" && now() - ARMED.t < 3;
    b += button({ x: w - 112, y: 14, w: 100, h: 54, label: armed ? "CONFIRM" : "SCRAM", act: run ? "scram" : null, off: !run, col2: C.danger, stroke: C.danger + "88", on: armed, col: C.danger, fill: "rgba(255,71,87,0.25)", tip: run ? "Scram: tap, then tap again" : "Restart at the reactor" });
    b += button({ x: w - 112, y: 76, w: 100, h: 34, label: R.mode === "auto" ? "AUTO" : "MANUAL", act: "rxmode", tip: "Reactor follows the load (AUTO)" });
    if (!run) b += icon("lock", w - 62, 140, 18, C.dim);
    return b;
  });
  s += panel("BUSES", grid(8, 2, 2, 2), (w, h) => {
    // The one-line diagram, simplified: reactor to two main buses, the tie, the battery's bus.
    const live = (on) => (on ? C.ok : C.faint);
    const gp = st.genClosed.gen_p, gs = st.genClosed.gen_s, tie = st.tieClosed.bt_main, ep = st.tieClosed.eb_p, es = st.tieClosed.eb_s;
    const np = (st.nodeHealth.msb_p == null ? 1 : st.nodeHealth.msb_p) > 0.05, ns = (st.nodeHealth.msb_s == null ? 1 : st.nodeHealth.msb_s) > 0.05;
    let b = icon("bolt", w / 2, 18, 18, reactorUp() ? C.text : C.emergency);
    b += `<path d="M${w / 2} 28V38M44 38H${w - 44}M44 38V60M${w - 44} 38V60" stroke="${live(reactorUp())}" stroke-width="3" fill="none"/>`;
    const brk = (x, y, on, id, tip) => `<g data-hold="brk:${id}"${tipAttr(tip + (on ? ": hold to open" : ": hold to close"))}><rect x="${x - 10}" y="${y - 10}" width="20" height="20" rx="3" fill="${on ? C.ok : "none"}" stroke="${on ? C.ok : C.warn}" stroke-width="2.5"/>${HOLD.key === "brk:" + id ? `<rect x="${x - 10}" y="${y - 10}" width="${20 * clamp((now() - HOLD.t0) / HOLD_S, 0, 1)}" height="20" fill="${C.warn}" opacity="0.6"/>` : ""}</g>`;
    b += brk(44, 64, gp, "gen_p", "Port generator breaker") + brk(w - 44, 64, gs, "gen_s", "Starboard generator breaker");
    const bus = (x, ok, on) => `<rect x="${x - 34}" y="84" width="68" height="10" rx="3" fill="${ok ? (on ? C.ok : C.faint) : C.danger}"/>` + (ok ? "" : icon("bang", x, 104, 14, C.danger));
    b += bus(44, np, gp) + bus(w - 44, ns, gs);
    b += `<path d="M78 89H${w - 78}" stroke="${live(tie)}" stroke-width="3" stroke-dasharray="${tie ? "0" : "4 4"}"/>` + brk(w / 2, 89, tie, "bt_main", "Bus tie");
    b += `<path d="M44 94V120H${w - 44}V94" stroke="${C.faint}" stroke-width="2" fill="none"/>` + brk(70, 120, ep, "eb_p", "Emergency bus, port") + brk(w - 70, 120, es, "eb_s", "Emergency bus, starboard");
    b += icon("battery", w / 2, 140, 18, st.batOut > 0.05 ? C.emergency : C.dim);
    const cut = Object.values(st.conduit).filter((c) => c.severed).length;
    if (cut) b += `<g${tipAttr("Cables cut: damage control splices them")}>` + icon("breach", 18, h - 14, 14, C.danger) + text(30, h - 9, 13, C.danger, String(cut)) + "</g>";
    return b;
  });
  s += panel("AIR", grid(10, 2, 2, 2), (w, h) => {
    const crewed = ["bridge", "mess", "quarters", "damage_control", "medbay", "engineering"];
    let worst = null, wk = 0;
    const rows = [["air_o2", "O₂"], ["air_co2", "CO₂"], ["temp", "Temperature"]];
    const status = [0, 0, 0];
    for (const id of crewed) {
      const r = sim.compartmentReadout(sim.idx[id]);
      const lv = [r.po2_kpa < 12 ? 2 : r.po2_kpa < 17 ? 1 : 0, r.pco2_kpa > 2 ? 2 : r.pco2_kpa > 0.8 ? 1 : 0, r.t_k > 318 || r.t_k < 278 ? 2 : r.t_k > 303 || r.t_k < 286 ? 1 : 0];
      lv.forEach((v, k) => (status[k] = Math.max(status[k], v)));
      const m = Math.max(...lv); if (m > wk) { wk = m; worst = id; }
    }
    let b = "";
    rows.forEach(([ic, tip], k) => {
      const col = [C.ok, C.warn, C.danger][status[k]], y = 12 + k * 40;
      b += `<g${tipAttr(tip)}><rect x="12" y="${y}" width="${w - 24}" height="32" rx="7" fill="${col}18" stroke="${col}66"/>` + icon(ic, 36, y + 16, 20, col);
      b += icon(status[k] ? "bang" : "check", w - 36, y + 16, 18, col) + "</g>";
    });
    if (worst) b += text(w / 2, h - 10, 13, C.warn, L.compartments.find((c) => c.id === worst).name.toUpperCase(), { a: "middle", ls: 1 });
    return b;
  });
  return s;
}

// =================================================================== SCIENCE
function science() {
  let s = "";
  s += panel("SENSORS", grid(0, 0, 6, 4), (w, h) => {
    const p = plot(w - 12, h - 56, G.sciRange);
    let b = `<g transform="translate(6,0)">` + p.s;
    const sweep = (G.t * 60) % 360;
    b += `<path d="${wedge(p.cx, p.cy, p.R, sweep - 25, sweep)}" fill="${accent()}" opacity="0.10"/>`;
    if (G.ping > 0) b += `<circle cx="${p.cx}" cy="${p.cy}" r="${p.R * (1 - G.ping / 2)}" fill="none" stroke="${accent()}" stroke-width="3" opacity="${G.ping / 2}"/>`;
    for (const c of G.contacts) {
      if (c.hull <= 0) continue;
      const [x, y] = p.P(c.x, c.y);
      if (Math.hypot(x - p.cx, y - p.cy) > p.R) continue;
      b += `<g data-act="sci:${c.id}"${tipAttr(c.iff === "unknown" ? "Unknown" : `${c.id} · ${rangeKm(c).toFixed(1)} km`)}>` + shipGlyph(c, x, y, 18, wrap180(c.hdg - G.hdg), C[c.iff], c.id === G.sciSel) + "</g>";
    }

    b += rangeChip(12, 6, G.sciRange, "scirange");
    b += button({ x: w - 160, y: h - 50, w: 148, h: 42, icon: "ping", label: "PING", hold: "ping", col: accent(), tip: "Active ping: hold. Everyone hears it." });
    return b;
  });
  s += panel("CONTACT", grid(6, 0, 3, 4), (w, h) => {

    const col = C[c.iff], cx = w / 2, cy = 120;

    b += shipGlyph(c, cx, cy, 104, 0, col);

    if (c.scan >= 0.6) [[-40, 40], [140, 220], [230, 310], [50, 130]].forEach(([a0, a1], f) => { const k = [0.8, 0.3, 0.6, 0.55][f] * c.hull / 100; b += `<path d="${arcPath(cx, cy, 68, a0, a1)}" stroke="${k > 0.5 ? C.ok : k > 0.2 ? C.warn : C.danger}" stroke-width="5" fill="none"${tipAttr("Its shields")}/>`; });
    if (c.scan >= 1) b += `<circle cx="${cx + 10}" cy="${cy + 18}" r="${7 + 3 * Math.sin(G.t * 6)}" fill="none" stroke="${C.warn}" stroke-width="3"${tipAttr("Weak point: its drive")}/>`;
    b += text(cx, 238, 24, C.text, c.iff === "unknown" ? "?" : c.id, { a: "middle", w: 700 });
    b += text(cx, 258, 13, C.dim, c.iff === "unknown" ? "UNKNOWN" : c.cls.toUpperCase(), { a: "middle", ls: 2 });
    if (c.scan >= 0.3) b += bar(30, 272, w - 60, 8, c.hull / 100, col);
    const done = c.scan >= 1;
    b += button({ x: 14, y: h - 62, w: w - 28, h: 50, icon: "scan", label: done ? "SCANNED" : G.scanning ? "SCANNING" : "SCAN", act: done ? null : "scan", off: done, on: G.scanning, tip: "Scan (Q)" });
    return b;
  });
  s += panel("SHIELDS", grid(9, 0, 3, 2), (w, h) => {
    const cx = 80, cy = 82;
    let b = shipGlyph({ cls: "corvette", iff: "friendly" }, cx, cy, 52, 0, C.dim);
    const faceArc = [[-40, 40], [140, 220], [230, 310], [50, 130]];
    faceArc.forEach(([a0, a1], f) => {
      const k = G.stored[f] / Math.max(1, G.capMj * G.share[f]), col = k > 0.5 ? C.ok : k > 0.2 ? C.warn : C.danger;
      b += `<path d="${arcPath(cx, cy, 56, a0, a1)}" stroke="${col}" stroke-width="${4 + 22 * G.share[f]}" fill="none" data-act="favour:${f}"${tipAttr(`${FACES[f]}: ${Math.round(G.share[f] * 100)}% of the shields`)}/>`;
    });
    // Dorsal and ventral: two discs beside the top view.
    [4, 5].forEach((f, j) => { const k = G.stored[f] / Math.max(1, G.capMj * G.share[f]); b += `<circle cx="${180}" cy="${50 + j * 64}" r="${8 + 40 * G.share[f]}" fill="${k > 0.5 ? C.ok : C.warn}" opacity="${0.25 + 0.6 * k}" data-act="favour:${f}"${tipAttr(`${FACES[f]}: ${Math.round(G.share[f] * 100)}%`)}/>` + `<path d="${f === 4 ? "M174 " + (54 + j * 64) + "l6-8 6 8" : "M174 " + (46 + j * 64) + "l6 8 6-8"}" stroke="${C.bg}" stroke-width="3" fill="none"/>`; });
    b += button({ x: w - 64, y: 8, w: 54, h: 54, icon: "balance", act: "favour:-1", tip: "Balance all faces (B)" });
    b += button({ x: w - 64, y: 70, w: 54, h: 40, label: G.freq, act: "freq", tip: "Frequency (F)" });
    b += `<g${tipAttr(`Set by ${G.shieldBy}`)}>` + icon(G.shieldBy === "Science" ? "science" : "tactical", w - 37, h - 22, 18, ROLE[G.shieldBy.toLowerCase()]) + "</g>";
    return b;

    b += text(w / 2, h - 23, 18, C.text, `${G.zoom}×`, { a: "middle" });
    b += button({ x: w - 70, y: h - 50, w: 60, h: 40, label: "+", act: "zoom:1", fs: 22, tip: "Zoom in" });
    return b;
  });
  return s;
}

/** The ship in plan, one deck: each compartment coloured by its state. */
function compState(i) {
  const r = sim.compartmentReadout(i), id = sim.comps[i].id;
  if (r.p_kpa < 60) return { col: "#20263a", edge: C.danger, word: "OPEN TO SPACE", icon: "breach", lv: 3 };
  if (r.fire_kw > 1) return { col: "#5a1a10", edge: C.danger, word: "FIRE", icon: "flame", lv: 3 };
  if (r.smoke_ppm > 2000) return { col: "#3a3530", edge: C.warn, word: "SMOKE", icon: "flame", lv: 2 };
  const sys = L.systems.filter((s) => s.compartment === id).map((s) => s.id);
  const hurt = LOADS.some((l, k) => sys.indexOf(l.system) >= 0 && st.integrity[k] < DM.systems.nominal_from_pct);
  if (hurt) return { col: "#3b3214", edge: C.warn, word: "DAMAGED", icon: "wrench", lv: 2 };
  const lt = sim.lighting(i);
  if (lt === "dark") return { col: "#0a0d12", edge: C.faint, word: "NO POWER", icon: "bolt", lv: 1 };
  return { col: "#172231", edge: "#2f3e51", word: "OK", icon: "check", lv: 0 };
}
function deckPlan(deck, x, y, w, h, o) {
  o = o || {};
  const secs = L.hull.sections, zMin = Math.min(...secs.map((s) => s.z_m)), zMax = Math.max(...secs.map((s) => s.z_m));
  const hwMax = Math.max(...secs.map((s) => s.half_beam_m));
  const sc = Math.min((w - 8) / (zMax - zMin), (h - 4) / (2 * hwMax));
  const ox = x + w / 2 - ((zMax + zMin) / 2) * sc, oy = y + h / 2;
  const X = (z) => ox + z * sc, Y = (xx) => oy - xx * sc; // bow right, port up
  let s = "";
  const top = secs.map((q) => `${X(q.z_m).toFixed(1)},${Y(q.half_beam_m).toFixed(1)}`), bot = secs.map((q) => `${X(q.z_m).toFixed(1)},${Y(-q.half_beam_m).toFixed(1)}`).reverse();
  s += `<polygon points="${top.concat(bot).join(" ")}" fill="#0a1017" stroke="${C.line2}" stroke-width="1.5"/>`;
  const dk = L.decks.find((d) => d.id === deck), y0 = dk.floor_y_m, y1 = dk.floor_y_m + dk.clear_height_m;
  sim.comps.forEach((c, i) => {
    if (c.decks.indexOf(deck) < 0) return;
    const cs = compState(i), sel = o.select && G.shipSel === c.id, flick = cs.word === "FIRE" ? 0.75 + 0.25 * Math.sin(G.t * 9 + i) : 1;
    let g = `<g data-act="room:${c.id}"${tipAttr(`${c.name}${cs.lv ? ": " + cs.word.toLowerCase() : ""}`)}>`;
    for (const br of c.brushes) {
      if (!(br.y[0] < y1 + 0.01 && br.y[1] > y0 - 0.01)) continue;
      g += `<polygon points="${br.poly.map(([px, pz]) => `${X(pz).toFixed(1)},${Y(px).toFixed(1)}`).join(" ")}" fill="${cs.col}" opacity="${flick}" stroke="${sel ? C.text : cs.edge}" stroke-width="${sel ? 2.5 : cs.lv >= 2 ? 2 : 1}"/>`;
    }
    g += "</g>";
    s += g;
  });
  // Icons over hurt rooms, and crew as dots.
  sim.comps.forEach((c, i) => {
    if (c.decks.indexOf(deck) < 0) return;
    const cs = compState(i); if (!cs.lv || cs.lv < 2) return;
    const br = c.brushes.find((b) => b.y[0] < y1 + 0.01 && b.y[1] > y0 - 0.01); if (!br) return;
    const mx = br.poly.reduce((a, p) => a + p[0], 0) / br.poly.length, mz = br.poly.reduce((a, p) => a + p[1], 0) / br.poly.length;
    s += icon(cs.icon, X(mz), Y(mx), Math.max(12, Math.min(22, sc * 3)), cs.edge, { sw: 2.4 });
  });
  st.crew.forEach((cr, k) => {
    if (cr.comp == null || cr.comp < 0 || cr.comp >= sim.N || sim.comps[cr.comp].decks[0] !== deck) return;
    const br = sim.comps[cr.comp].brushes[0], mx = br.poly.reduce((a, p) => a + p[0], 0) / br.poly.length, mz = br.poly.reduce((a, p) => a + p[1], 0) / br.poly.length;
    s += `<circle cx="${X(mz) - 10 + (k % 4) * 7}" cy="${Y(mx) + 10}" r="3.2" fill="${cr.status === "ok" ? "#8fd3ff" : C.danger}"/>`;
  });
  if (o.label) s += text(x + 4, y + 14, 13, C.dim, deck, { w: 700, ls: 2 });
  return s;
}

    b += button({ x: 248, y: 6, w: 100, h: 52, icon: "send", label: "SEND", act: G.composer.verb ? "send" : null, off: !G.composer.verb, col: C.ok, on: !!G.composer.verb, tip: "Send the order" });
    // The last orders, newest first: who, what, and a tick once done.
    G.orders.slice(0, 4).forEach((o, i) => {

    });
    return b;

  return s;

// =================================================================== frame and input
const CONSOLE = document.getElementById("console"), TIP = document.getElementById("tip");
const DRAW = { helm, tactical, engineering, science, captain };
function render() {
  CONSOLE.innerHTML = titleBand() + lookBand() + DRAW[station]() + statusStrip();
  renderBar();
}
function renderBar() {
  const bar = document.getElementById("bar");
  const panels = { helm: 4, tactical: 4, engineering: 4, science: 4, captain: 4 }[station];
  bar.innerHTML = `<b>Consoles</b>` + STATIONS.map((s) => `<button data-st="${s.id}" class="${s.id === station ? "on" : ""}" style="${s.id === station ? `border-color:${ROLE[s.role]};color:${ROLE[s.role]}` : ""}">${s.word}</button>`).join("") +
    `<span class="sep"></span><button data-ev="red" class="${st.alert === "red_alert" ? "on" : ""}">Red alert</button><button data-ev="hit">Hit us</button><button data-ev="scram">Scram</button><button data-ev="reset">Reset</button>` +
    `<span class="cost">Pi 5: ${panels + 2} UI draw calls (bridge-stations 8.7) · a 2D mockup, not a Pi measurement</span>`;
}
document.getElementById("bar").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.st) { station = b.dataset.st; }
  if (b.dataset.ev === "red") setAlert(st.alert !== "red_alert");
  if (b.dataset.ev === "hit") { const brg = (hash("pagehit", ++G.hits) - 0.5) * 360; hitUs(brg, 60, G.hits); }
  if (b.dataset.ev === "scram") sim.scram("manual");
  if (b.dataset.ev === "reset") location.reload();
  render();
});
function setAlert(on) { st.alert = on ? "red_alert" : "normal"; }
function fit() {
  const stg = document.getElementById("stage"), s = Math.min(stg.clientWidth / 1280, stg.clientHeight / 720);
  CONSOLE.style.transform = `scale(${s})`;
  CONSOLE.style.left = `${(stg.clientWidth - 1280 * s) / 2}px`; CONSOLE.style.top = `${(stg.clientHeight - 720 * s) / 2}px`;
}
window.addEventListener("resize", fit);

function act(a) {
  const [k, v] = a.split(":");
  const S = station;
  if (k === "tab") captainTab = v;
  if (k === "ack") { const o = newestOrderFor(S); if (o) o.state = "done"; }
  if (k === "allstop") { G.throttle = 0; G.ap = "HOLD"; }
  if (k === "ap") G.ap = v;
  if (k === "evade") { G.evade = G.evade === v ? null : v; G.evadeT = 8; }
  if (k === "target") G.target = v;
  if (k === "navrange") G.navRange = RANGES.nav[(RANGES.nav.indexOf(G.navRange) + 1) % 3];
  if (k === "tacrange") G.tacRange = RANGES.tac[(RANGES.tac.indexOf(G.tacRange) + 1) % 3];
  if (k === "scirange") G.sciRange = RANGES.sci[(RANGES.sci.indexOf(G.sciRange) + 1) % 3];
  if (k === "tmode") { const t = G.turrets[+v], m = ["AUTO", "TARGET", "PD", "HOLD"]; t.mode = m[(m.indexOf(t.mode) + 1) % m.length]; }
  if (k === "load") { const t = G.tubes[+v]; if (t.state === "EMPTY" && G.magazine > 0) { G.magazine--; t.state = "LOADING"; t.t = 0; } }
  if (k === "favour") favour(+v, S === "science" ? "Science" : "Tactical");
  if (k === "preset") sim.applyPreset(v);
  if (k === "prio") { const g = GROUPS.find((x) => x.id === v), p = groupNow(g).prio, np = p === 1 ? 3 : p - 1; for (const id of g.loads) sim.setPriority(id, np); }
  if (k === "scram") { if (ARMED.key === "scram" && now() - ARMED.t < 3) { sim.scram("manual"); ARMED.key = null; } else ARMED = { key: "scram", t: now() }; }
  if (k === "rxmode") st.reactor.mode = st.reactor.mode === "auto" ? "manual" : "auto";
  if (k === "sci") G.sciSel = v;
  if (k === "scan") G.scanning = !G.scanning;
  if (k === "freq") G.freq = "ABCDEF"[("ABCDEF".indexOf(G.freq) + 1) % 6];
  if (k === "feed") G.feed = v;
  if (k === "zoom") G.zoom = clamp(G.zoom * (+v > 0 ? 2 : 0.5), 1, 8);
  if (k === "compose") { G.composer.to = v; G.composer.verb = null; }
  if (k === "verb") G.composer.verb = v;
  if (k === "send") { sendOrder(G.composer.to, G.composer.verb); G.composer.verb = null; }
  if (k === "brace") G.braced = 6;
  if (k === "viewtake") G.viewOverride = !G.viewOverride;
  if (k === "room") G.shipSel = v;
  if (k === "orderrepair") sendOrder("engineering", "REPAIR");
}
/** Shield presets: -1 balances; a face takes 40 % and the rest share what is left. */
function favour(f, by) {
  G.share = f < 0 ? [1, 1, 1, 1, 1, 1].map(() => 1 / 6) : [0, 1, 2, 3, 4, 5].map((k) => (k === f ? 0.4 : 0.12));
  G.preset = f; G.shieldBy = by;
  for (let k = 0; k < 6; k++) G.stored[k] = Math.min(G.stored[k], G.capMj * G.share[k]);
}
function holdDone(key) {
  const [k, v] = key.split(":");
  if (k === "fire") {
    const i = G.tubes.findIndex((t) => t.state === "READY"), c = contact(G.target);
    if (i >= 0 && c) { G.tubes[i].state = "EMPTY"; G.missiles.push({ x: G.x, y: G.y, target: c.id, p: missileHit(c), n: ++G.hits }); }
  }
  if (k === "ping") G.ping = 2;
  if (k === "redalert") setAlert(st.alert !== "red_alert");
  if (k === "brk") { if (v.startsWith("gen")) st.genClosed[v] = !st.genClosed[v]; else st.tieClosed[v] = !st.tieClosed[v]; }
}
let DRAG = null;
function dragTo(e) {
  const r = DRAG.rect, ky = (r.bottom - e.clientY) / r.height;
  if (DRAG.kind === "throttle") G.throttle = clamp(Math.round((ky * 1.25 - 0.25) * 20) / 20, -0.25, 1);
  if (DRAG.kind === "heading") {
    // The panel's own box: the arc's centre is at (w / 2, body height + 60) below the 24 lp title.
    const sc = r.width / 408, x = (e.clientX - r.left) / sc, y = (e.clientY - r.top) / sc;
    G.hdgOrder = wrap360(Math.round((G.hdg + clamp(Math.atan2(x - 204, 196 + 60 - y) / D2R, -60, 60)) / 5) * 5);
  }
  if (DRAG.kind === "fader") {
    const sp = clamp(Math.round(ky * 1.5 * 20) / 20, 0, 1.5);
    PREVIEW = { gid: DRAG.arg, sp, r: sim.previewGroup(DRAG.arg, sp) };
  }
  render();
}
CONSOLE.addEventListener("pointerdown", (e) => {
  const d = e.target.closest("[data-drag]"), a = e.target.closest("[data-act]"), h = e.target.closest("[data-hold]");
  if (d) {
    const [kind, arg] = d.dataset.drag.split(":");
    DRAG = { kind, arg, rect: d.getBoundingClientRect() };
    if (kind === "fader" || kind === "throttle") DRAG.rect = d.querySelector("rect").getBoundingClientRect();
    if (kind === "heading") DRAG.rect = d.closest("svg").getBoundingClientRect();
    CONSOLE.setPointerCapture(e.pointerId); dragTo(e); return;
  }
  if (h) { HOLD.key = h.dataset.hold; HOLD.t0 = now(); render(); return; }
  if (a) { act(a.dataset.act); render(); }
});
CONSOLE.addEventListener("pointermove", (e) => {
  if (DRAG) { dragTo(e); return; }
  const t = document.elementFromPoint(e.clientX, e.clientY), el = t && t.closest && t.closest("[data-tip]");
  if (el) { TIP.textContent = el.dataset.tip; TIP.style.display = "block"; TIP.style.left = e.clientX + 14 + "px"; TIP.style.top = e.clientY + 16 + "px"; }
  else TIP.style.display = "none";
});
window.addEventListener("pointerup", () => {
  if (DRAG && DRAG.kind === "fader" && PREVIEW) setGroup(PREVIEW.gid, PREVIEW.sp);
  DRAG = null; PREVIEW = null; HOLD.key = null; render();
});
window.addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (station === "helm") {
    if (k === "w" || k === "r") G.throttle = clamp(G.throttle + 0.05, -0.25, 1);
    if (k === "s" || k === "f") G.throttle = clamp(G.throttle - 0.05, -0.25, 1);
    if (k === "a") G.hdgOrder = wrap360(G.hdgOrder - 5);
    if (k === "d") G.hdgOrder = wrap360(G.hdgOrder + 5);
    if (k === "x") act("allstop");
    if ("1234".includes(k)) act(`evade:${["JINK", "SPIRAL", "PORT", "STBD"][+k - 1]}`);
  }
  if (station === "tactical" && k === "t") { const l = G.contacts.filter((c) => c.hull > 0); G.target = l[(l.findIndex((c) => c.id === G.target) + 1) % l.length].id; }
  if (station === "science" && k === "q") act("scan");
  if (k === "y") act("ack");
  render();
});

// The clock: the systems at their 10 Hz, the stand-ins at the same fixed step.
let acc = 0, last = now(), lastDraw = 0;
function advance(n) {
  for (let i = 0; i < n; i++) {
    stepGame(DT);
    if (HOLD.key && now() - HOLD.t0 >= HOLD_S) { holdDone(HOLD.key); HOLD.key = null; }
    sim.setActivity(activity()); sim.step();
  }
}
function frame() {
  const t = now(); acc += Math.min(0.25, t - last); last = t;
  let n = 0; while (acc >= DT) { acc -= DT; n++; }
  advance(n);
  if (HOLD.key && now() - HOLD.t0 >= HOLD_S) { holdDone(HOLD.key); HOLD.key = null; }
  if (n > 0 || t - lastDraw > 0.1) { if (!DRAG) render(); lastDraw = t; }
  requestAnimationFrame(frame);
}

// Named shots for tools/mockups/shoot.mjs: each sets a station and plays the ship forward.
let shotsFresh = true;
function scenario(name) {
  if (name === "combat" && shotsFresh) {
    shotsFresh = false;
    setAlert(true); sim.applyPreset("combat"); G.ap = "CHASE"; G.throttle = 0.6;
    advance(300);
    hitUs(80, 70, 101); hitUs(260, 80, 102); hitUs(100, 60, 103);
    advance(40);
  }
}
window.MOCKUP_SHOTS = [
  { name: "helm", setup: () => { station = "helm"; render(); } },
  { name: "tactical", setup: () => { station = "tactical"; render(); } },
  { name: "engineering", setup: () => { station = "engineering"; render(); } },
  { name: "science", setup: () => { station = "science"; render(); } },
  { name: "captain", setup: () => { station = "captain"; captainTab = "CMD"; render(); } },
  { name: "red-helm-evading", setup: () => { scenario("combat"); station = "helm"; act("evade:JINK"); advance(20); render(); } },
  { name: "red-tactical", setup: () => { scenario("combat"); station = "tactical"; HOLD.key = null; render(); } },
  { name: "red-engineering", setup: () => { scenario("combat"); station = "engineering"; render(); } },
  { name: "red-captain", setup: () => { scenario("combat"); station = "captain"; captainTab = "CMD"; render(); } },
  { name: "red-captain-ship", setup: () => { scenario("combat"); station = "captain"; captainTab = "SHIP"; G.shipSel = "engineering"; render(); } },
  { name: "scram-engineering", setup: () => { scenario("combat"); sim.scram("manual"); advance(30); station = "engineering"; render(); } },
];

fit(); render();
requestAnimationFrame(frame);
// A flat page: no 3D scene for tools/mockups/zfight.mjs to check.
window.MOCKUP_FLAT = true;
document.fonts.ready.then(() => { render(); window.MOCKUP_READY = true; });
</script>
</body>
