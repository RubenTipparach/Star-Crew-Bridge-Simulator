<!doctype html>
<!--
  Star Crew mockup: light baking. Presents openspec/changes/light-baking.
  One Tern compartment at a time (the bridge or engineering), lit by its own
  fixtures and baked in this page by docs/mockups/lib/lightbake.js, a small CPU
  baker that mirrors the planned engine baker. Modes compare the same scene and
  camera unlit, with runtime lights, baked into vertex colours at the deck's
  own mesh density, baked into vertex colours with adaptive subdivision, and
  baked into a lightmap atlas. All three lighting states are baked up front, so
  switching state is a uniform change, as in the engine.
  Run python3 tools/mockups/inline.py after editing the layout, shipkit or
  lightbake. Never hand-edit between the INLINE markers.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tern Light Baking</title>
<style>
  :root { --bg: #05070d; --fg: #e8eef5; --dim: #8a98a8; --panel: rgba(6,9,14,0.86); --line: #2b3540; --accent: #48d6ff; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg: #05070d; } }
  :root[data-theme="dark"] { --bg: #05070d; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }
  .controls { position: fixed; left: 12px; bottom: 12px; z-index: 20; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; display: flex; flex-direction: column; gap: 5px; max-width: calc(100vw - 270px); }
  .row { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
  .row .k { color: var(--dim); width: 86px; flex: none; font-size: 12px; }
  .controls button, .controls select { background: #18202a; color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px; font: 12px/1.4 system-ui, sans-serif; cursor: pointer; }
  .controls button.on { border-color: var(--accent); color: var(--accent); }
  .info { position: fixed; right: 12px; top: 12px; z-index: 20; width: 340px; max-width: calc(100vw - 24px); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 9px 11px; font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace; color: #d8e2ec; }
  .info h3 { margin: 0 0 4px; font: 700 13px/1.3 system-ui, sans-serif; color: var(--fg); }
  .info .d { color: var(--dim); }
  .info .w { color: #ffb300; }
  .info table { border-collapse: collapse; width: 100%; }
  .info td { padding: 0 0 1px; vertical-align: top; }
  .info td:last-child { text-align: right; white-space: nowrap; }
  .tag { position: fixed; z-index: 15; top: 120px; font: 700 13px/1.3 system-ui, sans-serif; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; display: none; }
  .divider { position: fixed; z-index: 14; top: 0; bottom: 0; width: 2px; background: #48d6ff; display: none; }
  .busy { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 30; background: var(--panel); border: 1px solid var(--accent); border-radius: 6px; padding: 10px 16px; font: 600 14px/1.4 system-ui, sans-serif; display: none; }
  @media (max-width: 760px) { .controls { max-width: calc(100vw - 24px); bottom: 150px; } .info { top: auto; bottom: 12px; width: auto; left: 12px; font-size: 11px; } }
</style>

<script>
/*
 * shipkit.js: the one place a mockup turns a ship layout into three.js objects.
 *
 * Every Star Crew mockup reads the same layout (data/ships/<id>/layout.json), so
 * the bridge, the deck plan, the systems view and the exterior cannot disagree
 * about where a room or a door is (CLAUDE.md sections 8 and 11). This file is
 * the shared interpretation of that layout: palette, lighting states, the Pi 5
 * budget meter, room shells with door openings cut, the hull loft and labels.
 *
 * It is a classic script, not a module, so a mockup still works when opened
 * straight from disk. tools/mockups/inline.py copies it into each page between
 * the "INLINE shipkit" markers; edit it here, never in a page. Functions that
 * build geometry take THREE as their first argument because the page owns the
 * three.js import.
 *
 * Axes (from the layout): +X port, +Y up, +Z bow, metres.
 */
(function () {
  "use strict";

  /** The layout inlined into the page as <script id="ship-layout" type="application/json">. */
  function layout() {
    const el = document.getElementById("ship-layout");
    if (!el) throw new Error("shipkit: no #ship-layout script in the page (run tools/mockups/inline.py)");
    return JSON.parse(el.textContent);
  }

  /**
   * The Raspberry Pi 5 (1 GB) budget a mockup is measured against. These are
   * the provisional numbers from openspec/changes/engine-stack/design.md,
   * "The Pi 5 budget"; that table is the source, and this copy is checked
   * against its marker by tools/mockups/inline.py --check.
   */
  const PI_BUDGET = {
    board: "Pi 5 (1 GB)",
    triangles: 200000,       // visible triangles per frame, all passes
    drawCalls: 300,          // draw calls per frame, all passes
    textureMB: 96,           // texture memory
    viewscreenPx: [1024, 512], // render-to-texture size for the main viewscreen
    frameMs: 16.7,           // 60 frames a second target (33.3 ms floor), 3D at 1280x720
  };

  /** Named colour roles. Mockups use roles, not hex values (CLAUDE.md section 10). */
  const PALETTE = {
    space: 0x05070d,
    hullLight: 0x8f9aa8,
    hullDark: 0x4a5462,
    hullAccent: 0xc9643b,
    floor: 0x3a404a,
    floorCorridor: 0x454b55,
    wall: 0x6b7480,
    wallDark: 0x525a66,
    ceiling: 0x2c3138,
    trim: 0x9aa4b0,
    console: 0x2a3038,
    screen: 0x48d6ff,
    screenWarm: 0xffb347,
    glass: 0x9fd8ff,
    door: 0x8a6d3b,
    doorFrame: 0xd0a040,
    hazard: 0xe8c547,
    alert: 0xff2a2a,
    emergency: 0xff8a1c,
    lampWarm: 0xffe2b0,
    lampCool: 0xbfe0ff,
    // station roles, used for seats, labels and console accents
    role: {
      command: 0xf2f2f2,
      helm: 0x4fc3f7,
      tactical: 0xef5350,
      engineering: 0xffb300,
      science: 0x66bb6a,
      comms: 0xab47bc,
      flight_ops: 0x26c6da,
      gunner: 0xff7043,
    },
    // compartment kinds, used by plan views
    kind: {
      room: 0x5c6b7a,
      corridor: 0x7d8792,
      bay: 0x4a6a8a,
      crawlspace: 0x6a5a4a,
      airlock: 0xb08a3a,
      pod: 0xa05050,
    },
  };

  /**
   * Interior lighting states. Every interior mockup shows at least normal and
   * red alert (CLAUDE.md section 11). In the engine these are baked vertex
   * colour sets blended by a per-compartment uniform; here they are light
   * colours and intensities.
   */
  const LIGHTING = {
    normal: { label: "Normal", ambient: 0x2a3340, ambientI: 0.55, lamp: 0xffe9c8, lampI: 1.0, strip: 0x9fd8ff, stripI: 0.6, fog: 0x0b0e14 },
    red_alert: { label: "Red alert", ambient: 0x2a0d10, ambientI: 0.45, lamp: 0xff3030, lampI: 0.75, strip: 0xff2020, stripI: 1.0, fog: 0x120406 },
    emergency: { label: "Emergency power", ambient: 0x120c08, ambientI: 0.3, lamp: 0xff8a1c, lampI: 0.35, strip: 0xff8a1c, stripI: 0.8, fog: 0x060403 },
  };

  // ---------------------------------------------------------------- lookups

  function byId(list, id) {
    for (const x of list) if (x.id === id) return x;
    return null;
  }
  function compartment(L, id) { return byId(L.compartments, id); }
  function portalsOf(L, compId) { return L.portals.filter((p) => p.between.indexOf(compId) >= 0); }
  function stationsIn(L, compId) { return (L.stations || []).filter((s) => s.compartment === compId); }
  function systemsIn(L, compId) { return (L.systems || []).filter((s) => s.compartment === compId); }
  function deckById(L, id) { return byId(L.decks, id); }

  /** Volume in cubic metres and floor area in square metres of a compartment. */
  function measure(comp) {
    let v = 0, a = 0;
    for (const b of comp.boxes) {
      const dx = b.x[1] - b.x[0], dy = b.y[1] - b.y[0], dz = b.z[1] - b.z[0];
      v += dx * dy * dz; a += dx * dz;
    }
    return { volume_m3: v, floor_m2: a };
  }

  /** Union bounds of a compartment's boxes. */
  function bounds(comp) {
    const r = { x: [Infinity, -Infinity], y: [Infinity, -Infinity], z: [Infinity, -Infinity] };
    for (const b of comp.boxes) for (const k of "xyz") { r[k][0] = Math.min(r[k][0], b[k][0]); r[k][1] = Math.max(r[k][1], b[k][1]); }
    return r;
  }
  function center(comp) {
    const b = bounds(comp);
    return [(b.x[0] + b.x[1]) / 2, (b.y[0] + b.y[1]) / 2, (b.z[0] + b.z[1]) / 2];
  }

  /** Half extents of a portal's opening on its two in-plane axes. */
  function portalHalf(p) {
    const s = p.size_m;
    if (p.axis === "x") return { z: s[0] / 2, y: s[1] / 2 };
    if (p.axis === "z") return { x: s[0] / 2, y: s[1] / 2 };
    return { x: s[0] / 2, z: s[1] / 2 };
  }

  // ------------------------------------------------------------ room shells

  const EPS = 1e-4;

  // Each face of a box: the axis it is normal to, which end, and its two in-plane axes (u, v).
  const FACES = [
    { key: "floor", axis: "y", end: 0, u: "x", v: "z", inward: [0, 1, 0] },
    { key: "ceiling", axis: "y", end: 1, u: "x", v: "z", inward: [0, -1, 0] },
    { key: "wall", axis: "x", end: 0, u: "z", v: "y", inward: [1, 0, 0] },
    { key: "wall", axis: "x", end: 1, u: "z", v: "y", inward: [-1, 0, 0] },
    { key: "wall", axis: "z", end: 0, u: "x", v: "y", inward: [0, 0, 1] },
    { key: "wall", axis: "z", end: 1, u: "x", v: "y", inward: [0, 0, -1] },
  ];

  /**
   * Rectangle minus holes, as a list of cells. Holes are clipped to the
   * rectangle. Cells come from the grid of every hole edge, so the result is
   * exact and has no slivers, at the price of a few extra triangles.
   */
  function rectMinusHoles(r, holes) {
    const hs = holes
      .map((h) => ({ u0: Math.max(h.u0, r.u0), u1: Math.min(h.u1, r.u1), v0: Math.max(h.v0, r.v0), v1: Math.min(h.v1, r.v1) }))
      .filter((h) => h.u1 - h.u0 > EPS && h.v1 - h.v0 > EPS);
    if (!hs.length) return [r];
    const us = [r.u0, r.u1], vs = [r.v0, r.v1];
    for (const h of hs) { us.push(h.u0, h.u1); vs.push(h.v0, h.v1); }
    const su = [...new Set(us.map((x) => +x.toFixed(4)))].sort((a, b) => a - b);
    const sv = [...new Set(vs.map((x) => +x.toFixed(4)))].sort((a, b) => a - b);
    const cells = [];
    for (let i = 0; i + 1 < su.length; i++) {
      for (let j = 0; j + 1 < sv.length; j++) {
        const cu = (su[i] + su[i + 1]) / 2, cv = (sv[j] + sv[j + 1]) / 2;
        if (hs.some((h) => cu > h.u0 && cu < h.u1 && cv > h.v0 && cv < h.v1)) continue;
        cells.push({ u0: su[i], u1: su[i + 1], v0: sv[j], v1: sv[j + 1] });
      }
    }
    // Merge runs along u in each row to keep the triangle count down.
    cells.sort((a, b) => a.v0 - b.v0 || a.u0 - b.u0);
    const merged = [];
    for (const c of cells) {
      const last = merged[merged.length - 1];
      if (last && Math.abs(last.v0 - c.v0) < EPS && Math.abs(last.v1 - c.v1) < EPS && Math.abs(last.u1 - c.u0) < EPS) last.u1 = c.u1;
      else merged.push({ ...c });
    }
    return merged;
  }

  /** The openings on one face of one box: portals on that plane, and faces shared with the compartment's other boxes. */
  function faceHoles(L, comp, box, face, opts) {
    const plane = box[face.axis][face.end];
    const holes = [];
    for (const p of portalsOf(L, comp.id)) {
      if (p.axis !== face.axis) continue;
      if (opts.skipKinds && opts.skipKinds.indexOf(p.kind) >= 0) continue;
      const c = { x: p.center_m[0], y: p.center_m[1], z: p.center_m[2] };
      const slab = face.axis === "y" ? 0.55 : EPS * 10;
      if (Math.abs(c[face.axis] - plane) > slab) continue;
      const h = portalHalf(p);
      holes.push({ u0: c[face.u] - h[face.u], u1: c[face.u] + h[face.u], v0: c[face.v] - h[face.v], v1: c[face.v] + h[face.v], portal: p });
    }
    for (const other of comp.boxes) {
      if (other === box) continue;
      const oEnd = 1 - face.end;
      if (Math.abs(other[face.axis][oEnd] - plane) > EPS) continue;
      holes.push({ u0: other[face.u][0], u1: other[face.u][1], v0: other[face.v][0], v1: other[face.v][1] });
    }
    return holes;
  }

  function pushQuad(pos, nor, col, face, plane, c, color) {
    const p = (u, v) => {
      const o = { x: 0, y: 0, z: 0 };
      o[face.axis] = plane; o[face.u] = u; o[face.v] = v;
      return [o.x, o.y, o.z];
    };

        `triangles ${shown.t.toLocaleString()} / ${b.triangles.toLocaleString()}${bar(shown.t, b.triangles)}` +

<script>
/*
 * lightbake.js: a small CPU light baker for the Star Crew mockups.
 *
 * What it owns: turning a compartment's planar patches, its light fixtures and
 * its emissive surfaces into baked light, by the method that
 * openspec/changes/light-baking designs for the engine's baker (`sc-tools
 * bake`, planned, not built):
 *   - direct light from fixtures, with soft shadows from walls, props and
 *     closed doors (shadow rays to sample points on each lamp);
 *   - emissive surfaces (screens, light strips, the viewscreen) as area lights;
 *   - ambient occlusion on a small ambient term;
 *   - zero, one or two diffuse bounces, gathered once on a coarse irradiance
 *     cache (a uniform 0.5 m grid on every surface, many rays per point) and
 *     interpolated to vertices and texels: bounce is smooth, so this is both
 *     quieter and cheaper than gathering at every output sample (after Ward's
 *     irradiance caching);
 *   - all three lighting states (normal, red alert, emergency power) from one
 *     set of rays, because light is linear in its sources;
 *   - storage as 8-bit gamma-encoded vertex colours (three sets), or as a
 *     lightmap atlas (three textures), for comparison;
 *   - adaptive subdivision, so vertex lighting can carry shadows and pools;
 *   - ambient cubes (six colours) at probe points, for things that move.
 *
 * Why it lives here: it is documentation tooling (CLAUDE.md section 4), not
 * engine code. The lighting mockup uses it so the owner sees what each option
 * looks like and what it costs, measured by a real bake rather than painted.
 * It mirrors the planned engine baker's method so the pictures are honest; it
 * is not a reference the engine must match bit for bit.
 *
 * Like shipkit.js it is a classic script (pages work from disk), copied into a
 * page by tools/mockups/inline.py between "INLINE lib:lightbake" markers. Edit
 * it here, never in a page. Functions that build three.js objects take THREE as
 * their first argument because the page owns the three.js import.
 *
 * Deterministic: no Math.random. Every sample pattern is an R2 quasi-random
 * sequence rotated by a hash of (bake seed, receiver key, purpose), so the same
 * inputs and seed give byte-identical output, and digest() proves it.
 *
 * Units: metres; candela (cd) for a point light's intensity on its beam axis;
 * candela per square metre (cd/m^2) for emissive luminance; lux (lx) for
 * irradiance. State colours are linear RGB multipliers. Stored light is
 * gamma-encoded (2.2) with 2x overbright headroom: byte 128 shows a surface at
 * its palette colour, under the reference irradiance settings.reference_lux.

(function () {
  "use strict";

  const STATES = ["normal", "red_alert", "emergency"];
  const NS = 3;
  const GAMMA = 2.2;
  const OVERBRIGHT = 2.0;   // stored light 1.0 (byte 255) shows 2x the palette colour
  const SHOULDER = 1.5;     // display multiplier above which highlights roll off instead of clipping

    seed: 1,
    reference_lux: 100,      // irradiance that shows a surface at exactly its palette colour
    shadow_samples: 12,      // per lamp per receiver; adaptive: 4 first, the rest only in penumbra
    emitter_sample_area_m2: 0.06, // one sample per this much emissive area, 4 to 16 per emitter
    gather_rays: 48,         // cosine-weighted rays per sample, where bounce is gathered per sample (probes)
    cache_gather_rays: 128,  // cosine-weighted rays per irradiance-cache vertex; outputs interpolate the cache
    bounce_from_cache: true, // false: gather bounce at every output sample (noisier, slower; for comparison)
    cache_filter: 1,         // passes of a 3 x 3 tent filter over each patch's cached bounce (0: none); bounce is smooth
    emitter_sample_spacing_m: 0.25, // at least one sample per this much of an emitter's longest edge (long strips)
    ao_rays: 24,             // cosine-weighted rays per receiver for ambient occlusion
    ao_radius_m: 0.8,
    ao: true,
    bounces: 1,              // 0, 1 or 2
    cache_spacing_m: 0.5,    // vertex spacing of the irradiance cache that bounce rays read
    bias_m: 0.004,           // ray origin offset along the normal (no shadow acne)
    inset_m: 0.01,           // receivers on a patch edge are sampled this far inside it

  /**

   * facing n = normalize(u x v); or a triangle (tri: true, s + t <= 1). Patches
   * are what the baker subdivides and what a lightmap gives texels to.
   *
   * opts: albedoHex (palette colour), cast (in the ray scene, default true),
   * receive (in the outputs, default true), emissive ({ normal, red_alert,
   * emergency } display colours as [r, g, b] in 0..1, drawn unlit), tag.

      area: opts.tri ? area / 2 : area, lenU: len(u), lenV: len(v), tri: !!opts.tri,

      emissive: opts.emissive || null, tag: opts.tag || "",

  /** The six faces of an axis-aligned box, facing out. opts.skip: ["-y", "+x", ...]. */
  function boxPatches(min, max, opts) {
    opts = opts || {};

    const dx = x1 - x0, dy = y1 - y0, dz = z1 - z0;

    f("-y", [x0, y0, z0], [dx, 0, 0], [0, 0, dz]);
    f("+z", [x0, y0, z1], [dx, 0, 0], [0, dy, 0]);

  /**
   * Recover patches from a triangle BufferGeometry (world space): consecutive
   * coplanar triangle pairs that share an edge and form a parallelogram become
   * one quad patch; anything else stays a triangle patch. The geometry's normal
   * attribute, when present, decides which way a patch faces. ShipKit.roomShell
   * output comes back as exactly its rectangles. opts as for patch().

  function patchesFromGeometry(geometry, opts) {
    const P = geometry.getAttribute("position"), N = geometry.getAttribute("normal");
    const idx = geometry.index ? geometry.index.array : null;
    const count = idx ? idx.length : P.count;
    const vi = (k) => (idx ? idx[k] : k);
    const pos = (i) => [P.getX(i), P.getY(i), P.getZ(i)];
    const out = [];
    const same = (a, b) => Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]) + Math.abs(a[2] - b[2]) < 1e-6;
    const facing = (tri, i) => {
      const fn = cross(sub(tri[1], tri[0]), sub(tri[2], tri[0]));
      if (!N) return fn;
      const nn = [N.getX(i), N.getY(i), N.getZ(i)];

      const a = [pos(vi(k)), pos(vi(k + 1)), pos(vi(k + 2))];
      const nA = facing(a, vi(k));
      let used = false;
      if (k + 5 < count) {
        const b = [pos(vi(k + 3)), pos(vi(k + 4)), pos(vi(k + 5))];
        const shared = a.filter((p) => b.some((q) => same(p, q)));
        if (shared.length === 2) {
          const X = a.find((p) => !shared.some((q) => same(p, q)));
          const D = b.find((p) => !shared.some((q) => same(p, q)));
          const [S1, S2] = shared;
          const coplanar = Math.abs(dot(norm(nA), norm(sub(D, X)))) < 1e-5;

  function pointOn(p, s, t, inset, out) {
    const es = Math.min(0.45, inset / Math.max(p.lenU, 1e-6)), et = Math.min(0.45, inset / Math.max(p.lenV, 1e-6));
    s = Math.min(1 - es, Math.max(es, s)); t = Math.min(1 - et, Math.max(et, t));
    if (p.tri && s + t > 1 - es) { const k = (1 - es) / (s + t); s *= k; t *= k; }
    out[0] = p.o[0] + s * p.u[0] + t * p.v[0];
    out[1] = p.o[1] + s * p.u[1] + t * p.v[1];
    out[2] = p.o[2] + s * p.u[2] + t * p.v[2];

  }

  // ------------------------------------------------------------ meshes

  /**
   * A mesh here is plain typed arrays: positions, normals, display (sRGB
   * albedo 0..1), indices, plus per vertex the patch it lies on and its (s, t),
   * and per triangle its patch. Vertices are shared inside a patch (one normal,
   * one colour) and never across patches: flat shading.

  /**
   * Tessellate patches into a uniform grid of about spacing_m (Infinity: one
   * quad or triangle per patch, the deck's own density). Only patches passing
   * filter(p) are included; patch indices refer to the full list.
   */

    const b = meshBuilder(); b.keys = []; b.grids = new Array(patches.length).fill(null);
    patches.forEach((p, pi) => {
      if (filter && !filter(p)) return;
      const nu = isFinite(spacing) ? Math.max(1, Math.round(p.lenU / spacing)) : 1;
      const nv = isFinite(spacing) ? Math.max(1, Math.round(p.lenV / spacing)) : 1;
      const base = b.pv.length;
      if (!p.tri) b.grids[pi] = { base, nu, nv };
      if (!p.tri) {
        for (let j = 0; j <= nv; j++) for (let i = 0; i <= nu; i++) {
          const s = i / nu, t = j / nv;
          b.pos.push(p.o[0] + s * p.u[0] + t * p.v[0], p.o[1] + s * p.u[1] + t * p.v[1], p.o[2] + s * p.u[2] + t * p.v[2]);
          b.st.push(s, t); b.pv.push(pi); b.keys.push(hash3(pi, i, j));
        }
        for (let j = 0; j < nv; j++) for (let i = 0; i < nu; i++) {
          const a = base + j * (nu + 1) + i, c = a + nu + 2;

        const n = Math.max(nu, nv);

        for (let j = 0; j <= n; j++) { row.push(k); for (let i = 0; i <= n - j; i++) {
          const s = i / n, t = j / n;
          b.pos.push(p.o[0] + s * p.u[0] + t * p.v[0], p.o[1] + s * p.u[1] + t * p.v[1], p.o[2] + s * p.u[2] + t * p.v[2]);
          b.st.push(s, t); b.pv.push(pi); b.keys.push(hash3(pi, i, j)); k++;
        } }
        for (let j = 0; j < n; j++) for (let i = 0; i < n - j; i++) {
          const a = row[j] + i, c = row[j + 1] + i;
          b.idx.push(a, a + 1, c); b.tp.push(pi);
          if (i < n - j - 1) { b.idx.push(a + 1, c + 1, c); b.tp.push(pi); }
        }

  }

  // ------------------------------------------------------------ BVH ray caster

  /**
   * A bounding volume hierarchy over a mesh's triangles (median split on the
   * widest centroid axis, leaves of up to 4). Occlusion is two-sided: the back
   * of a wall blocks light as well as its front. Closest-hit reports whether
   * the ray met a back face, which the gather treats as black (a leak guard).
   */
  function buildBVH(mesh) {
    const nt = mesh.triangleCount, P = mesh.positions, I = mesh.indices;
    const cen = new Float32Array(nt * 3), tb = new Float32Array(nt * 6);

      for (let k = 0; k < 3; k++) {

        if (x > mxx) mxx = x; if (y > mxy) mxy = y; if (z > mxz) mxz = z;

    let nodes = 1;
    const stack = [[0, 0, nt]];
    while (stack.length) {
      const [node, start, end] = stack.pop();
      let mnx = Infinity, mny = Infinity, mnz = Infinity, mxx = -Infinity, mxy = -Infinity, mxz = -Infinity;
      let cnx = Infinity, cny = Infinity, cnz = Infinity, cxx = -Infinity, cxy = -Infinity, cxz = -Infinity;
      for (let k = start; k < end; k++) {
        const t = order[k], o = t * 6;
        if (tb[o] < mnx) mnx = tb[o]; if (tb[o + 1] < mny) mny = tb[o + 1]; if (tb[o + 2] < mnz) mnz = tb[o + 2];
        if (tb[o + 3] > mxx) mxx = tb[o + 3]; if (tb[o + 4] > mxy) mxy = tb[o + 4]; if (tb[o + 5] > mxz) mxz = tb[o + 5];
        const c = t * 3;
        if (cen[c] < cnx) cnx = cen[c]; if (cen[c + 1] < cny) cny = cen[c + 1]; if (cen[c + 2] < cnz) cnz = cen[c + 2];
        if (cen[c] > cxx) cxx = cen[c]; if (cen[c + 1] > cxy) cxy = cen[c + 1]; if (cen[c + 2] > cxz) cxz = cen[c + 2];
      }
      bb.set([mnx - 1e-5, mny - 1e-5, mnz - 1e-5, mxx + 1e-5, mxy + 1e-5, mxz + 1e-5], node * 6);
      const count = end - start;
      const ex = cxx - cnx, ey = cxy - cny, ez = cxz - cnz;
      if (count <= 4 || Math.max(ex, ey, ez) < 1e-6) { nc[node * 2] = start; nc[node * 2 + 1] = count; continue; }
      const axis = ex >= ey && ex >= ez ? 0 : ey >= ez ? 1 : 2;
      const seg = Array.from(order.subarray(start, end)).sort((a, b) => cen[a * 3 + axis] - cen[b * 3 + axis] || a - b);

    const tri = new Float32Array(nt * 9), triId = new Int32Array(nt);

      tri[k * 9] = P[a]; tri[k * 9 + 1] = P[a + 1]; tri[k * 9 + 2] = P[a + 2];
      tri[k * 9 + 3] = P[b] - P[a]; tri[k * 9 + 4] = P[b + 1] - P[a + 1]; tri[k * 9 + 5] = P[b + 2] - P[a + 2];
      tri[k * 9 + 6] = P[c] - P[a]; tri[k * 9 + 7] = P[c + 1] - P[a + 1]; tri[k * 9 + 8] = P[c + 2] - P[a + 2];
    }
    return { bb: bb.subarray(0, nodes * 6), nc: nc.subarray(0, nodes * 2), tri, triId, nodes, triangles: nt, stack: new Int32Array(128) };
  }

  const EPS_T = 1e-4;

  /** True when anything lies on the ray within (EPS_T, tmax). */
  function occluded(B, ox, oy, oz, dx, dy, dz, tmax) {
    if (B.triangles === 0) return false;
    const ix = 1 / (dx || 1e-12), iy = 1 / (dy || 1e-12), iz = 1 / (dz || 1e-12);
    const bb = B.bb, nc = B.nc, T = B.tri, st = B.stack;
    let sp = 0; st[sp++] = 0;
    while (sp > 0) {
      const n = st[--sp], b = n * 6;
      let t0 = (bb[b] - ox) * ix, t1 = (bb[b + 3] - ox) * ix;
      let tn = t0 < t1 ? t0 : t1, tf = t0 < t1 ? t1 : t0;
      t0 = (bb[b + 1] - oy) * iy; t1 = (bb[b + 4] - oy) * iy;
      if (t0 > t1) { const q = t0; t0 = t1; t1 = q; }
      if (t0 > tn) tn = t0; if (t1 < tf) tf = t1;
      t0 = (bb[b + 2] - oz) * iz; t1 = (bb[b + 5] - oz) * iz;
      if (t0 > t1) { const q = t0; t0 = t1; t1 = q; }
      if (t0 > tn) tn = t0; if (t1 < tf) tf = t1;
      if (tf < tn || tf < 0 || tn > tmax) continue;
      const first = nc[n * 2], cnt = nc[n * 2 + 1];
      if (cnt > 0) {

          const inv = 1 / det;
          const tx = ox - T[o], ty = oy - T[o + 1], tz = oz - T[o + 2];

          const v = (dx * qx + dy * qy + dz * qz) * inv;

          const t = (e2x * qx + e2y * qy + e2z * qz) * inv;
          if (t > EPS_T && t < tmax) return true;
        }

    }

  }

  /** Closest hit. Returns false or fills hit = { tri (mesh triangle), t, u, v, back }. */
  function closest(B, ox, oy, oz, dx, dy, dz, tmax, hit) {

    const bb = B.bb, nc = B.nc, T = B.tri, st = B.stack;

    while (sp > 0) {

      let tn = t0 < t1 ? t0 : t1, tf = t0 < t1 ? t1 : t0;
      t0 = (bb[b + 1] - oy) * iy; t1 = (bb[b + 4] - oy) * iy;

      if (t0 > tn) tn = t0; if (t1 < tf) tf = t1;
      t0 = (bb[b + 2] - oz) * iz; t1 = (bb[b + 5] - oz) * iz;
      if (t0 > t1) { const q = t0; t0 = t1; t1 = q; }
      if (t0 > tn) tn = t0; if (t1 < tf) tf = t1;
      if (tf < tn || tf < 0 || tn > best) continue;
      const first = nc[n * 2], cnt = nc[n * 2 + 1];
      if (cnt > 0) {
        for (let k = first; k < first + cnt; k++) {
          const o = k * 9;
          const e1x = T[o + 3], e1y = T[o + 4], e1z = T[o + 5], e2x = T[o + 6], e2y = T[o + 7], e2z = T[o + 8];
          const px = dy * e2z - dz * e2y, py = dz * e2x - dx * e2z, pz = dx * e2y - dy * e2x;
          const det = e1x * px + e1y * py + e1z * pz;
          if (det > -1e-12 && det < 1e-12) continue;
          const inv = 1 / det;
          const tx = ox - T[o], ty = oy - T[o + 1], tz = oz - T[o + 2];
          const u = (tx * px + ty * py + tz * pz) * inv;
          if (u < 0 || u > 1) continue;
          const qx = ty * e1z - tz * e1y, qy = tz * e1x - tx * e1z, qz = tx * e1y - ty * e1x;
          const v = (dx * qx + dy * qy + dz * qz) * inv;
          if (v < 0 || u + v > 1) continue;
          const t = (e2x * qx + e2y * qy + e2z * qz) * inv;
          if (t > EPS_T && t < best) { best = t; bk = k; bu = u; bv = v; bdet = det; }
        }

        const axis = -cnt - 1, dpos = axis === 0 ? dx > 0 : axis === 1 ? dy > 0 : dz > 0;
        if (dpos) { st[sp++] = first + 1; st[sp++] = first; } else { st[sp++] = first; st[sp++] = first + 1; }
      }

    if (bk < 0) return false;
    hit.tri = B.triId[bk]; hit.t = best; hit.u = bu; hit.v = bv; hit.back = bdet < 0;
    return true;
  }

  // ------------------------------------------------------------ scene and lights

  /**
   * Prepare a bake. def:
   *   patches   all patches (receivers, occluders and emissive), world space
   *   occluders axis-aligned boxes [{ min, max, albedoHex }] that only cast
   *   lights    point lights: { id, position_m, radius_m, intensity_cd,
   *             beam: { axis, exponent } or null, range_m, states }
   *   emitters  area lights: { id, quad: { o, u, v } (emits along u x v),
   *             luminance_cd_m2, beam_exponent, range_m, states }
   *   ambient_lux { normal: [r, g, b], ... } lux of fill light, times AO
   *   settings  see DEFAULTS
   * states: { normal: [r, g, b], red_alert: [...], emergency: [...] } linear
   * multipliers of the light's intensity; [0, 0, 0] is off in that state.
   */
  function scene(def) {
    const settings = Object.assign({}, DEFAULTS, def.settings || {});
    const patches = def.patches.slice();
    for (const b of def.occluders || []) for (const p of boxPatches(b.min, b.max, { albedoHex: b.albedoHex !== undefined ? b.albedoHex : 0x606060, receive: false, tag: "occluder" })) patches.push(p);
    const stateVec = (st) => { const v = new Float32Array(9); STATES.forEach((s, i) => { const c = (st && st[s]) || [0, 0, 0]; v[i * 3] = c[0]; v[i * 3 + 1] = c[1]; v[i * 3 + 2] = c[2]; }); return v; };
    const lights = (def.lights || []).map((l) => ({
      id: l.id, p: l.position_m.slice(), r: l.radius_m || 0, I: l.intensity_cd,
      axis: l.beam ? norm(l.beam.axis) : null, exp: l.beam ? l.beam.exponent : 0,
      range: l.range_m, st: stateVec(l.states),
    }));
    const emitters = (def.emitters || []).map((e) => {
      const q = e.quad, c = cross(q.u, q.v), area = len(c), n = norm(c);
      const longest = Math.max(len(q.u), len(q.v));
      const ns = Math.max(4, Math.min(64, Math.max(Math.ceil(area / settings.emitter_sample_area_m2), Math.ceil(longest / settings.emitter_sample_spacing_m))));
      const centre = add(q.o, add(scale(q.u, 0.5), scale(q.v, 0.5)));
      return { id: e.id, o: q.o.slice(), u: q.u.slice(), v: q.v.slice(), n, area, L: e.luminance_cd_m2, exp: e.beam_exponent || 1,
        range: e.range_m, st: stateVec(e.states), ns, centre, halfDiag: 0.5 * len(add(q.u, q.v)) };
    });

    const t0 = performance.now();
    const cache = tessellate(patches, settings.cache_spacing_m, (p) => p.cast);
    const bvh = buildBVH(cache);
    const triAlbedo = new Float32Array(cache.triangleCount * 3);
    for (let t = 0; t < cache.triangleCount; t++) triAlbedo.set(patches[cache.patchOfTriangle[t]].albedo, t * 3);
    return {
      settings, patches, lights, emitters, ambient, cache, bvh, triAlbedo,
      source: null, // per cache vertex, 9 floats: the light that bounce rays pick up
      field: null,  // per cache vertex, 9 floats: the bounce irradiance there (bounce_from_cache)
      rays: { shadow: 0, gather: 0, ao: 0 }, buildMs: performance.now() - t0,
    };
  }

  // ------------------------------------------------------------ the receiver function

  const DIRECT = 1, AMBIENT = 2, BOUNCE = 4, ALL = 7;
  const _b = new Float64Array(6), _q = [0, 0, 0], _hit = { tri: 0, t: 0, u: 0, v: 0, back: false };

  /**
   * The one irradiance function. Everything baked (cache vertices, output
   * vertices, lightmap texels, probe faces) is a call to this with a point, a
   * normal and a seed key, so every output form agrees by construction.
   * Adds into out[9] (lux per state, RGB) and returns the AO factor.
   */
  function irradiance(S, px, py, pz, nx, ny, nz, key, what, out, gatherRays) {
    const set = S.settings, B = S.bvh, seed = set.seed >>> 0;
    const ox = px + nx * set.bias_m, oy = py + ny * set.bias_m, oz = pz + nz * set.bias_m;
    let ao = 1;
    if (what & DIRECT) {
      // Point lights with a radius: sample a disc facing the receiver (soft shadows).
      for (let li = 0; li < S.lights.length; li++) {
        const L = S.lights[li];
        const cx = L.p[0] - px, cy = L.p[1] - py, cz = L.p[2] - pz;
        const cd = Math.sqrt(cx * cx + cy * cy + cz * cz);

        if (cx * nx + cy * ny + cz * nz < -L.r) continue;
        const wx = cx / cd, wy = cy / cd, wz = cz / cd;
        basis(wx, wy, wz, _b);
        const h = hash3(seed, key, 0x1000 + li), r1 = u01(h), r2 = u01(mix32(h));
        const nsMax = L.r > 0 ? set.shadow_samples : 1;
        let sum = 0, cnt = 0, vis = 0, tested = 0;
        for (let k = 0; k < nsMax; k++) {
          if (k === 4 && tested > 0 && (vis === 0 || vis === tested)) break; // umbra or fully lit: done
          const a = frac(r1 + k * R2A), bb = frac(r2 + k * R2B);
          const rr = L.r * Math.sqrt(a), ph = 6.283185307179586 * bb;
          const qx = L.p[0] + rr * (Math.cos(ph) * _b[0] + Math.sin(ph) * _b[3]);
          const qy = L.p[1] + rr * (Math.cos(ph) * _b[1] + Math.sin(ph) * _b[4]);
          const qz = L.p[2] + rr * (Math.cos(ph) * _b[2] + Math.sin(ph) * _b[5]);
          let dx = qx - ox, dy = qy - oy, dz = qz - oz;
          const d2 = dx * dx + dy * dy + dz * dz, d = Math.sqrt(d2);
          dx /= d; dy /= d; dz /= d;
          cnt++;
          const cosr = dx * nx + dy * ny + dz * nz;
          if (cosr <= 0) continue;
          let g = 1;
          if (L.axis) { const ce = -(dx * L.axis[0] + dy * L.axis[1] + dz * L.axis[2]); if (ce <= 0) continue; g = Math.pow(ce, L.exp); }
          const x = d / L.range, win = x >= 1 ? 0 : (1 - x * x * x * x) * (1 - x * x * x * x);
          if (win <= 0) continue;
          tested++; S.rays.shadow++;
          if (occluded(B, ox, oy, oz, dx, dy, dz, d - 0.01)) continue;
          vis++;
          sum += (L.I * g * cosr * win) / Math.max(d2, 0.04);
        }
        if (sum > 0 && cnt > 0) {
          const e = sum / cnt;
          for (let c = 0; c < 9; c++) out[c] += e * L.st[c];
        }
      }
      // Area emitters: sample points on the quad, cosine at both ends.
      for (let ei = 0; ei < S.emitters.length; ei++) {
        const E = S.emitters[ei];
        const cx = E.centre[0] - px, cy = E.centre[1] - py, cz = E.centre[2] - pz;
        const cd = Math.sqrt(cx * cx + cy * cy + cz * cz);
        if (cd - E.halfDiag > E.range) continue;
        if (cx * nx + cy * ny + cz * nz < -E.halfDiag) continue;
        if (-(cx * E.n[0] + cy * E.n[1] + cz * E.n[2]) < -E.halfDiag) continue; // receiver behind the emitter
        const h = hash3(seed, key, 0x2000 + ei), r1 = u01(h), r2 = u01(mix32(h));
        const dA = E.area / E.ns;
        let sum = 0;
        for (let k = 0; k < E.ns; k++) {
          const a = frac(r1 + k * R2A), bb = frac(r2 + k * R2B);
          const qx = E.o[0] + a * E.u[0] + bb * E.v[0] + E.n[0] * 0.01;
          const qy = E.o[1] + a * E.u[1] + bb * E.v[1] + E.n[1] * 0.01;
          const qz = E.o[2] + a * E.u[2] + bb * E.v[2] + E.n[2] * 0.01;
          let dx = qx - ox, dy = qy - oy, dz = qz - oz;
          const d2 = dx * dx + dy * dy + dz * dz, d = Math.sqrt(d2);

  // ------------------------------------------------------------ async plumbing

  function yielder(S, onProgress) {
    let last = performance.now();

  /**

<script type="module">

  console_screen: { luminance_cd_m2: 160, range_m: 3.5, emergency_scale: 0.6 },

    const depth = isWindow ? 0.25 : 0.12;
    const back = op.plane - inward * depth;
    const lo = Math.min(op.plane, back), hi = Math.max(op.plane, back);
    const rev = isWindow ? PAL.wallDark : PAL.trim;
    // Reveals: the four sides of the opening, facing into it.
    out.push(rect(op.v, r.v0, op.u, ax, r.u0, r.u1, lo, hi, 1, { albedoHex: rev, tag: "reveal" }));
    out.push(rect(op.v, r.v1, op.u, ax, r.u0, r.u1, lo, hi, -1, { albedoHex: rev, tag: "reveal" }));
    out.push(rect(op.u, r.u0, op.v, ax, r.v0, r.v1, lo, hi, 1, { albedoHex: rev, tag: "reveal" }));
    out.push(rect(op.u, r.u1, op.v, ax, r.v0, r.v1, lo, hi, -1, { albedoHex: rev, tag: "reveal" }));
    if (!isWindow) out.push(rect(ax, back, op.u, op.v, r.u0, r.u1, r.v0, r.v1, inward, { albedoHex: PAL.door, tag: "door" }));
  }
  return out;
}

/** Everything a compartment needs: patches, lights, emitters, emissive look, camera, crew figure spot. */
function buildCompartment(id) {
  const comp = K.compartment(L, id);
  const patches = shellPatches(comp);
  const emissive = [];   // { patch, look: { normal, red_alert, emergency } }
  const lights = [], emitters = [];
  const fixtures = deriveLights(comp);
  const addEmitter = (quadPatch, type, states, look, idTag) => {
    const t = FIXTURE_TYPES[type];
    emitters.push({ id: idTag, quad: { o: quadPatch.o, u: quadPatch.u, v: quadPatch.v }, luminance_cd_m2: t.luminance_cd_m2, beam_exponent: 1, range_m: t.range_m, states });
    emissive.push({ patch: quadPatch, look });
  };
  for (const f of fixtures) {
    const t = FIXTURE_TYPES[f.type];
    if (f.type === "ceiling_panel" || f.type === "high_bay") {
      lights.push({ id: f.id, position_m: f.center_m, radius_m: t.radius_m, intensity_cd: t.intensity_cd, beam: { axis: [0, -1, 0], exponent: t.beam_exponent }, range_m: t.range_m, states: lampStates(f.emergency_bus, t) });
      const h = t.panel_m / 2, y = f.center_m[1] + 0.105;
      emissive.push({ patch: rect("y", y, "z", "x", f.center_m[2] - h, f.center_m[2] + h, f.center_m[0] - h, f.center_m[0] + h, -1, {}), look: lampLook(f.emergency_bus) });
    } else if (f.type === "cove_strip") {
      const w = t.width_m / 2, x = f.from_m[0], facing = f.facing_yaw_deg < 0 ? -1 : 1;
      const q = rect("x", x, "z", "y", f.from_m[2], f.to_m[2], f.from_m[1] - w, f.from_m[1] + w, facing, {});
      addEmitter(q, "cove_strip", stripStates(), stripLook(), f.id);
    }
  }
  const props = [];
  let view, crew;
  if (id === "bridge") {
    const dais = K.byId(L.fixtures, "captain_dais");
    const dh = dais.height_m, dc = dais.center_m, ds = dais.size_m;
    props.push(...box([dc[0] - ds[0] / 2, dc[1], dc[2] - ds[1] / 2], [dc[0] + ds[0] / 2, dc[1] + dh, dc[2] + ds[1] / 2], PAL.wallDark, ["-y"]));
    for (const st of K.stationsIn(L, "bridge")) {
      const seat = st.seat_m, yaw = st.yaw_deg, role = PAL.role[st.role] || PAL.screen;
      const sb = (f, w, d, y0, y1) => stationBox(seat, yaw, f, w, d, y0, y1);
      // Seat and backrest.
      let q = sb(0, 0.5, 0.5, 0, 0.46); props.push(...box(q.min, q.max, PAL.console, ["-y"]));
      q = sb(-0.27, 0.5, 0.06, 0.46, 1.05); props.push(...box(q.min, q.max, PAL.console, ["-y"]));
      if (st.role === "command") {
        // Captain: an armrest panel with a small screen on the right.
        const side = stationBox([seat[0] - Math.round(Math.cos((yaw * Math.PI) / 180)) * 0.42, seat[1], seat[2] + Math.round(Math.sin((yaw * Math.PI) / 180)) * 0.42], yaw, 0.1, 0.16, 0.5, 0, 0.72);
        props.push(...box(side.min, side.max, PAL.console, ["-y"]));
        const sx = (side.min[0] + side.max[0]) / 2;
        const scr = rect("y", side.max[1] + 0.005, "x", "z", sx - 0.06, sx + 0.06, side.min[2] + 0.06, side.max[2] - 0.06, 1, {});
        addEmitter(scr, "console_screen", steadyStates(role, FIXTURE_TYPES.console_screen.emergency_scale), steadyLook(role, 0.6), st.id + "_screen");
        continue;
      }
      // Console: pedestal, desk with an overhang, screen panel.
      q = sb(0.85, 1.0, 0.3, 0, 0.74); props.push(...box(q.min, q.max, PAL.console, ["-y"]));
      q = sb(0.68, 1.3, 0.66, 0.74, 0.8); props.push(...box(q.min, q.max, PAL.trim));
      const panel = sb(0.98, 1.2, 0.06, 0.8, 1.38); props.push(...box(panel.min, panel.max, PAL.console, ["-y"]));
      // Screen on the panel's operator side, 5 mm proud.
      const s = Math.round(Math.sin((yaw * Math.PI) / 180)), c = Math.round(Math.cos((yaw * Math.PI) / 180));
      let scr;
      if (s === 0) { const z = c > 0 ? panel.min[2] - 0.005 : panel.max[2] + 0.005; scr = rect("z", z, "x", "y", panel.min[0] + 0.08, panel.max[0] - 0.08, 0.86 + seat[1], 1.32 + seat[1], -c, {}); }
      else { const x = s > 0 ? panel.min[0] - 0.005 : panel.max[0] + 0.005; scr = rect("x", x, "z", "y", panel.min[2] + 0.08, panel.max[2] - 0.08, 0.86 + seat[1], 1.32 + seat[1], -s, {}); }
      addEmitter(scr, "console_screen", steadyStates(role, FIXTURE_TYPES.console_screen.emergency_scale), steadyLook(role, 0.6), st.id + "_screen");
    }
    // Viewscreen bezel and the screen as an area light.
    const vs = K.byId(L.fixtures, "viewscreen"), vc = vs.center_m, vw = vs.size_m[0] / 2, vh = vs.size_m[1] / 2;
    props.push(...box([vc[0] - vw - 0.12, vc[1] - vh - 0.12, vc[2] - 0.02], [vc[0] + vw + 0.12, vc[1] + vh + 0.12, 31.0], PAL.console, ["+z"]));
    const vq = rect("z", vc[2] - 0.025, "x", "y", vc[0] - vw, vc[0] + vw, vc[1] - vh, vc[1] + vh, -1, {});
    const vt = FIXTURE_TYPES.viewscreen;
    emitters.push({ id: "viewscreen", quad: { o: vq.o, u: vq.u, v: vq.v }, luminance_cd_m2: vt.luminance_cd_m2, beam_exponent: 1, range_m: vt.range_m, states: steadyStates(vt.color, 1) });
    view = {
      // Cutaway: outside the aft-port corner, above the ceiling. Back faces are culled, so the ceiling and the two near

      cutaway: { pos: [-8.6, 12.6, 13.6], target: [1.2, 3.0, 25.0], fov: 50 },
      centre: { pos: [0.0, 13.8, 12.6], target: [0.0, 3.0, 24.6], fov: 54 },
      eye: { pos: [-5.7, 5.3, 20.45], target: [0.8, 3.7, 26.4], fov: 62 },
      // Close: above the captain's chair, down onto helm (left of centre) and tactical (right), which mirror each other.
      close: { pos: [0.0, 6.3, 23.3], target: [0.0, 3.5, 27.4], fov: 64 },

  } else if (id === "engineering") {

    for (const cl of cells) {
      props.push(rect("y", mc[1], "x", "z", cl.u0, cl.u1, cl.v0, cl.v1, 1, { albedoHex: PAL.floor, tag: "floor" }));
      props.push(rect("y", mc[1] - slab, "x", "z", cl.u0, cl.u1, cl.v0, cl.v1, -1, { albedoHex: PAL.ceiling }));
    }
    const y0 = mc[1] - slab, y1 = mc[1];
    props.push(rect("x", mc[0] - r, "z", "y", mc[2] - r, mc[2] + r, y0, y1, -1, { albedoHex: PAL.hazard }));
    props.push(rect("x", mc[0] + r, "z", "y", mc[2] - r, mc[2] + r, y0, y1, 1, { albedoHex: PAL.hazard }));
    props.push(rect("z", mc[2] - r, "x", "y", mc[0] - r, mc[0] + r, y0, y1, -1, { albedoHex: PAL.hazard }));
    props.push(rect("z", mc[2] + r, "x", "y", mc[0] - r, mc[0] + r, y0, y1, 1, { albedoHex: PAL.hazard }));
    // Parapets round the well, and columns under its corners.
    const pt = 0.08, ph = 1.0;
    props.push(...box([mc[0] - r, y1, mc[2] - r], [mc[0] - r + pt, y1 + ph, mc[2] + r], PAL.trim, ["-y"]));
    props.push(...box([mc[0] + r - pt, y1, mc[2] - r], [mc[0] + r, y1 + ph, mc[2] + r], PAL.trim, ["-y"]));
    props.push(...box([mc[0] - r + pt, y1, mc[2] - r], [mc[0] + r - pt, y1 + ph, mc[2] - r + pt], PAL.trim, ["-y"]));
    props.push(...box([mc[0] - r + pt, y1, mc[2] + r - pt], [mc[0] + r - pt, y1 + ph, mc[2] + r], PAL.trim, ["-y"]));
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) props.push(...box([mc[0] + sx * r - 0.15, b.y[0], mc[2] + sz * r - 0.15], [mc[0] + sx * r + 0.15, y0, mc[2] + sz * r + 0.15], PAL.wallDark, ["-y", "+y"]));
    // Catwalk at deck A by the aft door.
    const cw = K.byId(L.fixtures, "eng_catwalk"), cc = cw.center_m, cs = cw.size_m;
    const cx0 = cc[0] - cs[0] / 2, cx1 = cc[0] + cs[0] / 2, cz0 = cc[2] - cs[1] / 2, cz1 = cc[2] + cs[1] / 2;
    props.push(...box([cx0, cc[1] - 0.25, cz0], [cx1, cc[1], cz1], PAL.floorCorridor, ["+z"]));
    props.push(...box([cx0, cc[1], cz0], [cx1, cc[1] + 1.0, cz0 + 0.06], PAL.trim, ["-y"]));
    props.push(...box([cx0, cc[1], cz0 + 0.06], [cx0 + 0.06, cc[1] + 1.0, cz1], PAL.trim, ["-y", "+z"]));
    props.push(...box([cx1 - 0.06, cc[1], cz0 + 0.06], [cx1, cc[1] + 1.0, cz1], PAL.trim, ["-y", "+z"]));
    // The reactor: a 12-sided prism through three decks, with glowing bands.
    const re = K.byId(L.systems, "reactor"), rc = re.center_m, rr = re.radius_m, N = 12;
    const ry0 = rc[1] - re.height_m / 2, ry1 = rc[1] + re.height_m / 2;
    for (let k = 0; k < N; k++) {

      let U = [p1[0] - p0[0], 0, p1[2] - p0[2]], V = [0, ry1 - ry0, 0];
      const out = [Math.cos((a0 + a1) / 2), 0, Math.sin((a0 + a1) / 2)];
      const cr = [U[1] * V[2] - U[2] * V[1], U[2] * V[0] - U[0] * V[2], U[0] * V[1] - U[1] * V[0]];
      let o = p0;

      props.push(LB.patch(o, U, V, { albedoHex: PAL.hullDark, tag: "reactor" }));
      const rt = FIXTURE_TYPES.reactor_glow;
      for (const [gy0, gy1] of [[0.55, 0.95], [3.7, 4.1], [-2.3, -1.9]]) {
        const off = [out[0] * 0.01, 0, out[2] * 0.01];

        const gq = LB.patch(go, U, [0, gy1 - gy0, 0], {});
        addEmitter(gq, "reactor_glow", steadyStates(rt.color, rt.emergency_scale), steadyLook(rt.color, rt.emergency_scale), "reactor_glow");

    for (const st of K.stationsIn(L, "engineering")) {

      const sb = (f, w, d, y0b, y1b) => stationBox(seat, yaw, f, w, d, y0b, y1b);
      let q = sb(0, 0.5, 0.5, 0, 0.46); props.push(...box(q.min, q.max, PAL.console, ["-y"]));
      q = sb(-0.27, 0.5, 0.06, 0.46, 1.05); props.push(...box(q.min, q.max, PAL.console, ["-y"]));
      q = sb(0.85, 1.0, 0.3, 0, 0.74); props.push(...box(q.min, q.max, PAL.console, ["-y"]));
      q = sb(0.68, 1.3, 0.66, 0.74, 0.8); props.push(...box(q.min, q.max, PAL.trim));
      const panel = sb(0.98, 1.2, 0.06, 0.8, 1.38); props.push(...box(panel.min, panel.max, PAL.console, ["-y"]));
      const c = Math.round(Math.cos((yaw * Math.PI) / 180));
      const z = c > 0 ? panel.min[2] - 0.005 : panel.max[2] + 0.005;
      const scr = rect("z", z, "x", "y", panel.min[0] + 0.08, panel.max[0] - 0.08, 0.86 + seat[1], 1.32 + seat[1], -c, {});
      addEmitter(scr, "console_screen", steadyStates(role, FIXTURE_TYPES.console_screen.emergency_scale), steadyLook(role, 0.6), st.id + "_screen");
    }
    // Main switchboard: three cabinets on the port wall with indicator panels.
    const sw = K.byId(L.systems, "main_switchboard").center_m;
    for (let k = 0; k < 3; k++) {
      const z0 = sw[2] - 2.4 + k * 1.6, z1 = z0 + 1.45;
      props.push(...box([b.x[1] - 0.7, sw[1], z0], [b.x[1], sw[1] + 2.1, z1], PAL.wallDark, ["-y", "+x"]));
      const ip = rect("x", b.x[1] - 0.705, "z", "y", z0 + 0.25, z1 - 0.25, sw[1] + 1.2, sw[1] + 1.6, -1, {});
      const it = FIXTURE_TYPES.indicator_panel;
      addEmitter(ip, "indicator_panel", steadyStates(it.color, 0.8), steadyLook(it.color, 0.8), "switchboard_" + k);
    }
    // Coolant pumps on deck C with risers to the slab.
    const cp = K.byId(L.systems, "coolant_pumps").center_m;
    for (const dz of [-1.1, 1.1]) {
      props.push(...box([cp[0] - 0.7, cp[1], cp[2] + dz - 0.55], [cp[0] + 0.7, cp[1] + 1.3, cp[2] + dz + 0.55], PAL.hullAccent, ["-y"]));
      props.push(...box([cp[0] - 0.15, cp[1] + 1.3, cp[2] + dz - 0.15], [cp[0] + 0.15, y0, cp[2] + dz + 0.15], PAL.trim, ["-y", "+y"]));
    }
    view = {
      cutaway: { pos: [-14.0, 15.0, -8.6], target: [1.6, -1.2, -25.6], fov: 52 },
      centre: { pos: [0.0, 17.0, -6.0], target: [0.0, -1.2, -25.0], fov: 56 },
      eye: { pos: [-7.6, 1.7, -19.0], target: [2.4, 0.5, -27.6], fov: 66 },
      close: { pos: [3.4, 2.6, -18.6], target: [5.6, 0.2, -21.4], fov: 64 },
    };
    crew = { pos: [4.2, 0.0, -22.2], yaw: 150 };
  }
  for (const p of props) patches.push(p);
  // Ambient fill per state: ShipKit.LIGHTING's ambient colour and weight, in lux.
  const ambient_lux = {};
  for (const s of LB.STATES) ambient_lux[s] = lin(LS[s].ambient, LS[s].ambientI * BAKE.ambient_scale_lux);
  return { comp, patches, lights, emitters, emissive, fixtures, ambient_lux, view, crew };
}

// ------------------------------------------------------------------ bakes (cached)

const COMP = {};
const bakeCache = new Map();
const busyEl = document.getElementById("busy");
function busy(text) { busyEl.style.display = text ? "block" : "none"; if (text) busyEl.textContent = text; }

function compartmentData(id) { return COMP[id] || (COMP[id] = buildCompartment(id)); }

async function bakeScene(id, bounces, ao) {
  const key = `scene:${id}:${bounces}:${ao}`;
  if (!bakeCache.has(key)) bakeCache.set(key, (async () => {
    const C = compartmentData(id);
    const S = LB.scene({ patches: C.patches, lights: C.lights, emitters: C.emitters, ambient_lux: C.ambient_lux,
      settings: Object.assign({}, BAKE, { bounces, ao }) });
    await LB.prepare(S, (f) => busy(`Baking ${C.comp.name}: irradiance cache ${(f * 100).toFixed(0)}%`));
    return S;
  })());
  return bakeCache.get(key);
}

async function bakeOutput(id, mode, o) {
  const key = `out:${id}:${mode}:${o.bounces}:${o.ao}:${mode === "lightmap" ? o.texel : ""}`;
  if (!bakeCache.has(key)) bakeCache.set(key, (async () => {
    const C = compartmentData(id);
    const S = await bakeScene(id, o.bounces, o.ao);
    const label = (f) => busy(`Baking ${C.comp.name}, ${MODES[mode].short}, all three states: ${(f * 100).toFixed(0)}%`);
    let res;
    if (mode === "vertex" || mode === "unlit" || mode === "dynamic") {
      const mesh = LB.tessellate(C.patches, Infinity, (p) => p.receive);
      res = mode === "vertex" ? await LB.bakeVertices(S, mesh, label) : { mesh, sets: null, stats: null };
      res.mesh = mesh;
    } else if (mode === "adaptive" || mode === "adaptive_full") {
      const cap = mode === "adaptive" ? BAKE.max_added_triangles[id] : BAKE.uncapped_triangles;
      res = await LB.bakeAdaptive(S, Object.assign({}, BAKE.adaptive, { max_added_triangles: cap }), label);
    } else if (mode === "lightmap") {
      res = await LB.bakeLightmap(S, { texel_m: o.texel }, label);
    }
    res.scene = S;
    if (res.sets) res.digest = LB.digest([res.sets.normal, res.sets.red_alert, res.sets.emergency]);
    if (res.atlas) res.digest = LB.digest([res.atlas.sets.normal, res.atlas.sets.red_alert, res.atlas.sets.emergency]);
    res.object = makeSurface(mode, res);
    res.wire = makeWire(res.mesh);
    busy(null);
    return res;
  })());
  return bakeCache.get(key);
}

// ------------------------------------------------------------------ three.js objects

const scene = new THREE.Scene();
const overlay = new THREE.Scene();
const lambert = new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true });
const basic = new THREE.MeshBasicMaterial({ vertexColors: true });
const stateW = new THREE.Vector3(1, 0, 0);
const vmats = [];
function makeSurface(mode, res) {
  let mat;
  if (mode === "unlit") mat = basic;
  else if (mode === "dynamic") mat = lambert;
  else if (mode === "lightmap") { mat = LB.lightmapMaterial(THREE, LB.lightmapTextures(THREE, res.atlas), res.atlas); res.material = mat; }
  else { mat = LB.vertexMaterial(THREE); res.material = mat; }
  if (mat.uniforms) { mat.uniforms.stateW.value = stateW; vmats.push(mat); }
  const m = new THREE.Mesh(LB.toGeometry(THREE, res.mesh, res.sets), mat);
  m.visible = false; scene.add(m);
  return m;
}
function makeWire(mesh) {
  const seen = new Set(), pos = [];
  const P = mesh.positions, N = mesh.normals, I = mesh.indices;
  const at = (i) => [P[i * 3] + N[i * 3] * 0.012, P[i * 3 + 1] + N[i * 3 + 1] * 0.012, P[i * 3 + 2] + N[i * 3 + 2] * 0.012];
  for (let t = 0; t < mesh.triangleCount; t++) for (let e = 0; e < 3; e++) {
    const a = I[t * 3 + e], b = I[t * 3 + ((e + 1) % 3)], k = a < b ? a * 1e6 + b : b * 1e6 + a;
    if (seen.has(k)) continue; seen.add(k);
    pos.push(...at(a), ...at(b));
  }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  const w = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0x7cf0ff, transparent: true, opacity: 0.55 }));
  w.visible = false; overlay.add(w);
  return w;
}

/** Emissive surfaces (lamps, strips, screens, glow) in one draw call, with a colour set per state. */
function makeEmissive(C) {
  const patches = C.emissive.map((e) => Object.assign({}, e.patch, { display: [1, 1, 1], receive: true }));
  const mesh = LB.tessellate(patches, Infinity, null);
  const sets = {};
  for (const s of LB.STATES) {
    const a = new Uint8Array(mesh.vertexCount * 4);
    for (let i = 0; i < mesh.vertexCount; i++) {
      const c = C.emissive[mesh.patchOfVertex[i]].look[s];
      for (let k = 0; k < 3; k++) a[i * 4 + k] = Math.round((c[k] / LB.OVERBRIGHT) * 255);
      a[i * 4 + 3] = 255;
    }
    sets[s] = a;
  }
  const mat = LB.vertexMaterial(THREE); mat.uniforms.stateW.value = stateW; mat.side = THREE.DoubleSide;
  const m = new THREE.Mesh(LB.toGeometry(THREE, mesh, sets), mat);
  m.visible = false; scene.add(m);
  return m;
}

/** The viewscreen's picture (the exterior feed): a canvas, unlit. */
function makeViewscreen() {
  const vs = K.byId(L.fixtures, "viewscreen");
  const cv = document.createElement("canvas"); cv.width = 512; cv.height = 205;

        renderer.setScissorTest(true); renderer.setScissor(0, 0, split ? half : innerWidth, innerHeight);
        current.left.wire.visible = true; renderer.render(overlay, camera); current.left.wire.visible = false;
        renderer.setScissorTest(false);
      }
      if (split && isVertexMode(current.rightMode)) {
        renderer.setScissorTest(true); renderer.setScissor(half, 0, innerWidth - half, innerHeight);
        current.right.wire.visible = true; renderer.render(overlay, camera); current.right.wire.visible = false;
        renderer.setScissorTest(false);
      }
    }
    tagL.style.display = tagR.style.display = divider.style.display = split ? "block" : "none";
    if (split) {
      tagL.textContent = MODES[current.leftMode].label; tagR.textContent = MODES[current.rightMode].label;
      tagL.style.left = "12px"; tagR.style.left = half + 12 + "px"; divider.style.left = half - 1 + "px";
      tagL.style.top = tagR.style.top = "150px";
    }
    if (!ready) { ready = true; K.markReady(); }
  });
})();
</script>
