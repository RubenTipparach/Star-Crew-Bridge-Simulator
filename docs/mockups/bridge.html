<!doctype html>
<!--
  bridge.html: the Tern's bridge, its stations and their consoles, presenting
  openspec/changes/bridge-stations (and crew-on-deck's eye height).

  Built from data/ships/tern/layout.json through shipkit.js (inlined below by
  tools/mockups/inline.py; never hand-edit between the INLINE markers). The
  viewscreen shows a live exterior scene rendered to a 1024x512 target, and the
  windows show the same exterior through a scissored pass from a camera that is
  the interior camera carried by the ship's exterior pose: the interior never
  moves while the ship turns (ship-frames). Console overlays follow the
  wireframes in openspec/changes/bridge-stations/design.md section 10.
-->

  .pnl > footer { position: absolute; left: 6px; right: 6px; bottom: 4px; height: 24px; display: flex; gap: 4px; }

  .bar .f { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 2px; }
  .bar .f.ok { background: var(--ok); } .bar .f.warn { background: var(--warn); } .bar .f.danger { background: var(--danger); }

  .b { flex: 1; min-width: 0; border: 1px solid var(--line); background: #121a23; color: var(--fg); font: 700 10.5px/22px system-ui, sans-serif; text-align: center; border-radius: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .b.focus { outline: 2px solid var(--focus); outline-offset: -2px; }
  .b.off { color: #4d5866; border-color: #1e262f; }
  table.t { border-collapse: collapse; width: 100%; font-size: 12px; table-layout: fixed; }

 * shipkit.js: the one place a mockup turns a ship layout into three.js objects.
 *
 * Every Star Crew mockup reads the same layout (data/ships/<id>/layout.json), so

 * about where a room or a door is (CLAUDE.md sections 8 and 11). This file is
 * the shared interpretation of that layout: palette, lighting states, the Pi 5
 * budget meter, room shells with door openings cut, the hull loft and labels.
 *
 * It is a classic script, not a module, so a mockup still works when opened
 * straight from disk. tools/mockups/inline.py copies it into each page between
 * the "INLINE shipkit" markers; edit it here, never in a page. Functions that
 * build geometry take THREE as their first argument because the page owns the
 * three.js import.
 *
 * Axes (from the layout): +X port, +Y up, +Z bow, metres.
 */

function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

    pos.set([R * s * Math.cos(th), R * u, R * s * Math.sin(th)], i * 3);

function stepExterior(t) {
  // The ship's exterior pose: a slow yaw and pitch weave (the interior never moves).
  ship.rotation.set(0.05 * Math.sin((2 * Math.PI * t) / 61), 0.22 * Math.sin((2 * Math.PI * t) / 90), 0.03 * Math.sin((2 * Math.PI * t) / 47), "YXZ");
  ship.position.set(0, 0, 0);
  ship.updateMatrixWorld(true);
  raiderPos.set(-70 + 60 * Math.sin(0.05 * t), 28 + 10 * Math.sin(0.07 * t), 520 + 30 * Math.cos(0.05 * t));
  raider.position.copy(raiderPos);
  raider.rotation.set(0.1, 2.3 + 0.2 * Math.sin(0.05 * t), 0.15, "YXZ");
  fighters.forEach((f, i) => {
    const a = 0.35 * t + (i * 2 * Math.PI) / 3, R = 70 + 12 * i;
    f.position.set(raiderPos.x + R * Math.cos(a), raiderPos.y + 12 * Math.sin(a * 1.3 + i), raiderPos.z + R * Math.sin(a));

let lighting = "normal";
const red = new THREE.Color(P.alert), amber = new THREE.Color(P.emergency), warm = new THREE.Color(P.lampWarm), cool = new THREE.Color(P.lampCool);
function applyLighting(t) {
  const s = K.LIGHTING[lighting];
  ambient.color.set(s.ambient); ambient.intensity = s.ambientI * 2.2;
  const lampOn = lighting !== "emergency";
  const lampCol = lighting === "red_alert" ? red : warm;
  for (const l of lampLights) { l.color.copy(lampCol); l.intensity = lampOn ? s.lampI * 14 : 0; }
  for (const l of corridorLights) { l.color.copy(lighting === "red_alert" ? red : cool); l.intensity = lampOn ? s.lampI * 10 : 0; }
  lampMat.color.copy(lampOn ? lampCol : new THREE.Color(0x1a1a1a)).multiplyScalar(lampOn ? 1.0 : 1);
  const emerg = lighting === "emergency";
  for (const l of emergLights) { l.color.copy(amber); l.intensity = emerg ? 9 : 0; }
  emergMat.color.copy(emerg ? amber : new THREE.Color(0x2a2a2a));
  // Floor strips: cool in normal, red pulsing at 0.5 Hz in red alert, amber steady on emergency power.

const R = 0.30; // crew collider radius, crew-on-deck
function walkStep(dt) {
  const k = walk.keys, sp = (k.ShiftLeft || k.ShiftRight ? 4.0 : 1.8) * dt; // crew-on-deck: walk 1.8 m/s, run 4.0 m/s
  const f = new THREE.Vector3(-Math.sin(walk.yaw), 0, -Math.cos(walk.yaw)), r = new THREE.Vector3(-f.z, 0, f.x);
  const d = new THREE.Vector3();
  if (k.KeyW) d.add(f); if (k.KeyS) d.sub(f); if (k.KeyD) d.add(r); if (k.KeyA) d.sub(r);

  const inDoor = (p) => Math.abs(p.x) < dh && p.z > CB.z[1] - R - 0.01 && p.z < BB.z[0] + R + 0.01;
  if (inBridge(n) || inCorr(n) || inDoor(n)) walk.pos.copy(n);

/** Plot offset (px, y down) of a contact on a plot drawn at pxPerKm. */
const contactXY = (c, pxPerKm) => { const a = Number(c.brg) * deg, r = Number(c.r) * pxPerKm; return [r * Math.sin(a), -r * Math.cos(a)]; };

/**

function contactsSvg(cx, cy, pxPerKm, sel, opts) {

    if (off) { dx *= edge / d; dy *= edge / d; }
    const x = cx + dx, y = cy + dy, col = IFFHEX[c.iff];
    if (off) marks += `<path d="M${x} ${y - 5} L${x + 5} ${y} L${x} ${y + 5} L${x - 5} ${y} Z" fill="none" stroke="${col}" stroke-width="1.5"/>`;

    else if (c.iff === "h") marks += `<path d="M${x} ${y - 5} L${x + 5} ${y + 4} L${x - 5} ${y + 4} Z" fill="${col}"/>`;

      panel("F3", "Launch sequence: Swift 1", [4, 2, 4, 2], `${row("1 Bay clear of unsuited crew", "<span class='ok'>done</span>")}${row("2 Pressure door sealed", "<span class='ok'>done</span>")}${row("3 Pump down to 5 kPa, ~29 s", "<span class='warn'>~24 s left</span>")}${row("4 Drop door open", "4 s")}${row("5 Cradle lowered, release", "4 s")}`, btn("LAUNCH", "guard on") + btn("HOLD") + btn("RECOVER")) +
      panel("F4", "Tasking", [8, 0, 4, 4], `${svgPlot(396, 230, `<rect width="396" height="230" fill="#0a0f15"/>${rings(198, 130, [50, 100], ["5 km", "10 km"])}${contactsSvg(198, 130, 10, null, { only: ["T1", "T2", "T3", "T4", "N1"] })}${shipGlyph(198, 130, 0.8)}<path d="M198 130 L${198 + contactXY(CONTACTS[4], 10)[0]} ${130 + contactXY(CONTACTS[4], 10)[1]}" stroke="#26c6da" stroke-dasharray="4 3"/><text x="${198 + contactXY(CONTACTS[4], 10)[0] + 6}" y="${130 + contactXY(CONTACTS[4], 10)[1] - 12}" fill="#26c6da" font-size="10">Swift 1: escort N1</text>`)}${row("Swift 1", "escort N1, weapons free")}${row("Swift 2", "stowed")}${row("Petrel", "stowed")}`, btn("ESCORT", "on") + btn("ATTACK") + btn("PATROL") + btn("RETURN")) +
      statusStrip("Ivy (player)");
  },
};

function buildConsole(id) {
  const s = K.byId(stations, id);
  consoleEl.style.setProperty("--accent", hex(P.role[s.role]));
  // T1 is the raider in the exterior scene: its plot position starts where the live table says.
  const rel = raiderPos.clone().applyMatrix4(ship.matrixWorld.clone().invert());
  CONTACTS[0].r = (rel.length() / 1000).toFixed(2);
  CONTACTS[0].brg = (((Math.atan2(-rel.x, rel.z) / deg) % 360 + 360) % 360).toFixed(0).padStart(3, "0");
  consoleEl.innerHTML = CONSOLES[id]();
}
const sgn = (v) => (v >= 0 ? "+" : "") + v.toFixed(1);
function updateLive() {
  if (mode !== "seat") return;
  const e = new THREE.Euler().setFromQuaternion(ship.quaternion, "YXZ");
  const hdg = ((-e.y / deg) % 360 + 360) % 360;
  const rel = raiderPos.clone().applyMatrix4(ship.matrixWorld.clone().invert());
  const brg = ((Math.atan2(-rel.x, rel.z) / deg) % 360 + 360) % 360;
  const mm = Math.floor(simT / 60), ss = Math.floor(simT % 60);
  const vals = {
    hdg: hdg.toFixed(0).padStart(3, "0"), pitch: sgn(-e.x / deg), roll: sgn(e.z / deg),
    speed: "182", speed2: "182", t1r: (rel.length() / 1000).toFixed(2), t1b: brg.toFixed(0).padStart(3, "0"), t1r2: (rel.length() / 1000).toFixed(2), t1b2: brg.toFixed(0).padStart(3, "0"),
    clock: `${String(14 + mm).padStart(2, "0")}:${String(ss).padStart(2, "0")}`, clock2: `${String(14 + mm).padStart(2, "0")}:${String(ss).padStart(2, "0")}`,
  };
  for (const el of consoleEl.querySelectorAll("[data-live]")) { const v = vals[el.dataset.live]; if (v !== undefined && el.textContent !== v) el.textContent = v; }
  const tg = consoleEl.querySelector("[data-tapeg]");
  if (tg && tg.dataset.hdg !== hdg.toFixed(1)) { tg.dataset.hdg = hdg.toFixed(1); tg.innerHTML = tapeMarks(hdg); }
}

// The Science console's viewscreen thumbnail: the render target drawn into a viewport, no extra pass.
const thumbScene = new THREE.Scene();
thumbScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.MeshBasicMaterial({ map: rtt.texture, toneMapped: false })));
const thumbCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

// ------------------------------------------------------------ window scissor
const _v = new THREE.Vector3();
/** The screen rectangle (CSS px, top-left origin) of both windows through camera c drawn into viewport vp; null when neither is in view. */
function windowRect(c, vp) {
  if (mode === "overview") return vp;
  c.updateMatrixWorld(true);
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity, any = false;
  for (const w of windows) {
    const [cx, cy, cz] = w.center_m, hw = w.size_m[0] / 2, hh = w.size_m[1] / 2;
    for (const [dx, dy] of [[-hw, -hh], [hw, -hh], [hw, hh], [-hw, hh]]) {
      _v.set(cx + dx, cy + dy, cz).applyMatrix4(c.matrixWorldInverse);
      if (_v.z > -c.near) return vp; // a corner behind the camera: draw the whole view (conservative)
      _v.set(cx + dx, cy + dy, cz).project(c);
      const sx = vp.x + (_v.x * 0.5 + 0.5) * vp.w, sy = vp.y + (0.5 - _v.y * 0.5) * vp.h;
      x0 = Math.min(x0, sx); x1 = Math.max(x1, sx); y0 = Math.min(y0, sy); y1 = Math.max(y1, sy); any = true;
    }
  }
  if (!any) return null;
  x0 = Math.max(vp.x, Math.floor(x0) - 2); y0 = Math.max(vp.y, Math.floor(y0) - 2);
  x1 = Math.min(vp.x + vp.w, Math.ceil(x1) + 2); y1 = Math.min(vp.y + vp.h, Math.ceil(y1) + 2);
  if (x1 <= x0 || y1 <= y0) return null;
  return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
}

// ------------------------------------------------------------ frame
const consoleBg = new THREE.Color(0x070a10), space = new THREE.Color(P.space);
let first = true, lastT = performance.now(), liveTick = 0;
function frame() {
  const now = performance.now(), dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  if (!paused) simT += 1 / 30;
  stepExterior(simT);
  applyLighting(simT);
  if (mode === "walk") { walkStep(dt); placeWalkCamera(); }
  if (mode === "overview") controls.update();
  const W = innerWidth, H = innerHeight;
  const seatedNow = mode === "seat";
  if (seatedNow) placeSeatCamera();
  const ic = seatedNow ? lookCam : cam;
  if (!seatedNow) { cam.aspect = W / H; cam.updateProjectionMatrix(); }

  hud.beginFrame(renderer);
  // 1. The viewscreen's feed into its render target (30 Hz in the design; every frame here).
  placeFeed();
  renderer.setRenderTarget(rtt);
  renderer.setClearColor(space, 1); renderer.clear();
  renderer.render(exterior, feedCam);
  renderer.setRenderTarget(null);
  // 2. The main view: clear, exterior through the windows (scissored), then the interior.
  renderer.setScissorTest(true);
  renderer.setViewport(0, 0, W, H); renderer.setScissor(0, 0, W, H);
  renderer.setClearColor(seatedNow ? consoleBg : space, 1); renderer.clear();
  const vp = seatedNow ? lookBandRect() : { x: 0, y: 0, w: W, h: H };
  const glY = (r) => H - r.y - r.h;
  renderer.setViewport(vp.x, glY(vp), vp.w, vp.h);
  renderer.setScissor(vp.x, glY(vp), vp.w, vp.h);
  renderer.setClearColor(space, 1); renderer.clear();
  const wr = windowRect(ic, vp);
  if (wr) {
    placeWindowCam(ic);
    winCam.layers.set(0);
    renderer.setScissor(wr.x, glY(wr), wr.w, wr.h);
    renderer.render(exterior, winCam);
  }
  renderer.setScissor(vp.x, glY(vp), vp.w, vp.h);
  renderer.clearDepth();
  renderer.render(interior, ic);
  // 3. Science's thumbnail of the viewscreen texture (one draw call, no extra pass).
  if (seatedNow && seated === "science") {
    const r = { x: cX + (852 + 408 - 1 - 6 - 256) * cScale, y: cY + (484 + 1 + 26 + 4) * cScale, w: 256 * cScale, h: 128 * cScale };
    renderer.setViewport(r.x, glY(r), r.w, r.h); renderer.setScissor(r.x, glY(r), r.w, r.h);
    renderer.render(thumbScene, thumbCam);
  }
  renderer.setScissorTest(false);
  hud.endFrame(renderer);
  if (++liveTick % 8 === 0) updateLive();
  if (first) { first = false; updateLive(); K.markReady(); }
}

// ------------------------------------------------------------ controls and input
const ctl = document.getElementById("controls");
const buttons = {};
function group(label) { const s = document.createElement("span"); s.className = "grp"; s.textContent = label; ctl.appendChild(s); }
function button(key, text, fn) { const b = document.createElement("button"); b.textContent = text; b.onclick = () => { fn(); syncButtons(); }; ctl.appendChild(b); buttons[key] = b; return b; }
group("View");
button("overview", "Overview", () => setMode("overview"));
button("captain", "Captain's chair", () => setMode("captain"));
button("interior", "Room", () => setMode("interior"));
button("walk", "Walk", () => { walk.pos.set(0, FLOOR, 21.2); walk.yaw = Math.PI; walk.pitch = 0; setMode("walk"); }); // yaw 0 looks aft (-Z)
group("Sit");
KEYS.forEach((id, i) => button("seat:" + id, `${i + 1} ${SHORT[id]}`, () => setMode("seat", { station: id })));
group("Lighting");
for (const key of Object.keys(K.LIGHTING)) button("light:" + key, K.LIGHTING[key].label, () => { lighting = key; refreshMode(); });
group("Viewscreen");
for (const f of ["forward", "target", "chase"]) button("feed:" + f, f[0].toUpperCase() + f.slice(1), () => { feed = f; refreshMode(); });
group("B1");
button("wings", "Side stations face bow", () => { const on = yawOverride.engineering === undefined; setWings(on); refreshMode(); });
function setWings(on) {
  if (on) { yawOverride.engineering = 0; yawOverride.science = 0; } else { delete yawOverride.engineering; delete yawOverride.science; }
  buildStations(); snapshotScreenColors(); setMode(mode, { station: seated });
}
function refreshMode() { setMode(mode, { station: seated }); }
function syncButtons() {
  for (const [k, b] of Object.entries(buttons)) {
    let on = false;
    if (k === mode) on = true;
    if (k === "seat:" + seated && mode === "seat") on = true;
    if (k === "light:" + lighting) on = true;
    if (k === "feed:" + feed) on = true;
    if (k === "wings") on = yawOverride.engineering !== undefined;
    b.classList.toggle("on", on);
  }
}
addEventListener("keydown", (e) => {
  walk.keys[e.code] = true;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 7 && mode !== "walk") setMode("seat", { station: KEYS[n - 1] });
  if (e.key === "Escape" && mode === "seat") setMode("overview");
});
addEventListener("keyup", (e) => { walk.keys[e.code] = false; });
renderer.domElement.addEventListener("click", () => { if (mode === "walk" && renderer.domElement.requestPointerLock) renderer.domElement.requestPointerLock(); });
addEventListener("mousemove", (e) => {
  if (mode !== "walk" || document.pointerLockElement !== renderer.domElement) return;
  walk.yaw -= e.movementX * 0.0022; walk.pitch = Math.max(-1.4, Math.min(1.4, walk.pitch - e.movementY * 0.0022));
});
// Click a station to sit (overview, room and walk views).
const ray = new THREE.Raycaster();
let downAt = null;
renderer.domElement.addEventListener("pointerdown", (e) => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener("pointerup", (e) => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 4 || mode === "seat" || mode === "walk") return;
  ray.setFromCamera(new THREE.Vector2((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1), cam);
  const hit = ray.intersectObjects(stationHits, false)[0];
  if (hit) setMode("seat", { station: hit.object.userData.station });
});
addEventListener("resize", () => { renderer.setSize(innerWidth, innerHeight); layoutConsole(); });

// ------------------------------------------------------------ start and shots
buildStations();
snapshotScreenColors();
setMode("overview");
const shot = (fn) => () => { paused = true; simT = 24.0; fn(); syncButtons(); };
const seatShot = (id) => shot(() => { lighting = "normal"; feed = "forward"; setWings(false); setMode("seat", { station: id }); });
K.registerShots([
  { name: "overview", setup: shot(() => { lighting = "normal"; feed = "forward"; setWings(false); setMode("overview"); }) },
  { name: "interior", setup: shot(() => { lighting = "normal"; setWings(false); setMode("interior"); }) },
  { name: "captain-view", setup: shot(() => { lighting = "normal"; feed = "forward"; setWings(false); setMode("captain"); }) },
  { name: "red-alert", setup: shot(() => { lighting = "red_alert"; setWings(false); setMode("interior"); }) },
  { name: "emergency", setup: shot(() => { lighting = "emergency"; setWings(false); setMode("interior"); }) },
  { name: "helm-console", setup: seatShot("helm") },
  { name: "tactical-console", setup: seatShot("tactical") },
  { name: "engineering-console", setup: seatShot("engineering") },
  { name: "science-console", setup: seatShot("science") },
  { name: "captain-console", setup: shot(() => { lighting = "red_alert"; feed = "target"; setWings(false); setMode("seat", { station: "captain" }); }) },
  { name: "comms-console", setup: seatShot("comms") },
  { name: "flight-ops-console", setup: seatShot("flight_ops") },
  { name: "chase-feed", setup: shot(() => { lighting = "normal"; feed = "chase"; setWings(false); setMode("captain"); }) },
  { name: "alt-forward-wings", setup: shot(() => { lighting = "normal"; feed = "forward"; setWings(true); setMode("interior"); }) },
  { name: "walk-aft", setup: shot(() => { lighting = "normal"; setWings(false); walk.pos.set(0.0, FLOOR, 30.2); walk.yaw = 0.0; walk.pitch = 0.0; walk.keys = {}; setMode("walk"); placeWalkCamera(); }) },
]);
renderer.setAnimationLoop(frame);
</script>
