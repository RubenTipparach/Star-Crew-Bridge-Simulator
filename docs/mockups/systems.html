<!doctype html>
<!--
  systems.html: a live simulation of the Tern's ship systems on exploded deck plans,
  presenting openspec/changes/power-grid, life-support and damage-control.

  Built from data/ships/tern/layout.json through shipkit.js, and driven by
  docs/mockups/lib/shipsystems.js with the proposed data files power.json,
  atmosphere.json and damage.json (all inlined below by tools/mockups/inline.py;
  never hand-edit between the INLINE markers). The page holds no tuning number of
  its own: every MW, kPa and K on screen is computed by the library's one solve,
  and every console preview here (the allocation ghost bars) calls the same solve
  that steps the ship (CLAUDE.md 6.1).

  The three decks are drawn side by side as cutaway plans, bow to the right, port up.
  Every compartment is the kit's textured room (its brushes, the generated detail and the
  Material Maker layers), one mesh each, cut below the door heads (CUT in the script) and lit by the bake of
  its own lamps in the lighting state the simulation gives it (normal, red alert,
  emergency, dark). The cut walls are capped with a band in the colour of the room's
  lights, so an unpowered room shows its emergency lighting; the overlays tint the floors.
-->

<style>

  canvas { display: block; }
  .controls { position: fixed; left: 12px; bottom: 12px; z-index: 20; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; display: flex; gap: 4px 5px; flex-wrap: wrap; align-items: center; width: calc(100vw - 470px); box-sizing: border-box; }

  #side h3 { margin: 6px 0 3px; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--dim); border-bottom: 1px solid var(--line); padding-bottom: 2px; }

  #side .chip.red { background: var(--alert); border-color: var(--alert); color: #fff; }
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
  .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; }
  .kv div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; height: 16px; }
  .kv .k { color: var(--dim); }
  .row { display: grid; grid-template-columns: 112px 26px 92px 1fr 70px; gap: 4px; align-items: center; height: 22px; font-size: 11.5px; }
  .row .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row button, #side .btns button { background: #18202a; color: var(--fg); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; font: 11px system-ui, sans-serif; cursor: pointer; height: 18px; }
  .row input[type=range] { width: 92px; height: 14px; margin: 0; }
  .bar { position: relative; height: 10px; background: #1a222c; border-radius: 2px; overflow: hidden; }
  .bar .fill { position: absolute; left: 0; top: 0; bottom: 0; background: #48d6ff; }
  .bar .ghost { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(255,255,255,0.28); }
  .bar .tick { position: absolute; top: 0; bottom: 0; width: 2px; background: #ffb300; }
  .row .mw { font-family: ui-monospace, Menlo, Consolas, monospace; text-align: right; white-space: nowrap; overflow: hidden; }
  #side .btns { display: flex; gap: 4px; flex-wrap: wrap; margin: 3px 0; align-items: center; }
  #side .btns input[type=range] { width: 96px; }
  table.t { border-collapse: collapse; width: 100%; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; table-layout: fixed; }
  table.t th { color: var(--dim); font-weight: 600; text-align: right; padding: 0 3px; height: 15px; }
  table.t td { text-align: right; padding: 0 3px; height: 13px; line-height: 13px; font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  table.t td.l, table.t th.l { text-align: left; }
  table.t tr.sel td { background: #12303a; }
  .log { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; color: #c9d4de; height: 82px; overflow: hidden; }
  .log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; height: 16px; }
  .legend { position: fixed; left: 12px; top: 112px; z-index: 19; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font-size: 11px; width: 190px; box-sizing: border-box; }
  .legend .sw { display: inline-block; width: 12px; height: 10px; vertical-align: middle; margin-right: 4px; border-radius: 2px; }
  .legend div { height: 15px; white-space: nowrap; overflow: hidden; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--danger); } .dim { color: var(--dim); }
  @media (max-width: 900px) { #side { display: none; } .controls { width: calc(100vw - 24px); bottom: 120px; } .legend { display: none; } }
</style>

{"schema":"starcrew.detailing/1","status":"Proposed (2026-10-05) by openspec/changes/deck-pipeline, section 5a. Read by docs/mockups/lib/shipkit.js today and by deckc once it is built; the sizes are first choices judged on mockup screenshots, not measurements.","_rules":["The detail a ship's decks are dressed with is generated from its layout by one rule set, so every room of a class reads alike and no room is decorated by hand (deck-pipeline section 5a; adapted from Undercity's tools/godot/detailing.py and its UT99 checklist, fps-game-demo f6cd25c).","Detail is not air: coves, ribs, beams and trims stand inside a compartment's brushes and the air model ignores them (life-support quotes brush volumes).","No z-fighting: every detail face is either pressed back to back against a wall, floor or ceiling (and not drawn), or stands at least 1 cm clear of any parallel face (CLAUDE.md section 8). Raised floor plates are raise_m above the floor for that reason.","Lengths in metres. A detail that would cross a portal opening is cut back to clear it; one that would be shorter than min_piece_m is dropped."],"frames":{"_doc":"Ship frames: ribs on the walls and beams under the ceiling at fixed stations along the keel, frame k at z = origin_z_m + k * spacing_m. Walls that run fore and aft carry ribs at the frames; walls that run athwartships carry stiffeners at x = (k + 1/2) * spacing_m. A room taller than the cove's tall_room_m gets the deep beams and ribs.","spacing_m":2.0,"origin_z_m":0.0,"end_clear_m":0.35,"rib_width_m":0.24,"rib_depth_m":0.12,"tall_rib_depth_m":0.22,"beam_width_m":0.24,"beam_depth_m":0.18,"deep_beam_depth_m":0.38,"portal_clear_m":0.1},"cove":{"_doc":"A 45 degree panel between every solid wall and the ceiling: the hull's octagonal section, echoed inside. Not drawn along an edge open to another brush of the same compartment.","size_m":0.35,"tall_size_m":0.6,"tall_room_m":3.6},"baseboard":{"height_m":0.14,"depth_m":0.03},"door_frame":{"_doc":"Every door, wall hatch and pressure door is framed: jambs and a lintel fill a ring cut around the clear opening (size_m stays the clear opening crew pass through), proud of the wall on each side. Pressure doors are heavier and hazard-striped. A status strip glows on the lintel.","jamb_m":0.16,"lintel_m":0.22,"proud_m":0.06,"pressure_jamb_m":0.26,"pressure_proud_m":0.12,"status_strip_m":[0.5,0.05]},"window_frame":{"frame_m":0.14,"proud_m":0.08,"sill_depth_m":0.16},"floor_portal":{"_doc":"A hazard rim on the floor around every hatch, ladder well, hoist and bay door, and a trim collar under the ceiling around it. Ladders get rails and rungs from the lower floor to ladder_above_m over the upper one.","rim_width_m":0.15,"raise_m":0.012,"collar_width_m":0.1,"collar_depth_m":0.1,"ladder_rail_m":0.05,"ladder_width_m":0.5,"rung_spacing_m":0.3,"ladder_above_m":1.0},"railing":{"_doc":"Along an edge where a brush opens onto a lower floor of the same compartment (a hangar gallery over the hangar floor): two rails, posts and a kick plate.","min_drop_m":0.5,"height_m":1.05,"post_m":0.06,"post_spacing_m":1.5,"inset_m":0.05,"kick_m":0.12},"platforms":{"_doc":"Raised floors that are solid, not air (a dais, a work ring, a sub-platform; bridge-stations section 11a): a riser and a hazard nosing on every edge that is not against a wall, a railing on rail edges with gaps at stairs, treads of tread_rise_m.","tread_rise_m":0.225,"nosing_m":0.05,"nosing_raise_m":0.012,"rail_height_m":0.75,"rail_mid_m":0.375,"rail_m":0.05,"rail_inset_m":0.08,"rail_end_m":0.1,"rail_post_spacing_m":1.2},"kicks":{"_doc":"Kick lights (openspec/changes/kick-lights): indirect light at the foot of platform edges and consoles. platform: every edge of a kind in on is undercut at its foot by a recess height_m high and depth_m deep (the wall banks' own toe kick), a strip on a chamfer chamfer_m square at the back of the recess's ceiling, facing out and down. props: each console family's strips in prop space (props.json's frame: +Y up, +Z towards the operator, the origin on the floor at the centre of the back): y_m and z_m the strip's bottom and top edges (z at each), x_m its half width, x_inset_m in from the prop's bounds, or beside_m out from the bounds (a strip each side), normal the way it faces, type its fixture type (kick_strip unless named: column_strip for the light columns behind the terminals).","platform":{"height_m":0.1,"depth_m":0.08,"chamfer_m":0.03,"on":["riser","rail"]},"props":{"wall_bank":[{"name":"front","y_m":[0.005,0.095],"z_m":[0.532,0.532],"x_inset_m":0.03,"normal":[0,0,1]},{"name":"columns","type":"column_strip","y_m":[0.15,2.05],"z_m":[0.012,0.012],"beside_m":[0.03,0.08],"normal":[0,0,1]}],"free_console":[{"name":"front","y_m":[0.06,0.1],"z_m":[0.286,0.295],"x_m":0.34,"normal":[0,-0.227,0.974]},{"name":"back","y_m":[0.06,0.1],"z_m":[-0.012,-0.012],"x_m":0.34,"normal":[0,0,-1]}]}},"runner":{"_doc":"A deck plate strip down the middle of every corridor.","width_m":0.9,"raise_m":0.012,"end_clear_m":0.05},"conduits":{"_doc":"Two pipes along the top of every fore-and-aft corridor wall, below the cove and clear of the ribs.","radii_m":[0.06,0.04],"gap_m":0.06,"drop_m":0.1,"sides":8},"lamps":{"_doc":"The lamp rule (deck-pipeline section 5): lamps sit in the bays between frames, never on a beam. A bay gets round(area / area_per_lamp_m2) lamps across its width, a corridor bay at least one, a pod one. Every emergency_every-th lamp of a compartment is on the emergency bus. A room taller than tall_room_m gets high-bay lamps: radius and size scale with its height over 3 m, and they hang hang_m below the ceiling.","area_per_lamp_m2":8.0,"min_bay_m":1.0,"wall_clear_m":0.6,"emergency_every":3,"panel_m":[0.9,0.45],"corridor_panel_m":[0.7,0.35],"housing_m":0.06,"radius_m":3.0,"tall_room_m":3.6,"hang_m":0.4,"keep_out_m":0.5},"finishes":{"_doc":"Which material (data/materials/materials.json) each generated surface takes, by the compartment's finish in the layout.","crew":{"floor":"deck_tiles","wall":"bulkhead","ceiling":"ceiling","cove":"trim","rib":"trim","beam":"trim","baseboard":"trim","frame":"trim","frame_hazard":"hazard","status":"light_panel","kick_strip":"light_panel","window_frame":"trim","rim":"hazard","collar":"trim","ladder":"trim","runner":"deck_plate","pipe":"machinery","railing":"trim","kickplate":"hazard","lamp_housing":"trim","lamp":"light_panel","platform":"deck_tiles","riser":"trim","nosing":"hazard","stair":"deck_plate"},"working":{"floor":"deck_plate","wall":"bulkhead","ceiling":"machinery","cove":"trim","rib":"machinery","beam":"machinery","baseboard":"hazard","frame":"trim","frame_hazard":"hazard","status":"light_panel","kick_strip":"light_panel","window_frame":"trim","rim":"hazard","collar":"machinery","ladder":"trim","runner":"deck_tiles","pipe":"machinery","railing":"trim","kickplate":"hazard","lamp_housing":"machinery","lamp":"light_panel","platform":"deck_plate","riser":"machinery","nosing":"hazard","stair":"deck_plate"}}}
</script>

<script id="ship-materials" type="application/json">
{"manifest":{"schema":"starcrew.materials/1","status":"Built (2026-10-05) by tools/materials/postprocess.py into assets/textures/<name>.png; see the material-maker skill. No engine code reads these layers yet. The ramps are first choices made by eye on the contact sheet (docs/screenshots/materials/contact-sheet.png), not decisions.","_rules":["This file is the one source for Star Crew's surface materials: which Material Maker graph each comes from, its size in the world, and how its render is post-processed. The deck build, the mockups and the engine read it; nothing keeps a second list.","Every material is one layer of one texture array. Every layer is 128 x 128 px (layers.px), RGBA8, whatever the material.","Interior layers span 2.0 m, so 64 px per metre; exterior layers span 4.0 m, so 32 px per metre (layers.*_span_m). A surface's UVs are its world position divided by its material's span_m, so texel density never changes between materials of the same space.","tile_m is the world size of one repeat of the graph. A graph smaller than the span is tiled k x k inside the layer; a graph larger than the span gives the layer its top-left 1/k. Either way span_m / tile_m (or its inverse) is whole, so the layer tiles seamlessly.","Sampling: nearest on magnification, mipmapped on minification (layers.mag_filter, layers.min_filter), so a wall up close shows crisp texels and a far one does not shimmer.","The baked vertex light multiplies the texel. There is no per-pixel lighting on the Pi 5, so a graph's normal map and occlusion are baked into the albedo under one fixed key light from the top of the layer (bake.key_light_tangent), by relief.","Alpha is the emission mask: 255 shows the texel at full brightness whatever the light, 0 lights it only by the baked vertex light; in between blends the two. Non-emissive layers have alpha 0 everywhere, so an image viewer shows them as transparent; their colour is intact. Never premultiply alpha or let a tool strip colour under zero alph <script>
/*
 * shipkit.js: the one place a mockup turns a ship layout into three.js objects.
 *
 * Every Star Crew mockup reads the same layout (data/ships/<id>/layout.json), so
 * the bridge, the deck plan, the systems view and the exterior cannot disagree
 * about where a room or a door is (CLAUDE.md sections 8 and 11). This file is
 * the shared interpretation of that layout: palette, lighting states, the Pi 5
 * budget meter, room shells with door openings cut, the generated detail (frames,
 * coves, trims, door frames, conduits, lamps), the Material Maker texture array,
 * the hull loft and labels.
 *
 * Layout schema starcrew.ship-layout/2: a compartment's air is the union of
 * convex prisms ("brushes"), a footprint polygon in plan and a floor and ceiling
 * height, so rooms follow the hull (openspec/changes/reference-ship-tern). The
 * detail rules and their sizes are data/ships/<id>/detailing.json
 * (openspec/changes/deck-pipeline, section 5a); the materials are
 * data/materials/materials.json (openspec/changes/surface-materials). This kit is
 * the mockups' implementation of those rules; deckc will be the engine's.
 *
 * It is a classic script, not a module, so a mockup still works when opened
 * straight from disk. tools/mockups/inline.py copies it into each page between
 * the "INLINE shipkit" markers; edit it here, never in a page. Functions that
 * build geometry take THREE as their first argument because the page owns the
 * three.js import.
 *
 * Axes (from the layout): +X port, +Y up, +Z bow, metres. Plan points are [x, z].
 */
(function () {
  "use strict";

  /** The layout inlined into the page as <script id="ship-layout" type="application/json">. */
  function layout() {
    const el = document.getElementById("ship-layout");
    if (!el) throw new Error("shipkit: no #ship-layout script in the page (run tools/mockups/inline.py)");
    const L = JSON.parse(el.textContent);

  function byId(list, id) {

  function compartment(L, id) { return byId(L.compartments, id); }
  /**
   * A copy of layout L with a layout patch applied (schema starcrew.layout-patch/1, e.g.
   * data/ships/tern/command_suite.json): compartments and portals replace the record of the same id
   * or are added; stations move the named station's seat; fixtures update field by field or are
   * added; fixtures_removed are dropped; systems update field by field. The same rule as
   * tools/command_suite.py patch_layout, which writes and checks the patch; L itself is never changed.
   */

    const put = (list, rec) => { const i = list.findIndex((x) => x.id === rec.id); if (i >= 0) list[i] = copy(rec); else list.push(copy(rec)); };
    for (const c of patch.compartments || []) put(out.compartments, c);
    for (const p of patch.portals || []) put(out.portals, p);

    out.fixtures = out.fixtures.filter((f) => (patch.fixtures_removed || []).indexOf(f.id) < 0);
    for (const f of patch.fixtures || []) { const o = byId(out.fixtures, f.id); if (o) Object.assign(o, copy(f)); else out.fixtures.push(copy(f)); }

  function systemsIn(L, compId) { return (L.systems || []).filter((s) => s.compartment === compId); }

  // ------------------------------------------------------- plan geometry [x, z]

  const EPS = 1e-4;

  /** Signed area in square metres; the layout winds every brush positive. */
  function signedArea(poly) {
    let s = 0;
    for (let i = 0; i < poly.length; i++) {
      const a = poly[i], b = poly[(i + 1) % poly.length];

  /** Unit outward normal [x, z] of edge a->b of a positively wound polygon. */
  function outwardNormal(a, b) {
    const dx = b[0] - a[0], dz = b[1] - a[1], l = Math.hypot(dx, dz);
    return [dz / l, -dx / l];

  function insidePoly(poly, x, z, tol) {

  function chord(poly, axis, v) {

    for (let i = 0; i < poly.length; i++) {

      if (Math.abs(da) < EPS) hits.push(a[o]);

  /** A convex polygon with edge i moved inward by d[i] metres (d may be one number for every edge). */

    for (let i = 0; i < n; i++) {
      const l1 = lines[(i + n - 1) % n], l2 = lines[i];

      if (Math.abs(den) < 1e-9) { out.push(l2.p.slice()); continue; }
      const s = ((l2.p[0] - l1.p[0]) * l2.t[1] - (l2.p[1] - l1.p[1]) * l2.t[0]) / den;

  // ---------------------------------------------------- compartment geometry

  /** Volume in cubic metres and floor area in square metres of a compartment (brush air; detail is not air). */
  function measure(comp) {

  /**

   * { brush, bi, i, a, b (plan ends), t, n (outward, plan), len, y0, y1, holes } where a hole

  /**

   * exact and has no slivers, at the price of a few extra triangles.
   */
  function rectMinusHoles(r, holes) {
    const hs = holes
      .map((h) => ({ u0: Math.max(h.u0, r.u0), u1: Math.min(h.u1, r.u1), v0: Math.max(h.v0, r.v0), v1: Math.min(h.v1, r.v1) }))
      .filter((h) => h.u1 - h.u0 > EPS && h.v1 - h.v0 > EPS);
    if (!hs.length) return [r];
    const us = [r.u0, r.u1], vs = [r.v0, r.v1];
    for (const h of hs) { us.push(h.u0, h.u1); vs.push(h.v0, h.v1); }
    const su = [...new Set(us.map((x) => +x.toFixed(4)))].sort((a, b) => a - b);
    const sv = [...new Set(vs.map((x) => +x.toFixed(4)))].sort((a, b) => a - b);
    const cells = [];
    for (let i = 0; i + 1 < su.length; i++) {

        const cu = (su[i] + su[i + 1]) / 2, cv = (sv[j] + sv[j + 1]) / 2;

    for (const c of cells) {
      const last = merged[merged.length - 1];
      if (last && Math.abs(last.v0 - c.v0) < EPS && Math.abs(last.v1 - c.v1) < EPS && Math.abs(last.u1 - c.u0) < EPS) last.u1 = c.u1;

        if (c[1] <= a || c[0] >= b) { next.push([a, b]); continue; }
        if (c[0] > a) next.push([a, c[0]]);
        if (c[1] < b) next.push([c[1], b]);

    }
    return pieces;
  }

  // -------------------------------------------------------- surface builder

  /** World-anchored planar UV in metres: x, z on floors and ceilings; along the face's horizontal tangent and y otherwise. */
  function worldUv(p, n) {

    const l = Math.hypot(n[0], n[2]) || 1, tx = -n[2] / l, tz = n[0] / l;
    return [p[0] * tx + p[2] * tz, p[1]];
  }

  /**
