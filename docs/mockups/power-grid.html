<!--
  power-grid.html: Engineering's expanded schematic, the Tern's power grid in 3D and as a simplified 2D graph
  (openspec/changes/power-grid and power-routing; the owner, 2026-10-11: "I would like to see the power grid in the
  ship floor plan and as a electric diagram", "Conduits are placed in breaker boxes throughout the ship", "Conduit
  boxes can be turned on or off to route power through the ship", "Engineer will have a view of the schematics on the
  side. But can click on an expand button to see the 3d schematic in full screen. They can toggle between 2d and 3d
  view. 2d is a simplified graph view").

  3D: the decks in perspective at their heights (pulled apart by default), an orbit camera, rooms as translucent
  floors tinted by their light, a conduit box in every room, every run (spares dashed until closed) and every load's
  feeder where it is. 2D: the same grid as a graph: switchboards and panels as cards, room boxes as chips, runs as
  edges, each box's loads as bars. In both a tap switches a box or a run; the live runs show against the protection's
  limit, and one too many trips the grid dark until it resets to its factory settings. COLLAPSE returns to the
  console's side panel (consoles.html, Engineering's SCHEMATIC).

  Every number comes from docs/mockups/lib/shipsystems.js (the mockups' one simulation: the solve, the flows, the
  breakers, nodeView and conduitView); this page computes nothing of its own. Nothing in it is engine code. Never
  hand-edit between the INLINE markers: tools/mockups/inline.py writes them.
-->

<style>
  :root {
    --bg: #04060a; --chrome: #0b1017; --fg: #e8eef6; --dim: #6f7f94; --line: #1f2a37; --panel: rgba(8, 12, 18, 0.88);
    --ok: #3ddc84; --warn: #ffc542; --danger: #ff4757; --accent: #4fc3f7; --power: #ffd36b;
    --font: "Barlow Semi Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg: #04060a; } }
  :root[data-theme="dark"] { --bg: #04060a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.3 var(--font); overflow: hidden; }
  /* One row that scrolls sideways on a narrow screen (a phone), so it never grows over the view. */
  #bar { position: fixed; left: 0; right: 0; top: 0; height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 12px;
    background: var(--chrome); border-bottom: 1px solid var(--line); z-index: 25; overflow-x: auto; overflow-y: hidden; white-space: nowrap;
    box-sizing: border-box; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  #bar::-webkit-scrollbar { display: none; }
  #bar button { flex: none; }
  #bar b { font-weight: 700; letter-spacing: .06em; margin-right: 6px; color: var(--power); }
  #bar button { background: #151d28; color: var(--fg); border: 1px solid var(--line); border-radius: 5px; padding: 6px 10px;
    font: 600 13px var(--font); letter-spacing: .04em; cursor: pointer; }
  #bar button.on { border-color: var(--accent); color: var(--accent); }
  #bar .sep { width: 1px; height: 24px; background: var(--line); margin: 0 4px; flex: none; }
  #bar .lab { color: var(--dim); font-size: 12px; margin-left: 2px; }
  #plan { position: fixed; left: 0; top: 44px; touch-action: none; }
  #stage { position: fixed; left: 0; right: 0; top: 44px; bottom: 0; display: none; overflow: hidden; touch-action: none; cursor: grab; }
  #diagram .tap { cursor: pointer; }
  #diagram { position: absolute; width: 1280px; height: 720px; transform-origin: 0 0; user-select: none; -webkit-user-select: none; }
  #diagram svg { display: block; }
  #labels { position: fixed; left: 0; top: 44px; right: 0; bottom: 0; pointer-events: none; z-index: 5; overflow: hidden; }
  #labels div { position: absolute; white-space: nowrap; text-shadow: 0 0 3px #000, 0 0 6px #000; }
  #labels .deck { font: 700 26px/1 var(--font); color: #ffb84d; transform: translate(-50%, -50%); pointer-events: auto; cursor: pointer;
    background: rgba(8, 12, 18, 0.7); border: 1px solid #3a2f1c; border-radius: 6px; padding: 4px 8px; text-align: center; }
  #labels .deck.on { color: var(--accent); border-color: var(--accent); }
  body.portrait #labels .deck { font-size: 19px; padding: 3px 6px; }
  body.portrait #labels .deck small { font-size: 10px; }
  #collapse { position: fixed; right: 12px; top: 54px; z-index: 30; display: flex; align-items: center; gap: 6px; padding: 7px 12px;
    background: #151d28; color: var(--fg); border: 1px solid var(--line); border-radius: 6px; font: 700 13px var(--font);
    letter-spacing: .08em; cursor: pointer; }
  #collapse:hover, #collapse:focus-visible { border-color: var(--accent); color: var(--accent); outline: none; }
  /* The view switch (power-routing 3a: "they can toggle between 2d and 3d view"): big, beside CONSOLE. */
  #viewsw { position: fixed; top: 54px; z-index: 30; display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  #viewsw button { background: #151d28; color: var(--dim); border: 0; padding: 7px 16px; font: 700 15px var(--font); letter-spacing: .1em; cursor: pointer; }
  #viewsw button + button { border-left: 1px solid var(--line); }
  #viewsw button.on { background: #12324a; color: var(--accent); }
  #labels .deck small { display: block; font: 600 12px/1.2 var(--font); color: #a8946e; letter-spacing: .06em; }
  #labels .node { font: 700 11px/1 var(--font); color: #ffe7a8; letter-spacing: .05em; transform: translate(-50%, 6px); }
  #labels .node.tl { transform: translate(-100%, -50%); }
  #labels .node.box { font-size: 10px; color: #c9b98a; }
  #labels .deck.v { transform: translate(-50%, -100%); text-align: center; }
  #labels .node.tr { transform: translate(0, -50%); }
  #labels .room { font: 600 11px/1 var(--font); color: #6f7f94; transform: translate(-50%, -50%); }
  #status { position: fixed; left: 12px; top: 54px; width: 316px; box-sizing: border-box; justify-content: space-between; z-index: 20; display: flex; flex-wrap: wrap; row-gap: 6px; gap: 10px; align-items: center; background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font: 700 15px/1 var(--font); letter-spacing: .03em; }
  #status .k { display: flex; align-items: center; gap: 6px; }
  #status svg { display: block; }
  #status .alert { color: #fff; background: #7a1218; border-radius: 4px; padding: 3px 7px; font-size: 13px; }
  .legend { position: fixed; left: 12px; z-index: 20; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
    width: 316px; box-sizing: border-box; font: 600 13px/1.25 var(--font); overflow-y: auto; }
  .legend .row { display: flex; align-items: center; gap: 8px; height: 22px; }
  .legend svg { flex: none; display: block; }
  .legend .h { color: var(--dim); font-size: 12px; letter-spacing: .06em; margin: 4px 0 2px; }
  #tip { position: fixed; z-index: 40; display: none; pointer-events: none; max-width: 300px; box-sizing: border-box; background: #121a25;
    border: 1px solid #2c3a4d; border-radius: 6px; padding: 6px 9px; font: 600 13px/1.35 var(--font); letter-spacing: .02em; }
  #tip .n { font-weight: 700; font-size: 14px; color: #fff; }
  #tip .d { color: #9fb0c0; }
  .mockup-title { max-width: 316px !important; top: 54px !important; }
  #status .alert { position: absolute; left: 0; right: 0; top: -1px; height: 4px; padding: 0; border-radius: 8px 8px 0 0; background: var(--danger); }
  #tripb { position: fixed; left: 50%; transform: translateX(-50%); z-index: 30; display: none; pointer-events: none; text-align: center;
    background: rgba(40, 6, 10, 0.92); border: 2px solid var(--danger); border-radius: 8px; padding: 6px 18px; color: #fff;
    font: 700 22px/1.1 var(--font); letter-spacing: .12em; }
  #tripb small { display: block; font: 600 13px/1.3 var(--font); letter-spacing: .04em; color: #ffb3ba; }
  #hitb { position: fixed; left: 50%; transform: translateX(-50%); z-index: 30; display: none; pointer-events: none; text-align: center;
    background: rgba(40, 6, 10, 0.92); border: 2px dashed var(--danger); border-radius: 8px; padding: 6px 18px; color: #fff;
    font: 700 18px/1.1 var(--font); letter-spacing: .1em; }
  #hitb small { display: block; font: 600 13px/1.3 var(--font); letter-spacing: .04em; color: #ffb3ba; }
  body.arming #plan, body.arming #stage { cursor: crosshair; }
  /* The shared "show closed panels" pill sits over the bar's first row by default: here it waits above the status strip. */
  .mk-show { top: auto !important; bottom: 92px !important; }
  @media (max-width: 760px) { .legend { width: 260px; } #status { top: auto; bottom: 12px; } }
  body.portrait #status { top: auto !important; bottom: 12px; left: 12px; right: 12px; width: auto; }
  body.portrait .legend { width: min(300px, calc(100vw - 24px)); }
</style>

{"schema":"starcrew.ship-damage/1","status":"Used by the drill (openspec/changes/ship-damage, sc-core::combat::damage): the hit, the march, the cascade, fires and the teams. The rest is damage-control's (2026-10-04), read by the systems mockup and the repair rules. Numbers are tuning proposals, not decisions.","ship":"tern","units":{"energy":"MJ (megajoules)","length":"m","area":"m^2","time":"s","integrity":"percent of a system's full health, 0 to 100","rate":"percent per second where the key says pct_per_s"},"hull":{"armour_mj":4.0,"section_mj":40.0,"faces":["dorsal","ventral","port","starboard","bow","stern"],"note":"A hull section is a span between two of the layout's hull sections times one of six faces (9 spans x 6 faces = 54). A fresh section absorbs up to armour_mj of each hit, scaled by its integrity; each hit takes min(E, armour_mj) / section_mj x 100 points of integrity from it."},"breach":{"m2_per_mj":0.02,"min_m2":0.002,"max_m2":2.0,"note":"A hit whose energy passes the armour opens a breach in the first compartment it enters, sized by the energy left: 1 MJ past the armour makes 0.02 m^2, 50 MJ makes 1 m^2."},"propagation":{"march_step_m":0.25,"march_max_m":30.0,"decay_m":10.0,"bulkhead_mj":1.5,"radius_m":1.5,"radius_per_sqrt_mj":0.3,"note":"Energy past the armour marches along the hit direction in steps of march_step_m. Each step deposits dE = E (1 - exp(-step / decay_m)) at its point; a target within r = radius_m + radius_per_sqrt_mj x sqrt(E) of that point takes points_per_mj x dE x (1 - d / r). Each bulkhead crossed costs bulkhead_mj."},"systems":{"points_per_mj":10.0,"nominal_from_pct":75.0,"disabled_below_pct":25.0,"note":"Integrity points taken are summed over the march steps (see propagation). Capability is 1 at or above nominal_from_pct, integrity / nominal_from_pct between the two thresholds, 0 below disabled_below_pct; 0 integrity is destroyed."},"nodes":{"destroyed_below":0.25,"note":"A switchboard section, panel or bus loses health as a system does (points / 100); below destroyed_below it carries nothing until rebuilt."},"coolant":{"leak_below_pct":75.0,"leak_kg_s_at_zero":20.0,"note":"reactor-cooling design 2: a coolant pipe segment or tank below leak_below_pct integrity leaks leak_kg_s_at_zero x (leak_below_pct - integrity) / leak_below_pct kg/s: a segment at 0% leaks 20 kg/s, the loop's 11.1 t in under 10 minutes; a tank leaks its own reserve. An isolated segment does not leak. The parts' capability follows systems (power.json coolant.segments, tanks and exchanger)."},"cascade":{"surge_share":0.6,"step_factor":0.5,"max_steps":4,"min_points":1.0,"note":"ship-damage 3 (the owner's): a hit that takes points from a system already below nominal sends surge_share of those points into its power node; from a node the surge goes to every other load on it and through each unsevered conduit to the node at its far end, times step_factor at each step. Every component it reaches takes its share once (a node as points / 100 of its health). The hit system's node always passes it on; any other component passes it on only if it was below nominal before the surge. It stops after max_steps or below min_points."},"conduits":{"sever_mj":1.0,"damage_mj":0.3,"damaged_capacity":0.5},"fire":{"chance_per_mj":0.1,"chance_max":0.6,"seed_kw_per_mj":100.0,"burn_pct_per_s":0.4,"burn_hull_mj_per_s":0.05,"spread_after_s":90.0,"put_out_s":20.0,"note":"Per compartment a hit deposits energy in: ignition chance min(chance_max, chance_per_mj x E) times the room's oxygen factor, decided by a seeded hash of (session seed, hit id, compartment id). The fire starts at fire.seed_kw (atmosphere.json) plus seed_kw_per_mj x E."},"crew":{"hp_per_mj":15.0,"share":0.3,"note":"A crew member near the path loses hp_per_mj x share x the energy deposited near them, with the systems falloff (100 hit points is full health). Without crew positions (the mockup), each crew member in the room takes the room total times the fraction of its floor within r of the path."},"repair":{"kit_pct_per_s":{"officer":1.8,"rating":0.6},"kit_locker":"damage_control","kits_in_locker":6,"parts_store":"cargo","parts_on_board":24,"parts":{"disabled_system":1,"destroyed_system":3,"conduit_splice":1,"node_rebuild":4},"disabled_to_pct":25.0,"destroyed_rebuild_s":180.0,"destroyed_rebuild_to_pct":25.0,"conduit_splice_s":30.0,"conduit_splice_capacity":0.5,"node_rebuild_s":120.0,"node_rebuild_to":0.5,"hull_section_pct_per_s_eva":0.5,"two_hands_factor":1.6,"fumble_share_pct":5.0},"patch":{"plate_m2":0.25,"plates_in_locker":12,"inside_s_per_plate":15.0,"inside_max_m2":1.0,"eva_s_per_m2":60.0,"eva_max_m2":4.0,"group_holes_by_hull_section":true,"note":"A crew member patches a breach from inside with plates (cabin pressure presses a plate onto the hole), up to inside_max_m2; a larger breach is closed from outside by a suited crew member through the airlock. Holes through one hull section into one compartment are patched together: one plate per plate_m2 of their total area."},"doors":{"jam_points":25.0,"repair_s":30.0,"note":"A portal within a hit's reach that takes jam_points (as a system would) jams where it is: it neither opens nor closes until a crew member with a kit frees it (repair_s), or a drop door is cranked by hand (shuttle-bay-and-fighters)."},"cook_off":{"compartment":"magazine","air_above_k":473.15,"hold_s":60.0,"hit_mj_within_m":[10.0,2.0],"warhead_mj":60.0,"next_check_s":30.0,"note":"A missile in the racks cooks off when the magazine's air has been above air_above_k for hold_s, or a hit deposits hit_mj_within_m[0] MJ within hit_mj_within_m[1] m of the racks; it is resolved as a hit of warhead_mj from inside at the racks, and the next missile checks again next_check_s later. Not in the mockup's library."},"remote_control":{"needs_computer_ratio":0.5,"note":"Breakers, dampers, doors and suppression are operated from the bridge and the damage control board only while the computer core has at least this supply ratio; otherwise only at the switchboards, the doors and the system itself."},"teams":{"count":2,"members":2,"home":"damage_control","walk_m_s":1.8,"run_m_s":4.0,"suited_m_s":1.5,"ladder_up_m_s":0.8,"ladder_down_m_s":1.0,"suit_up_s":20.0,"dispatch_delay_s":5.0,"path_factor":1.4,"enter_below_kpa_needs_suit":50.0,"refuse_fire_above_kw_without_suit":2000.0,"note":"NPC damage control teams are crew bodies (crew-on-deck): they walk the crew-portal graph, carry a kit, an extinguisher or plates, take the same harm as players, and can die. Their speeds (walk, run, suited, ladders up and down) and suit donning time are crew-on-deck's (design sections 3, 4 and 10), repeated here until data/crew.json exists and teams read it. Reconciled 2026-10-05: crew-on-deck owns this (was walk 1.6 m/s, ladders 0.8 m/s both ways, suit-up 30 s)."}}
</script>
