      // Conduits along fore-and-aft corridor walls.
      if (comp.kind === "corridor" && Math.abs(w.t[1]) > 0.9) {
        const C = D.conduits;
        let y = top - C.drop_m;
        for (const r of C.radii_m) {
          y -= r;
          const inset = F.rib_depth_m + C.gap_m + r;
          B.pipe("pipe", P3(0.02, y, inset), P3(w.len - 0.02, y, inset), r, C.sides);
          y -= r + C.gap_m;
        }
      }
      if (panelsOn) dressWall(B, comp, w, top, holes, clear, ribs, panelsOn, P3, nIn, opts.innerFloors);
    }

    // ---- per brush: coves, floor, ceiling, and the detail on them
    const walkPaths = panelsOn ? walkwayPaths(L, comp, panelsOn.S) : null;
    for (const br of comp.brushes) {
      const cvs = coveOf.get(br), inner = insetPoly(br.poly, cvs), npts = br.poly.length;
      for (let i = 0; i < npts; i++) {
        if (!cvs[i]) continue;
        const a = br.poly[i], b = br.poly[(i + 1) % npts], ia = inner[i], ib = inner[(i + 1) % npts];
        const on = outwardNormal(a, b), n = [-on[0] * Math.SQRT1_2, -Math.SQRT1_2, -on[1] * Math.SQRT1_2], y = br.y[1];
        if (T) coveStrip(B, T, [a[0], y - cvs[i], a[1]], [b[0], y - cvs[i], b[1]], [ib[0], y, ib[1]], [ia[0], y, ia[1]], n);
        else B.quad("cove", [a[0], y - cvs[i], a[1]], [b[0], y - cvs[i], b[1]], [ib[0], y, ib[1]], [ia[0], y, ia[1]], n);
      }
      // Floor portals that open in this brush's floor or ceiling.
      const fHoles = [], cHoles = [];
      for (const p of portalsOf(L, comp.id)) {
        const f = portalFrame(p);
        if (!f.floor || skip.indexOf(p.kind) >= 0 || !insidePoly(br.poly, f.c[0], f.c[2])) continue;
        const o = portalOut(p, comp.id);
        const rect = [[f.c[0] - f.sx / 2, f.c[2] - f.sz / 2], [f.c[0] + f.sx / 2, f.c[2] - f.sz / 2], [f.c[0] + f.sx / 2, f.c[2] + f.sz / 2], [f.c[0] - f.sx / 2, f.c[2] + f.sz / 2]];
        if (o[1] < 0 && Math.abs(br.y[0] - f.c[1]) < 0.6) fHoles.push({ rect, f, p });
        if (o[1] > 0 && Math.abs(br.y[1] - f.c[1]) < 0.6) cHoles.push({ rect, f, p });
      }
      if (panelsOn) {
        const bi = comp.brushes.indexOf(br);
        const under = lampList.filter((l) => insidePoly(br.poly, l.p[0], l.p[2]) && l.p[1] > br.y[0] && l.p[1] < br.y[1] + EPS);
        const covers = (opts.floorCovers || []).filter((cv) => Math.abs(cv.y_m - br.y[0]) < 0.3).map((cv) => cv.poly);
        dressFlat(B, comp, br, bi, "floor", br.poly, fHoles, FP.rim_width_m, br.y[0], 1, null, walkPaths, panelsOn, D, covers);
        dressFlat(B, comp, br, bi, "ceiling", inner, cHoles, FP.collar_width_m, br.y[1], -1, under, null, panelsOn, D);
      } else {
        B.flat(THREE, "floor", br.poly, fHoles.map((h) => h.rect), br.y[0], 1);
        B.flat(THREE, "ceiling", inner, cHoles.map((h) => h.rect), br.y[1], -1);
      }
      for (const h of fHoles.concat(cHoles)) openings.push({ portal: h.p, floor: true, frame: h.f, brush: br });
      if (!detail) continue;

      const zs = br.poly.map((p) => p[1]), z0 = Math.min(...zs), z1 = Math.max(...zs);
      const SIDES = [[0, -1], [0, 1], [-1, 0], [1, 0]];
      // Hazard rims round floor holes.
      for (const h of fHoles) {
        const f = h.f, W = FP.rim_width_m, y = br.y[0] + FP.raise_m / 2;
        for (const [sx, sz] of SIDES) {
          const along = sx === 0, hu = along ? f.sx / 2 + W : W / 2, hw = along ? W / 2 : f.sz / 2;
          B.box("rim", [f.c[0] + sx * (f.sx / 2 + W / 2), y, f.c[2] + sz * (f.sz / 2 + W / 2)], [1, 0, 0], [0, 1, 0], [0, 0, 1], hu, FP.raise_m / 2, hw, ["+v", "+u", "-u", "+w", "-w"]);
        }
      }
      // Collars round ceiling holes, and ladders up through them.
      for (const h of cHoles) {
        const f = h.f, W = FP.collar_width_m, y = br.y[1] - FP.collar_depth_m / 2;
        for (const [sx, sz] of SIDES) {
          const along = sx === 0, hu = along ? f.sx / 2 + W : W / 2, hw = along ? W / 2 : f.sz / 2;
          tbox("collar", [f.c[0] + sx * (f.sx / 2 + W / 2), y, f.c[2] + sz * (f.sz / 2 + W / 2)], [1, 0, 0], [0, 1, 0], [0, 0, 1], hu, FP.collar_depth_m / 2, hw, ["-v", "+u", "-u", "+w", "-w"]);
        }
        // The hole's sides through the slab, from this ceiling up to the floor of the room above (owner, 2026-10-08,
        // looking up the magazine's hoist: "some more weird missing geometry"): without them a hole between decks
        // shows the empty half metre between one room's ceiling and the next one's floor.
        const upId = h.p.between.find((id) => id !== comp.id), upC = upId && upId !== "space" && compartment(L, upId);
        const slabTop = upC ? floorAt(upC, f.c[0], f.c[2], br.y[1] + 0.3) : null;
        if (slabTop !== null && slabTop !== undefined && slabTop - br.y[1] > 0.02) {
          const hh = (slabTop - br.y[1]) / 2, yc = br.y[1] + hh, e = 0.005;
          for (const [sx, sz] of SIDES) {
            const along = sx === 0, inward = along ? (sz > 0 ? "-w" : "+w") : (sx > 0 ? "-u" : "+u");
            tbox("collar", [f.c[0] + sx * (f.sx / 2 + e), yc, f.c[2] + sz * (f.sz / 2 + e)], [1, 0, 0], [0, 1, 0], [0, 0, 1],
              along ? f.sx / 2 : e, hh, along ? e : f.sz / 2, [inward]);
          }
        }
        // A ladder up through a ladder well, and through a floor hatch (a scuttle, a turret pod's hatch: deck-access),
        // from this floor to the floor above, and its handholds past it.
        if (h.p.kind === "ladder" || h.p.kind === "hatch") {
          const above = h.p.between.find((id) => id !== comp.id), up = above && compartment(L, above);
          const top = up ? floorAt(up, f.c[0], f.c[2], br.y[1] + 0.3) : br.y[1] + 0.5;
          // Its handholds past the floor above only where the ladder ends there: where the room above has its own
          // ladder up from the same well, that one carries on, and two would overlap rail on rail.
          const goesOn = up && portalsOf(L, up.id).some((q) => q !== h.p && (q.kind === "ladder" || q.kind === "hatch") &&
            Math.abs(q.center_m[0] - f.c[0]) < 0.3 && Math.abs(q.center_m[2] - f.c[2]) < 0.3 && q.center_m[1] > f.c[1] + 0.5);
          const topY = top + (goesOn ? 0 : FP.ladder_above_m), bot = br.y[0], zl = f.c[2] - f.sz / 2 + FP.ladder_rail_m, hr = FP.ladder_rail_m / 2;
          for (const s of [-1, 1]) {
            tbox("ladder", [f.c[0] + (s * FP.ladder_width_m) / 2, (topY + bot) / 2, zl], [1, 0, 0], [0, 1, 0], [0, 0, 1], hr, (topY - bot) / 2, hr, ["+u", "-u", "+w", "-w", "+v"]);
          }
          for (let y = bot + FP.rung_spacing_m; y < topY - 0.05; y += FP.rung_spacing_m) {
            tbox("ladder", [f.c[0], y, zl], [1, 0, 0], [0, 1, 0], [0, 0, 1], FP.ladder_width_m / 2, hr * 0.7, hr * 0.7, ["+v", "-v", "+w", "-w"]);
          }
        }
      }
      // A runner down a corridor, unless the floor is dressed: its walkway does the runner's job (floor-panels).
      if (comp.kind === "corridor" && !panelsOn) {
        const R = D.runner, xs = br.poly.map((p) => p[0]), x0 = Math.min(...xs), x1 = Math.max(...xs);
        const alongZ = z1 - z0 >= x1 - x0;
        const lo = (alongZ ? z0 : x0) + R.end_clear_m, hi = (alongZ ? z1 : x1) - R.end_clear_m, mid = alongZ ? (x0 + x1) / 2 : (z0 + z1) / 2;
        const rc = fHoles.map((h) => alongZ ? [h.f.c[2] - h.f.sz / 2 - FP.rim_width_m, h.f.c[2] + h.f.sz / 2 + FP.rim_width_m] : [h.f.c[0] - h.f.sx / 2 - FP.rim_width_m, h.f.c[0] + h.f.sx / 2 + FP.rim_width_m]);
        for (const [a, b] of intervalMinus(lo, hi, rc)) {
          if (b - a < 0.1) continue;
          const c = alongZ ? [mid, br.y[0] + R.raise_m / 2, (a + b) / 2] : [(a + b) / 2, br.y[0] + R.raise_m / 2, mid];
          B.box("runner", c, alongZ ? [1, 0, 0] : [0, 0, 1], [0, 1, 0], alongZ ? [0, 0, 1] : [1, 0, 0], R.width_m / 2, R.raise_m / 2, (b - a) / 2, ["+v", "+u", "-u", "+w", "-w"]);

      // lift's shaft.
      if (comp.kind !== "pod" && !liftShaft) {
        const keep = systemsIn(L, comp.id).filter((s) => s.radius_m);
        for (const z of frameStations(D, z0, z1, F.end_clear_m + 0.05)) {
          const ch = chord(inner, 1, z);
          if (!ch) continue;
          const d = tallBrush(br) ? F.deep_beam_depth_m : F.beam_depth_m;
          const bc = [];
          for (const s of keep) {
            const dz = Math.abs(z - s.center_m[2]), r = s.radius_m + 0.1;
            if (dz < r + F.beam_width_m) { const hx = Math.sqrt(Math.max(0, r * r - Math.min(dz, r) ** 2)) + F.beam_width_m; bc.push([s.center_m[0] - hx, s.center_m[0] + hx]); }

          for (const h of cHoles) if (Math.abs(z - h.f.c[2]) < h.f.sz / 2 + F.beam_width_m) bc.push([h.f.c[0] - h.f.sx / 2 - FP.collar_width_m, h.f.c[0] + h.f.sx / 2 + FP.collar_width_m]);

            const caps = ["-v", "+w", "-w"].concat(b < ch[1] - 1e-6 ? ["+u"] : [], a > ch[0] + 1e-6 ? ["-u"] : []);
            // 1 cm narrower each side than the ribs it meets at the frame, so their sides never share a plane.
            tbox("beam", [(a + b) / 2, br.y[1] - d / 2, z], [1, 0, 0], [0, 1, 0], [0, 0, 1], (b - a) / 2, d / 2, F.beam_width_m / 2 - 0.01, caps, null, "-v");
          }

      }
    }

    // ---- lamp fixtures: a housing at the ceiling whose underside is the lens
    const lamps = lampList;
    if (detail) {
      const hh = D.lamps.housing_m / 2;
      // The lens shows two whole light panels side by side, centred on the lamp (owner, 2026-10-06: "UV them correctly.
      // They look off centered"): a lens is 2:1 (detailing.json panel_m and corridor_panel_m), and the light_panel
      // layer's span holds two panels across and two down, so the lens takes the layer's top half exactly.

  }

  // ------------------------------------------------------------- materials

  /** The materials inlined as <script id="ship-materials">: { manifest, layers: { name: "data:image/png;base64,..." } }. */
  function materialsData() {
    const el = document.getElementById("ship-materials");
    if (!el) throw new Error("shipkit: no #ship-materials script in the page (add <!-- INLINE materials --> markers and run tools/mockups/inline.py)");
    return JSON.parse(el.textContent);
  }

  /**
   * Decode a PNG data URI to straight (not premultiplied) RGBA bytes. A canvas would
   * premultiply, and Star Crew layers carry the emission mask in alpha, so a texel with
   * alpha 0 would lose its colour (surface-materials design).
   */
  async function decodePng(uri) {
    const bin = Uint8Array.from(atob(uri.slice(uri.indexOf(",") + 1)), (ch) => ch.charCodeAt(0));
    const dv = new DataView(bin.buffer);

    const idat = [];
    while (pos < bin.length) {
      const len = dv.getUint32(pos), type = String.fromCharCode(bin[pos + 4], bin[pos + 5], bin[pos + 6], bin[pos + 7]);
      const data = bin.subarray(pos + 8, pos + 8 + len);

      else if (type === "tRNS") trns = data;

      else if (type === "IEND") break;
      pos += 12 + len;

    if (depth !== 8) throw new Error("shipkit: PNG bit depth " + depth + " (8 expected)");

    const raw = new Uint8Array(await new Response(new Blob(idat).stream().pipeThrough(new DecompressionStream("deflate"))).arrayBuffer());
    const stride = w * bpp, out = new Uint8Array(w * h * 4);
    let prev = new Uint8Array(stride), cur = new Uint8Array(stride), p = 0;
    for (let y = 0; y < h; y++) {
      const f = raw[p++];
      for (let x = 0; x < stride; x++) {
        const a = x >= bpp ? cur[x - bpp] : 0, b = prev[x], c = x >= bpp ? prev[x - bpp] : 0;
        let v = raw[p++];
        if (f === 1) v += a; else if (f === 2) v += b; else if (f === 3) v += (a + b) >> 1;
        else if (f === 4) { const pa = Math.abs(b - c), pb = Math.abs(a - c), pc = Math.abs(a + b - 2 * c); v += pa <= pb && pa <= pc ? a : pb <= pc ? b : c; }

      }

        const o = (y * w + x) * 4;
        if (ctype === 6) { out[o] = cur[x * 4]; out[o + 1] = cur[x * 4 + 1]; out[o + 2] = cur[x * 4 + 2]; out[o + 3] = cur[x * 4 + 3]; }
        else if (ctype === 2) { out[o] = cur[x * 3]; out[o + 1] = cur[x * 3 + 1]; out[o + 2] = cur[x * 3 + 2]; out[o + 3] = 255; }
        else if (ctype === 3) { const i = cur[x]; out[o] = plte[i * 3]; out[o + 1] = plte[i * 3 + 1]; out[o + 2] = plte[i * 3 + 2]; out[o + 3] = trns && i < trns.length ? trns[i] : 255; }
        else if (ctype === 0) { out[o] = out[o + 1] = out[o + 2] = cur[x]; out[o + 3] = 255; }

  }

  /**
   * Load the Material Maker layers into one texture array, the way the engine will
   * (surface-materials): nearest on magnification, mipmapped on minification, sRGB.
   * Resolves to { texture, names, layer: { name: index }, span: { name: metres }, manifest, bytes }.
   */
  async function loadMaterials(THREE) {
    const d = materialsData(), man = d.manifest;

    names.forEach((n, i) => { if (man.materials[n].layer !== i) throw new Error("shipkit: material layers are not numbered 0.." + (names.length - 1)); });

      putLayer(data, i, px, img);

    const tex = layerTexture(THREE, data, px, names.length);
    const layer = {}, span = {};
    names.forEach((n, i) => { layer[n] = i; span[n] = man.materials[n].span_m; });
    return { texture: tex, names, layer, span, manifest: man, bytes: Math.round((data.length * 4) / 3) };
  }

  /** Copy a decoded layer into the array's data as layer i, rows flipped so v = 0 is the image's bottom (a wall's texture stands the right way up). */
  function putLayer(data, i, px, img) {
    for (let y = 0; y < px; y++) data.set(img.rgba.subarray((px - 1 - y) * px * 4, (px - y) * px * 4), (i * px + y) * px * 4);
  }

  /** The texture array the engine will use (surface-materials): sRGB, nearest on magnification, mipmapped on minification. */

  /** A decoded image scaled up to px by nearest neighbour (a whole factor), as the engine would fill a larger array. */
  /**
   * A decoded image scaled down to px by a whole factor, averaging each block in linear light (alpha averaged as is):
   * a big prop's 512 or 1024 px atlas in a page whose array is smaller. It loses the detail the bigger atlas carries;
   * the engine's array holds it at full size (engineering-fitout design section 7).
   */
  function scaleDown(img, px) {

      const acc = [0, 0, 0, 0];
      for (let j = 0; j < f; j++) for (let i = 0; i < f; i++) {

        acc[0] += lin[img.rgba[s]]; acc[1] += lin[img.rgba[s + 1]]; acc[2] += lin[img.rgba[s + 2]]; acc[3] += img.rgba[s + 3];

    const f = px / img.w;
    if (f !== Math.round(f) || img.h !== img.w) throw new Error(`shipkit: cannot scale a ${img.w} px layer to ${px} px`);
    const out = new Uint8Array(px * px * 4);

    }
    return { w: px, h: px, rgba: out };
  }

  /**
   * The materials and the panels in one texture array (wall-panels design section 5): the
   * materials' layers first, then every panel layer in panels.json's numbering (walls, strips,
   * ceilings, floors and trims; panelLayerList), all opts.px wide
   * (128: 64 px per metre; 256: 128 px per metre, with the materials scaled up by nearest
   * neighbour). Resolves to loadMaterials' shape plus panels: { manifest, first, px }. Panel layers
   * have span 1 (their texture coordinates are already in layer units), and surfaceMaterial makes
   * their alpha glow.
   */
  const BIG_LAYER = 1000;   // the layer index step between the main array and each bigger one (loadPanels)
  async function loadPanels(THREE, mats, opts) {
    opts = opts || {};
    const d = panelsData(), S = d.manifest, px = opts.px || 128, md = materialsData(), first = mats.names.length;
    if (S.layers.first_layer !== first) throw new Error(`shipkit: panels.json first_layer ${S.layers.first_layer}, but the page has ${first} materials`);
    const files = d.layers[String(px)];
    if (!files) throw new Error(`shipkit: no ${px} px panel layers in the page (layers.sizes_px)`);
    const pnames = [];
    for (const r of panelLayerList(S)) pnames[r.layer - first] = [r.name, r.stem];
    const n = first + pnames.length, data = new Uint8Array(px * px * 4 * n);
    for (let i = 0; i < first; i++) putLayer(data, i, px, scaleNearest(await decodePng(md.layers[mats.names[i]]), px));
    for (let j = 0; j < pnames.length; j++) {
      if (!pnames[j] || !files[pnames[j][1]]) throw new Error(`shipkit: panel layer ${first + j} is missing (panels.json numbering)`);
      const img = await decodePng(files[pnames[j][1]]);
      if (img.w !== px || img.h !== px) throw new Error(`shipkit: panel layer ${pnames[j][1]} is ${img.w}x${img.h}, expected ${px}`);
      putLayer(data, first + j, px, img);
    }
    // Every prop's own baked atlas the page carries (ship-props design 4c), after the panel layers: prop:<set>:<prop>.
    const atl = [];
    if (typeof document !== "undefined") {
      for (const el of document.querySelectorAll('script[id^="ship-models-"]')) {
        const set = el.id.slice("ship-models-".length);
        if (opts.atlasSets && !opts.atlasSets.includes(set)) continue;
        const d = JSON.parse(el.textContent);
        for (const [prop, uri] of Object.entries(d.atlases || {}).sort()) atl.push([`prop:${set}:${prop}`, uri]);
      }
    }
    // An atlas bigger than the array (a big prop's 512 or 1024 px, so it reads at walking distance) goes into an array
    // of its own size, BIG_LAYER apart per size: index BIG_LAYER * k + i is layer i of the k-th bigger array.
    const imgs = [];
    for (const [name, uri] of atl) imgs.push([name, await decodePng(uri)]);

    const total = n + small.length, all = new Uint8Array(px * px * 4 * total);
    all.set(data);
    small.forEach(([, img], j) => putLayer(all, n + j, px, img.w === px && img.h === px ? img : scaleNearest(img, px)));
    const layer = Object.assign({}, mats.layer), span = Object.assign({}, mats.span);
    pnames.forEach(([name], j) => { layer[name] = first + j; span[name] = 1; });
    small.forEach(([name], j) => { layer[name] = n + j; span[name] = 1; });

      const these = imgs.filter(([, im]) => im.w === bp), d = new Uint8Array(bp * bp * 4 * these.length);
      these.forEach(([name, img], i) => { putLayer(d, i, bp, img); layer[name] = BIG_LAYER * (k + 1) + i; span[name] = 1; });

    });

      texture: layerTexture(THREE, all, px, total), names: mats.names.concat(pnames.map((q) => q[0]), small.map((q) => q[0])), layer, span, big,
      manifest: mats.manifest, bytes, panels: { manifest: S, first, px },
    };
  }

  /** A per-vertex layer name (wall panels) as an index into mats' array; 0 with no mats. */
  function vlayerIndex(mats, name) {
    if (!mats) return 0;
    const i = mats.layer[name];
    if (i === undefined) throw new Error(`shipkit: no texture layer ${name} (wall panels need ShipKit.loadPanels)`);
    return i;
  }

  /**
   * The one surface material every textured mesh uses: the vertex's layer, times the vertex
   * colour. opts.lit true (default): Lambert, lit by the scene's lights; texels glow where the
   * vertex's surfGlow is set (lamp lenses, status strips), tinted by material.userData.emissive
   * (a THREE.Color the page sets per lighting state). opts.lit false: unlit, the vertex colour
   * is the baked light (the engine's way).

    opts = opts || {};

    if (opts.side !== undefined) m.side = opts.side;

    m.userData.emissive = new THREE.Color(opts.emissive === undefined ? 0xffe9c8 : opts.emissive);
    m.userData.glowGain = { value: opts.glowGain === undefined ? 1.0 : opts.glowGain };
    // Wall panels (loadPanels): a panel layer's alpha is its emission mask, scaled per lighting
    // state by material.userData.panelGlow.value (panels.json glow). Pages without panels compile
    // exactly the shader they always did.
    const panels = mats.panels || null;
    if (panels) m.userData.panelGlow = { value: 1.0 };
    m.onBeforeCompile = (sh) => {
      sh.uniforms.uLayers = { value: mats.texture };
      sh.uniforms.uGlowTint = { value: m.userData.emissive };
      sh.uniforms.uGlowGain = m.userData.glowGain;
      sh.vertexShader = sh.vertexShader
        .replace("#include <common>", "#include <common>\nattribute vec2 surfUv;\nattribute float surfLayer;\nattribute float surfGlow;\nvarying vec3 vSurf;\nvarying float vGlow;")
        .replace("#include <begin_vertex>", "#include <begin_vertex>\nvSurf = vec3(surfUv, surfLayer);\nvGlow = surfGlow;");
      sh.fragmentShader = sh.fragmentShader
        .replace("#include <common>", "#include <common>\nprecision highp sampler2DArray;\nuniform sampler2DArray uLayers;\nuniform vec3 uGlowTint;\nuniform float uGlowGain;\nvarying vec3 vSurf;\nvarying float vGlow;")
        .replace("#include <map_fragment>", "vec4 surfTex = texture(uLayers, vec3(vSurf.xy, floor(vSurf.z + 0.5)));\ndiffuseColor.rgb *= surfTex.rgb;");
      // The bigger arrays (loadPanels big): a layer index BIG_LAYER * k + i samples the k-th of them.
      const big = mats.big || [];
      if (big.length) {
        big.forEach((b, k) => { sh.uniforms["uBig" + k] = { value: b.texture }; });
        sh.fragmentShader = sh.fragmentShader
          .replace("uniform sampler2DArray uLayers;", "uniform sampler2DArray uLayers;\n" + big.map((b, k) => `uniform sampler2DArray uBig${k};`).join("\n"))
          .replace("vec4 surfTex = texture(uLayers, vec3(vSurf.xy, floor(vSurf.z + 0.5)));",
            "float surfL = floor(vSurf.z + 0.5);\nvec4 surfTex;\n" + big.slice().reverse().map((b, r) => {
              const k = big.length - 1 - r;
              return `if (surfL > ${b.base - 0.5}) surfTex = texture(uBig${k}, vec3(vSurf.xy, surfL - ${b.base}.0)); else `;
            }).join("") + "surfTex = texture(uLayers, vec3(vSurf.xy, surfL));");
      }
      if (lit) sh.fragmentShader = sh.fragmentShader.replace("#include <emissivemap_fragment>", "#include <emissivemap_fragment>\ntotalEmissiveRadiance += surfTex.rgb * vGlow * uGlowTint * uGlowGain;");
      if (panels) {
        sh.uniforms.uPanelFirst = { value: panels.first };
        sh.uniforms.uPanelGlow = m.userData.panelGlow;
        sh.fragmentShader = sh.fragmentShader
          .replace("uniform float uGlowGain;", "uniform float uGlowGain;\nuniform float uPanelFirst;\nuniform float uPanelGlow;")
          .replace("diffuseColor.rgb *= surfTex.rgb;", "diffuseColor.rgb *= surfTex.rgb;\nfloat panelGlow = step(uPanelFirst - 0.5, vSurf.z) * surfTex.a * uPanelGlow;");
        if (lit) sh.fragmentShader = sh.fragmentShader.replace("totalEmissiveRadiance += surfTex.rgb * vGlow", "totalEmissiveRadiance += surfTex.rgb * panelGlow;\ntotalEmissiveRadiance += surfTex.rgb * vGlow");
        else sh.fragmentShader = sh.fragmentShader.replace("#include <color_fragment>", "#include <color_fragment>\ndiffuseColor.rgb = mix(diffuseColor.rgb, surfTex.rgb, panelGlow);");
      }
    };
    m.customProgramCacheKey = () => "shipkit-surface-" + (lit ? "lit" : "baked") + (panels ? "-panels" : "") + "-big" + (mats.big || []).length;
    return m;
  }

  /**

   * geometry.userData.roles = { role: [firstVertex, count] } for recolouring. A part may
   * carry tint (an r, g, b per vertex: an albedo tint the bake keeps) and glow (one per

  /** The finish table for a compartment: { role: material name }. */
  function finishOf(comp, D) {
    D = D || shipData("detailing");
    const f = D.finishes[comp.finish];
    if (!f) throw new Error(`shipkit: compartment ${comp.id} has finish ${comp.finish}, not in detailing.json finishes`);
    return f;
  }

  /**
   * The shell only (no detail): { floor, ceiling, walls, coves } as BufferGeometries with
   * a white colour attribute and no material layers, plus the openings and the lamps.
   */
  function roomShell(THREE, L, comp, opts) {
    const r = buildCompartment(THREE, L, comp, Object.assign({}, opts, { detail: false }));
    const g = (role) => geometryOf(THREE, r.parts[role] ? { [role]: r.parts[role] } : {}, null);

  /**
   * One compartment as one textured mesh (one draw call, as the engine draws it with a

   * plus opts.material (default: one lit surfaceMaterial shared by every call with these mats).

    opts = opts || {};
    const D = opts.detailing || shipData("detailing");
    const built = buildCompartment(THREE, L, comp, Object.assign({ detailing: D }, opts));
    const geo = geometryOf(THREE, built.parts, mats, finishOf(comp, D));
    const mat = opts.material || mats._lit || (mats._lit = surfaceMaterial(THREE, mats, { lit: true }));

  /** Paint every vertex of a role in a merged geometry (lamp lenses per lighting state, for example). */
  function paintRole(geo, role, color) {
    const r = geo.userData.roles[role];
    if (!r) return;
    const c = geo.attributes.color;
    for (let i = r[0]; i < r[0] + r[1]; i++) c.setXYZ(i, color.r, color.g, color.b);
    c.needsUpdate = true;
  }

  /**
   * The stand-in bake (deck-pipeline section 7 until sc-tools bake exists): direct light
   * from the compartment's lamps (lampsFor), no shadows or bounce, into the vertex colours
   * of a merged geometry, for one lighting state; the emergency state lights only the
   * emergency-bus lamps. A lamp may carry color ([r, g, b], times the state's lamp colour)
   * or, with fixed: true, a colour of its own in every state (a console's glow, a strip).
   * A vertex's tint (geometryOf) multiplies its light. Lamp lenses are painted lit or dark
   * lamp by lamp (the lamps that are not fixed, in order, one lens each); status strips the
   * state's colour; screens keep their tint, brightened. Use with surfaceMaterial({ lit: false }).
   * The light-baking mockup has the real baker (lightbake.js); this is for pages that only
   * need rooms to read as lit. opts.gain (default 0.55) scales lamp light; opts.cap (1.6)

      const c = l.fixed ? (l.color || [1, 1, 1]) : [lampC.r * (l.color ? l.color[0] : 1), lampC.g * (l.color ? l.color[1] : 1), lampC.b * (l.color ? l.color[2] : 1)];
      return { l, c };

    for (let i = 0; i < P.length / 3; i++) {
      let er = 0, eg = 0, eb = 0;
      for (const { l, c } of on) {
        const dx = l.p[0] - P[i * 3], dy = l.p[1] - P[i * 3 + 1], dz = l.p[2] - P[i * 3 + 2], d2 = dx * dx + dy * dy + dz * dz, d = Math.sqrt(d2) || 1e-6;

    const dark = new THREE.Color(0x1a1d22);

    C.needsUpdate = true;
  }

  /**
   * Split the triangles of the given roles until no edge is longer than maxEdge metres
   * (longest-edge bisection), so a vertex bake shows pools of light on a floor or a wall.
   * Works on buildCompartment's parts in place; returns them.

        const stack = [[0, 1, 2].map((k) => ({ p: P.position.slice((t * 3 + k) * 3, (t * 3 + k) * 3 + 3), n: P.normal.slice((t * 3 + k) * 3, (t * 3 + k) * 3 + 3), u: P.uvm.slice((t * 3 + k) * 2, (t * 3 + k) * 2 + 2), l: P.vlayer ? P.vlayer[t * 3 + k] : null }))];

  /**
   * Platforms and stairs (bridge-stations section 11a): raised floors that are solid, like a
   * dais, not air. A platform { poly, top_m, edges[], rail_gaps_m? } stands on floorY; edges[i]
   * is the kind of the edge from poly[i] to poly[i + 1]: "wall" (against the room's wall:
   * nothing drawn), "riser" (a step face and a hazard nosing), "rail" (the same and a
   * railing), "step" (a riser where a stair meets it). Rails leave gaps at rail_gaps_m (x or z
   * intervals, along the edge's main axis) and wherever a stair's top edge lands. A stair
   * { top_m, foot_m, width_m } (the layout's stair convention) gets treads of
   * detailing.platforms.tread_rise_m with nosings. Adds roles platform, riser, nosing,
   * railing and stair to the builder.
   */
  /**
   * A platform's top in one floor panel module (opts.topLayer of buildPlatforms, a panelLayerName), cell by cell on
   * panels.json's cell grid as the room floors are dressed, so it matches them and a plain module (the walkway's
   * tread) reads seamless. The owner, 2026-10-06, on the bridge's platforms in the gridded deck_tiles: "I don't like
   * the gridded floor please use something else that's more pleasing to look at".
   */
  function tileTop(THREE, B, role, poly, y, layer) {
    const S = panelsData().manifest, cs = S.cells.size_m, span = S.layers.span_m, ox = S.cells.origin_x_m;
    const xs = poly.map((p) => p[0]), zs = poly.map((p) => p[1]), up = [0, 1, 0];
    const v2 = (p) => new THREE.Vector2(p[0], p[1]);
    for (let k = Math.floor((Math.min(...xs) - ox) / cs - 0.5); ox + (k - 0.5) * cs < Math.max(...xs); k++) {
      for (let j = Math.floor(Math.min(...zs) / cs - 0.5); (j - 0.5) * cs < Math.max(...zs); j++) {

    }
  }
  /**
   * The platform layer's rows for opts.riserLayer (ceilings-and-trims design 9), or null without it or without the

   */

    if (!opts || !opts.riserLayer) return null;
    const S = panelsData().manifest;

    return { layer: opts.riserLayer, span: S.layers.span_m, rows: R, stretch: S.trims.stretch_max, forHeight: (h) => (h >= cut ? "riser" : "riser_low") };
  }
  /**
   * A vertical face from a to b (floor points) h high, on a row of the platform layer: its bottom edge on the row's
   * bottom, its top on the row's top, so what the row shows fits the face; u is u0 + metres along it over the span.
   */

    for (const [blk, keys] of [["hypoxia", ["harm_below_po2_kpa", "harm_full_po2_kpa", "harm_full_hp_per_s"]], ["heat", ["cold_harm_below_k", "cold_harm_hp_per_s_per_k"]]])
      for (const k of keys) if (!Number.isFinite(AT.crew_effects[blk][k])) throw new Error(`atmosphere.json crew_effects.${blk}.${k}: missing (openspec/changes/fire-spread design 6a)`);
    if (!FI.suppression.venting || !Number.isFinite(FI.suppression.venting.warning_s)) throw new Error("atmosphere.json fire.suppression.venting.warning_s: missing (fire-spread design 6a)");
    for (let i = 0; i < N; i++) {
      const fm2 = FI.fuel_mj_per_m2[comps[i].id] != null ? FI.fuel_mj_per_m2[comps[i].id] : FI.fuel_mj_per_m2_default;
      st.fire.push({ hrr: 0, fuel: fm2 * floor[i] * 1e6, ext: 0, mist: 0, mistLeft: FI.suppression.water_mist.discharges, inert: 0, prevP: P[i], out: 0 });
    }
    // The cell model (fire-spread design 1-2), when firespread.js is loaded: opts.fireItems are FireSpread.placements
    // (what stands where, and so where the fuel is); without them every cell is bare deck.
    const FS = root.FireSpread && opts.cells !== false && FI.cells ? root.FireSpread.create(L, FI, { items: opts.fireItems || [], fuel_j: st.fire.map((f) => f.fuel) }) : null;
    const EX = FI.extinguisher, VENT = FI.suppression.venting;
    st.extinguishers = [];   // { comp, aim ("careful" | "careless" | { from, dir }), on, agent_kg, n, door, held }
    st.vent = null;          // { comp, phase: "warning" | "venting", warn }
    function setActivity(a) { Object.assign(st.activity, a); }
    setActivity({ drive: 0.3, dampers: 0.2, rcs: 0.1, shield_regen: 0, turret_dorsal: 0, turret_ventral: 0, turret_port: 0, turret_stbd: 0,
      sensors_active: 0, comms: 0.2, hoist: 0, cradle_p: 0, cradle_s: 0, pad: 0 });

    // ======================================================= POWER SOLVE
    // The one power-flow solve (CLAUDE.md 6.1): every delivered MW and every console
    // preview comes from solveGrid(). Nodes: S (source), RX (reactor), BAT, then power nodes.
    const S = 0, RX = 1, BAT = 2, NOFF = 3;
    const pIdx = {}; nodes.forEach((id, i) => (pIdx[id] = NOFF + i));
    const GN = NOFF + nodes.length;
    const MWW = 1e6, EPS = PW.solve.epsilon_mw;

    /** Snapshot of edge capacities from the current state (MW). */
    function gridSnapshot() {
      const edges = [];
      const adjL = Array.from({ length: GN }, () => []);
      const add = (id, u, v, c, directed, kind) => { const e = { id, u, v, c: Math.max(0, c), f: 0, directed, kind }; adjL[u].push([edges.length, 1]); adjL[v].push([edges.length, -1]); edges.push(e); return e; };
      const rx = st.reactor;
      const rxAvail = rx.state === "running" ? rx.P_th * PW.reactor.conversion_efficiency / MWW : 0;
      const B = PW.battery;
      // The restart reserve is spent only by priority 0 (reactor auxiliaries, coolant pumps,
      // emergency lighting) unless engineering releases it.
      const reserve = rx.releaseReserve ? 0 : B.restart_reserve_mj;
      const lim = (e) => Math.max(0, Math.min(B.discharge_max_mw * st.battery.health, (e * B.discharge_efficiency) / dt));
      const batAvail = lim(st.battery.soc_mj - reserve), batAvailAll = lim(st.battery.soc_mj);
      // A node whose box is switched off passes nothing, as a destroyed one (power-routing 1).
      const nh = (id) => (st.boxOn[id] === false ? 0 : st.nodeHealth[id] == null ? 1 : st.nodeHealth[id]);
      const eRx = add("reactor", S, RX, rxAvail, true, "source");
      const eBat = add("battery", S, BAT, 0, true, "source");
      add("battery_out", BAT, pIdx[B.node], st.batteryBreaker ? 1e9 : 0, true, "battery");
      for (const g of PW.generators) add(g.id, RX, pIdx[g.node], st.genClosed[g.id] && nh(g.node) > 0 ? g.capacity_mw : 0, true, "generator");
      for (const t of PW.ties) add(t.id, pIdx[t.between[0]], pIdx[t.between[1]], st.tieClosed[t.id] && nh(t.between[0]) > 0 && nh(t.between[1]) > 0 ? t.capacity_mw : 0, false, "tie");
      for (const k of PW.conduits) {
        const s = st.conduit[k.id];
        const ok = !s.severed && s.breaker && nh(k.between[0]) > 0 && nh(k.between[1]) > 0;
        add(k.id, pIdx[k.between[0]], pIdx[k.between[1]], ok ? k.capacity_mw * s.health : 0, false, "conduit");
      }
      if (nh(B.node) <= 0) edges[2].c = 0;
      const chargeWant = Math.max(0, Math.min(B.charge_max_mw * st.battery.health, (B.capacity_mj - st.battery.soc_mj) / (dt * B.charge_efficiency)));

    }

    function residual(e, dir) { return dir > 0 ? e.c - e.f : e.directed ? e.f : e.c + e.f; }
    const prevE = new Int32Array(GN), prevD = new Int8Array(GN), seen = new Uint8Array(GN), queue = new Int32Array(GN);
    /** Push up to amount MW from S to node t along shortest residual paths (BFS, stable order). */
    function pushTo(grid, t, amount) {
      let got = 0;
      for (let iter = 0; iter < 16 && amount - got > EPS; iter++) {
        seen.fill(0); let qh = 0, qt = 0; queue[qt++] = S; seen[S] = 1;
        while (qh < qt && !seen[t]) {

          for (const [ei, dir] of grid.adjL[u]) {
            const e = grid.edges[ei]; const v = dir > 0 ? e.v : e.u;

        for (let v = t; v !== S;) { const e = grid.edges[prevE[v]]; e.f += prevD[v] * b; v = prevD[v] > 0 ? e.u : e.v; }
        got += b;

      return got;
    }

    /**
     * Allocate demand (MW per load) over a grid snapshot: priority classes in order; within a
     * class the reactor first, then the battery; within a phase a proportional share of what the
     * sources can still give, routed by augmenting paths; loads cut off by their path keep what
     * they got and the rest is offered again (PW.solve.quanta_rounds rounds).
     */
    function solveGrid(grid, demand) {
      const alloc = new Float64Array(loads.length);
      // Passes: the loads that may spend the restart reserve (emergency lighting always, the
      // reactor auxiliaries while igniting) come first, then priority classes 0 to 3.
      const passes = [{ p: 0, reserve: true }, { p: 0, reserve: false }, { p: 1 }, { p: 2 }, { p: 3 }];
      for (const pass of passes) {
        const p = pass.p;

        for (let i = 0; i < loads.length; i++) if (st.priority[i] === p && demand[i] > EPS && !!pass.reserve === mayUseReserve(i)) members.push(i);
        if (!members.length) continue;
        for (const phase of [0, 1]) {
          grid.eBat.c = phase ? Math.max(grid.eBat.f, pass.reserve ? grid.batAvailAll : grid.batAvail) : Math.min(grid.eBat.c, grid.eBat.f);
          const blocked = new Uint8Array(loads.length);
          for (let round = 0; round < PW.solve.quanta_rounds; round++) {

            const srcRem = (grid.eRx.c - grid.eRx.f) + (grid.eBat.c - grid.eBat.f);

            for (const i of members) {

              const want = lam * (demand[i] - alloc[i]);
              if (want <= EPS) continue;

              if (got < want - EPS) { blocked[i] = 1; short = true; }
            }
            if (!short && lam >= 1) break;

      // Battery charge: reactor surplus only, never while the battery is discharging.
      grid.eBat.c = grid.eBat.f;

      if (grid.eBat.f <= EPS && grid.chargeWant > EPS) charge = pushTo(grid, pIdx[PW.battery.node], grid.chargeWant);
      return { alloc, rxOut: grid.eRx.f, batOut: grid.eBat.f, charge, edges: grid.edges };
    }

    function mayUseReserve(i) {
      const id = loads[i].id;
      // The loop's pumps (core and radiator) may spend it while the reactor is down, as long as they stay vital.
      return id === "emergency_lighting" || (id.startsWith("reactor_aux") && st.reactor.state === "igniting") ||
        ((PW.coolant.pumps.indexOf(id) >= 0 || PW.coolant.radiator_pumps.indexOf(id) >= 0) && st.reactor.state !== "running" && st.priority[i] === 0);

    /** Demand per load from setpoints, activity, damage and breakers (MW). */
    function computeDemand(setpoints) {

        const sp = Math.min(setpoints[i], l.setpoint_max);
        const fed = nodeOf(i);
        if (sp <= 0 || st.breakerOpen[i] || st.nodeHealth[fed] === 0 || st.boxOn[fed] === false) continue;
        const cap = capability(i);
        if (cap <= 0) continue;
        let x;

        else if (l.activity === "heater") x = Math.min(l.standby_mw + st.plant.heater_mw, l.nominal_mw * sp);
        else if (l.activity === "bay_pumps") x = Math.min(st.bay.pump_mw_want, l.nominal_mw * sp);

        else if (l.id.startsWith("reactor_aux") && st.reactor.state === "scrammed") x = l.standby_mw;
        else if (l.power_exponent) x = l.nominal_mw * Math.pow(sp, l.power_exponent); // a pump: its setpoint is its speed

    function capOf(g) {

    function damageState(g) {

    /** Full solve with drop-out: a load below its minimum ratio switches off and the rest re-solve. */
    function solveWithDropout(setpoints) {

      for (let pass = 0; pass < PW.solve.dropout_resolves; pass++) {
        let any = false;
        for (let i = 0; i < loads.length; i++) {

    }
    /** Console preview (preview = resolver): what a load would get at a hypothetical setpoint. */
    /**

    function previewGroup(groupId, sp) {
      const g = PW.groups.find((x) => x.id === groupId);

      for (const id of g.loads) s[loadIdx[id]] = sp;
      const r = solveWithDropout(s);

      for (const id of g.loads) { want += r.want[loadIdx[id]]; got += r.alloc[loadIdx[id]]; }

    }
    function previewSetpoint(loadId, sp) {
      const i = loadIdx[loadId];

    // ======================================================= STEP: power and heat
    function stepPower() {
      const rx = st.reactor, RC = PW.reactor;
      // Reactor control: automation follows the load the grid can take from the reactor (a
      // probe solve with the reactor at its rated output and the battery held back); a player
      // sets the throttle by hand, and power the grid cannot take heats the blanket.
      const ratedE = RC.thermal_rated_mw * RC.conversion_efficiency * (rx.integrity / 100);
      if (rx.mode === "auto" && rx.state === "running") {

        g0.eRx.c = ratedE; g0.batAvail = 0; g0.batAvailAll = 0;
        const probe = solveGrid(g0, computeDemand(st.setpoint));
        rx.target = clamp((probe.rxOut + probe.charge) / Math.max(1e-6, ratedE), RC.throttle_min, 1.0);
      }
      if (rx.state === "running") {
        const d = rx.target - rx.throttle;

        rx.throttle = clamp(rx.throttle, RC.throttle_min, RC.throttle_max);
        rx.P_th = rx.throttle * RC.thermal_rated_mw * MWW * (rx.integrity / 100);
      } else rx.P_th = 0;
      const res = solveWithDropout(st.setpoint);
      st.demand = res.demand; st.want = res.want; st.alloc = res.alloc; st.dropped = res.dropped;
      st.rxOut = res.rxOut; st.batOut = res.batOut; st.charge = res.charge;

      if (rx.state === "running" && rx.throttle > 1) rx.integrity = Math.max(0, rx.integrity - (RC.overdrive_wear_pct_per_min_at_max / 60) * dt * ((rx.throttle - 1) / (RC.throttle_max - 1)));

    /**
     * The reactor auxiliaries are two full trains, port and starboard: the reactor keeps running

     * switchboard counts as none); ignitionRate() is the pace both trains together allow.
     */
    function auxNeed(l) { return st.reactor.state === "igniting" ? PW.reactor.restart.ignition_mw / 2 : st.reactor.state === "running" ? l.nominal_mw : l.standby_mw; }
    function auxRatio() {
      let best = 0;
      for (const id of ["reactor_aux_p", "reactor_aux_s"]) { const i = loadIdx[id]; best = Math.max(best, st.alloc[i] / Math.max(1e-9, auxNeed(loads[i]))); }
      return Math.min(1, best);
    }
    function ignitionRate() {
      let a = 0; for (const id of ["reactor_aux_p", "reactor_aux_s"]) a += st.alloc[loadIdx[id]];
      return clamp(a / PW.reactor.restart.ignition_mw, 0, 1);
    }
    // ======================================================= the cooling loop (reactor-cooling)
    /**
     * A speed-law load's speed (0 to its setpoint_max): the speed its delivered power allows, power = nominal x
     * capability x speed^exponent (computeDemand scales a damaged load's demand by its capability, so a damaged pump fed
     * in full turns at its setpoint and moves capability x its flow; the capability is not counted twice).
     */
    function pumpSpeed(i) {
      const l = loads[i], cap = capability(i);
      if (!(l.nominal_mw > 0) || cap <= 0) return 0;
      return Math.pow(Math.max(0, st.alloc[i] / (l.nominal_mw * cap)), 1 / (l.power_exponent || 1));
    }
    /** A set of pumps' flow: speed x capability x each one's share, summed (reactor-cooling design 2). */
    function pumpsFlow(ids, share) { let f = 0; for (const id of ids) { const i = loadIdx[id]; f += pumpSpeed(i) * capability(i) * share; } return f; }
    /** The loop's inventory as a fraction of full, and the cavitation it allows (1 from 80%, 0 at 60%). */
    function cavitation() {
      const C = PW.coolant, CV = C.cavitation;

    }
    /**
     * A leg's factor (reactor-cooling design 2): the worst capability of its segments; with one isolated, the leg runs
     * through the bypass jumper round it at isolated_leg_flow, times the worst of the rest.
     */
    function legFactor(leg) {
      const C = PW.coolant;
      let worst = 1, isolated = false;
      for (const sg of C.segments) {
        if (sg.leg !== leg) continue;
        const p = st.coolantParts[sg.id];
        if (p.isolated) isolated = true; else worst = Math.min(worst, capOf(p.integrity));
      }
      return isolated ? C.isolated_leg_flow * worst : worst;
    }
    /** The loop's flow fraction: the core pumps, cavitation, the worse leg, and natural circulation when they stop. */
    function loopFlow() {
      const C = PW.coolant, loop = st.loop;
      loop.legs.hot = legFactor("hot"); loop.legs.cold = legFactor("cold");

    /** A pipe segment's or tank's leak, kg/s (damage.json coolant): none at or above leak_below_pct, or isolated. */
    function partLeak(id) {

    /** The heat the loop's flow carries at the design rise, MW (40 MW at full flow): the second needle's scale. */
    const carryMw = (flow) => flow * PW.coolant.design_flow_kg_s * PW.coolant.specific_heat_kj_per_kg_k * PW.coolant.automation.design_rise_k / 1000;
    /**
     * The loop's controls before the power solve: the makeup valve (AUTO opens it below auto_open_below and shuts it at
     * full; MANUAL is the engineer's), the makeup pump's activity, and in AUTO every period_s the pumps' speeds
     * (reactor-cooling design 5): the core pumps at the flow the heat needs at the design rise, never below
     * pump_speed_min, up to their setpoint_max, and the radiator pumps at full. It reckons both core pumps whole, so a
     * lost pump or a low loop is not made up for: a hurt loop under load drifts hot, and the engineer does better.
     */
    function stepCooling() {
      const C = PW.coolant, A = C.automation, cl = st.cooling, loop = st.loop;
      const frac = loop.m_kg / C.inventory_kg, tanks = loop.tanks_kg.reduce((a, b) => a + b, 0);
      if (cl.mode === "auto") {
        if (frac < C.makeup.auto_open_below) cl.autoMakeup = 1; else if (frac >= 1) cl.autoMakeup = 0;

      if (cl.mode !== "auto") return;
      cl.timer -= dt;
      if (cl.timer > 0) return;
      cl.timer = A.period_s;
      const need = loop.in_mw / carryMw(1);
      for (const id of C.pumps) { const i = loadIdx[id]; st.setpoint[i] = clamp(Math.max(A.pump_speed_min, need), 0, loads[i].setpoint_max); }
      for (const id of C.radiator_pumps) st.setpoint[loadIdx[id]] = 1;
    }
    /** The engineer's hand on the loop: { mode, pumps, radiators (speeds), chiller (share through the exchanger), makeup (open) }. */
    function setCooling(o) {
      const C = PW.coolant, cl = st.cooling;
      if (o.mode === "manual" && cl.mode !== "manual") { cl.chiller = st.loop.chiller; cl.makeup = st.loop.makeupValve || 0; }
      if (o.mode === "auto" && cl.mode !== "auto") cl.timer = 0;
      if (o.mode) cl.mode = o.mode;
      const speed = (ids, v) => { for (const id of ids) { const i = loadIdx[id]; st.setpoint[i] = clamp(v, 0, loads[i].setpoint_max); } };
      if (o.pumps != null) speed(C.pumps, o.pumps);
      if (o.radiators != null) speed(C.radiator_pumps, o.radiators);

      if (o.makeup != null) cl.makeup = o.makeup ? 1 : 0;
    }
    /** The loop as the engineering console shows it (preview = resolver: these are the step's own numbers). */
    function coolantReadout() {
      const C = PW.coolant, loop = st.loop;
      const pumps = (ids) => ids.map((id) => { const i = loadIdx[id]; return { id, name: loads[i].name, setpoint: st.setpoint[i], speed: pumpSpeed(i), capability: capability(i), alloc_mw: st.alloc[i] }; });
      return {
        mode: st.cooling.mode, cold_k: loop.T, hot_k: loop.hot_k, flow: loop.flow, flow_kg_s: loop.flow * C.design_flow_kg_s,
        heat_mw: loop.in_mw, carry_mw: carryMw(loop.flow), rad_mw: loop.rad_mw, rad_cap_mw: loop.rad_cap_mw, chiller: loop.chiller,

      const g = FL.gravity_m_s2 * gravityG();

    function gravityG() {

      derive();

      const og = PL.o2_generator, oi = loadIdx.o2_generator;
      const po2 = (P[D] * n[O2][D]) / Math.max(1e-9, ntot[D]) / 1000;
      const wantRate = og.max_mol_s * clamp((og.target_po2_kpa - po2) / og.band_kpa, 0, 1) * Math.min(st.setpoint[oi], loads[oi].setpoint_max);
      st.plant.o2_want_mw = wantRate * og.energy_mj_per_mol;

      const thr = sc.throughput_m3_s * sr;

      const smTake = Math.min(n[SMOKE][D], (sc.smoke_efficiency * thr * n[SMOKE][D] * dt) / vol[D]);

      const refilling = st.repress.some((x) => x > 0);

      const Qwant = ((tc.supply_setpoint_k - T[D]) * Cd) / dt;
      st.plant.heater_mw = clamp(Qwant / MWW, 0, tc.heating_max_mw);
    }

    function stepRoomHeat() {
      // Heat from loads, lights, crew; bulkhead conduction; hull loss.
      for (const c of st.crew) if (!c.dead && c.comp != null) roomHeat[c.comp] += c.working ? AT.metabolism.heat_w_work : AT.metabolism.heat_w_rest;
      for (let i = 0; i < NN; i++) U[i] += roomHeat[i] * dt;
      derive();
      for (const e of adj) { const q = TH.bulkhead_u_w_per_m2_k * e.area * (T[e.a] - T[e.b]) * dt; U[e.a] -= q; U[e.b] += q; }
      for (let i = 0; i < N; i++) U[i] -= TH.hull_u_w_per_m2_k * extArea[i] * (T[i] - TH.hull_skin_k) * dt;
      derive();
    }

    function stepPumps() {

            const ratio = supplyRatio("hangar_pumps");

            for (let k = 0; k < 4; k++) addGas(i, k, (rc.mol[k] * mol) / nt, rc.def.temperature_k);
            for (let k = 0; k < 4; k++) rc.mol[k] -= (rc.mol[k] * mol) / nt;
          }

      }

      const al = st.airlock; al.pump_mw_want = 0;
      if (al.mode === "out_pump") {
        const i = idx[AL.compartment], j = idx[AL.pump_into];
        if (P[i] / 1000 <= AL.stop_kpa) { al.mode = "out_ready"; setLink(AL.outer, 1); log("Airlock pumped down at t=" + (st.t - al.t0).toFixed(1) + " s; outer door opening"); }
        else {
          const lnr = Math.log(Math.max(1, P[j] / Math.max(P[i], 1)));
          al.pump_mw_want = (AL.pump_m3_s * P[i] * lnr) / AL.efficiency / MWW + 0.005;
          const ratio = supplyRatio("airlock_pump");
          const molRate = (AL.pump_m3_s * ratio * P[i]) / (R * T[i]);
          const tk = T[i];

      }

    }

    // ======================================================= FIRE
    function fO2(i) {
      const x = ntot[i] > 0 ? n[O2][i] / ntot[i] : 0;
      return clamp((x - FI.extinct_o2_fraction) / (FI.full_o2_fraction - FI.extinct_o2_fraction), 0, 1) *
        clamp((P[i] / 1000 - FI.extinct_kpa) / (FI.full_kpa - FI.extinct_kpa), 0, 1);
    }
    function stepFire() {
      const alpha = FI.growth_alpha_kw_per_s2 * 1000;
      const MIST = FI.suppression.water_mist, INERT = FI.suppression.inert_gas;
      for (let i = 0; i < N; i++) {
        const f = st.fire[i];
        // Inert gas flooding: replace room gas with nitrogen until the design O2 fraction.
        if (f.inert > 0) {
          // Flood and hold: replace room gas with nitrogen (relief overboard) while O2 is above design.
          const x = n[O2][i] / Math.max(1e-9, ntot[i]);
          if (x > INERT.design_o2_fraction) {
            const k = Math.log(SA.mole_fraction.o2 / INERT.design_o2_fraction) / INERT.time_s;
            const mol = Math.min(ntot[i] * k * dt, stores[INERT.store].mol[N2]);
            const tk = T[i];
            const g = takeMix(i, mol); st.lostOverboard += g[0] + g[1] + g[2] + g[3];
            stores[INERT.store].mol[N2] -= mol; addGas(i, N2, mol, tk);
            st.n2Used = (st.n2Used || 0) + mol;
          }
          f.inert = Math.max(0, f.inert - dt);
          if (f.inert <= 0) { delete st.damperForced[comps[i].id]; log("Inert gas soak ends in " + comps[i].name); }
        }
        if (f.mist > 0) { f.mist -= dt; U[i] -= MIST.cooling_mw * MWW * dt; }
        derive();
        if (FS) { stepFireCells(i); continue; }
        if (f.hrr <= 0) {
          // Spread: hot air with fuel and oxygen ignites (deterministic threshold).
          if (T[i] > FI.autoignition_k && f.fuel > 0 && fO2(i) > 0) { f.hrr = FI.seed_kw * 1000; log("Fire spreads into " + comps[i].name); }
          continue;
        }
        const max = FI.hrr_max_kw_per_m2 * 1000 * floor[i] * fO2(i) * (f.fuel > 0 ? 1 : 0);
        let cut = 0;
        for (const e of st.extinguishers) if (e.comp === i && e.on && e.agent_kg > 1e-6) { cut += EX.hrr_cut_kw_per_s * 1000 * e.n; spend(e); }
        if (f.ext > 0) f.ext -= dt;
        if (f.mist > 0) cut += MIST.hrr_cut_kw_per_s * 1000;
        if (cut > 0) f.hrr -= cut * dt;
        else if (f.hrr < max) f.hrr = Math.min(max, f.hrr + dt * 2 * Math.sqrt(alpha * f.hrr));
        if (f.hrr > max) f.hrr += ((max - f.hrr) * dt) / FI.decay_time_s;
        if (f.hrr < FI.out_below_kw * 1000) { f.hrr = 0; log("Fire out in " + comps[i].name); continue; }

        if (o2 > 0.5 * n[O2][i]) { o2 = 0.5 * n[O2][i]; f.hrr = (o2 * FI.mj_per_mol_o2 * MWW) / dt; }
        const x = n[O2][i] / Math.max(1e-9, ntot[i]);
        const y = x < FI.starved_below_o2_fraction ? FI.smoke_mol_per_mol_o2_starved : FI.smoke_mol_per_mol_o2_ventilated;
        n[O2][i] -= o2; n[CO2][i] += FI.co2_mol_per_mol_o2 * o2; n[SMOKE][i] += y * o2;

    }
    /** An extinguisher's agent for one step (0.4 kg a second: agent_kg over discharge_s); empty, it stops. */
    function spend(e) { e.agent_kg -= (EX.agent_kg / EX.discharge_s) * dt; if (e.agent_kg <= 1e-6) { e.agent_kg = 0; e.on = false; } }
    /** The way into a room a crew member comes by: its first door to a corridor (else its first door), [x, z]. */
    function doorOf(i) {
      const ps = kit().portalsOf(L, comps[i].id).filter((p) => Math.abs(p.normal[1]) < 0.5 && p.between.indexOf("space") < 0);
      const other = (p) => comps[idx[p.between[0] === comps[i].id ? p.between[1] : p.between[0]]];
      const p = ps.find((q) => (other(q) || {}).kind === "corridor") || ps[0];
      if (p) return [p.center_m[0], p.center_m[2]];
      const c = kit().center(comps[i]); return [c[0], c[2]];
    }
    /**
     * One room's fire as its cells (fire-spread design 2 and 5): spread in from a neighbour at autoignition, the cells'
     * step with the extinguishers' cones and the mist, then the room's caps (ceiling and decay, half its oxygen in a step)
     * scaling every cell, then the chemistry exactly as the room model does it.
     */
    function stepFireCells(i) {
      const f = st.fire[i], r = FS.rooms[i], MIST = FI.suppression.water_mist, fo = fO2(i), was = f.hrr;
      if (f.hrr <= 0 && T[i] > FI.autoignition_k && f.fuel > 0 && fo > 0) {
        // Spread: the new fire starts at the cell nearest the portal whose flow brought the heat in (the open one to
        // the hottest neighbour).
        let best = null;
        for (const l of links) {
          if (!l.mix || l.open <= 0 || (l.a !== i && l.b !== i)) continue;
          const j = l.a === i ? l.b : l.a;
          if (j !== SPACE && (!best || T[j] > T[best.j])) best = { l, j };
        }
        const at = best && best.l.center ? best.l.center : kit().center(comps[i]);
        FS.seed(i, at[0], at[2], FI.seed_kw);
        log("Fire spreads into " + comps[i].name);
      }
      const cuts = [];
      for (const e of st.extinguishers) {
        if (e.comp !== i || !e.on || e.agent_kg <= 1e-6) continue;
        const aim = typeof e.aim === "string" ? FS.scriptedAim(i, e.aim, e.door || doorOf(i)) : e.aim;
        cuts.push({ cells: aim ? FS.footprintCells(i, aim.from, aim.dir) : [], w_per_s: EX.hrr_cut_kw_per_s * 1000 * e.n });
        e.lastAim = aim;

      let o2 = (hrr * dt) / (FI.mj_per_mol_o2 * MWW);

      f.hrr = hrr;
      if (was >= FI.out_below_kw * 1000 && hrr < FI.out_below_kw * 1000) log("Fire out in " + comps[i].name);
      if (hrr > 0 || r.active) f.fuel = FS.fuelLeft(i);
      if (hrr <= 0) return;
      const x = n[O2][i] / Math.max(1e-9, ntot[i]);
      const y = x < FI.starved_below_o2_fraction ? FI.smoke_mol_per_mol_o2_starved : FI.smoke_mol_per_mol_o2_ventilated;
      n[O2][i] -= o2; n[CO2][i] += FI.co2_mol_per_mol_o2 * o2; n[SMOKE][i] += y * o2;

    }
    /** Hot air damages what is in the room: systems, switchboards and (more slowly) the reactor. */
    function stepFireDamage() {
      for (let i = 0; i < N; i++) {
        const over = T[i] - FI.system_damage_above_k;
        if (over <= 0) continue;
        const pts = FI.system_damage_pct_per_s_per_k * over * dt;
        for (let li = 0; li < loads.length; li++) if (loads[li].compartment === comps[i].id) st.integrity[li] = Math.max(0, st.integrity[li] - pts);
        for (const nd of PW.nodes) if (nd.compartment === comps[i].id) { const h = st.nodeHealth[nd.id] == null ? 1 : st.nodeHealth[nd.id]; const left = h - pts / 100; st.nodeHealth[nd.id] = left < DM.nodes.destroyed_below ? 0 : left; }
        if (comps[i].id === L.systems.find((x) => x.id === PW.reactor.system).compartment) st.reactor.integrity = Math.max(0, st.reactor.integrity - pts * FI.reactor_damage_factor);
      }
    }
    /** A fire of kw (kW) in a room; at ([x, z]) is where, for the cell model (a hit's entry, a click), else the room's centre. */
    function ignite(compId, kw, at) {
      const i = idx[compId], f = st.fire[i];
      if (f.fuel <= 0) return false;
      if (FS) {
        const c = at || (() => { const m = kit().center(comps[i]); return [m[0], m[2]]; })();
        FS.seed(i, c[0], c[1], kw || FI.seed_kw);
        let q = 0; const r = FS.rooms[i]; for (let k = 0; k < r.n; k++) if (r.state[k] === FS.BURNING) q += r.q[k];
        f.hrr = q;
      } else f.hrr = Math.max(f.hrr, (kw || FI.seed_kw) * 1000);
      log("Fire in " + comps[i].name + " (" + (f.hrr / 1000).toFixed(0) + " kW)");
      return true;
    }

    // ======================================================= automation
    function stepAutomation() {
      derive();
      // Rate of pressure fall of every node since the last sub-step (Pa/s, positive falling).
      for (let i = 0; i < NN; i++) { st.fall[i] = st.t > 0 ? (st.pHist[i] - P[i]) / dt : 0; st.pHist[i] = P[i]; }
      // Vent dampers (life-support, "Ventilation"). A damper trips shut on excess net flow
      // (more than damper_trip_fraction_per_s of its room's gas a second: a leak or a fire's
      // expansion; ordinary heating is about a hundred times less), unless the flow is a refill
      // of a rising room. A tripped damper waits until its room has stopped falling for
      // damper_retry_s, then reopens if the room is near the duct's pressure, or refills it
      // (repressurize) if the room is above auto_repress_above_kpa; a room below that stays
      // isolated for the damage control board. Dampers also shut on low pressure, smoke, a
      // low duct, or no fan. A forced state (venting, isolation) overrides; a refill ends at
      // the make-up threshold, and is abandoned if the room falls while it runs (still leaking).
      const fan = fanRatio();
      const ductLow = P[DUCT] / 1000 < VE.duct_low_kpa;
      for (let i = 0; i < N; i++) {
        const v = links[ventOf[i]], id = comps[i].id;
        if (st.repress[i]) {
          if (P[i] / 1000 >= AT.plant.makeup.start_below_kpa) { delete st.damperForced[id]; st.repress[i] = 0; st.trip[i] = 0; log(comps[i].name + " back to " + (P[i] / 1000).toFixed(1) + " kPa"); }
          else if (st.fall[i] > VE.damper_falling_pa_per_s && v.open >= 1) { delete st.damperForced[id]; st.repress[i] = 0; st.trip[i] = VE.damper_retry_s; st.hold[i] = 1; log("Refill of " + comps[i].name + " stopped: it is still leaking"); }
          else { v.target = 1; continue; }
        }
        const forced = st.damperForced[id];
        if (forced != null) { v.target = forced ? 1 : 0; continue; }
        const refill = v.flow < 0 && st.fall[i] < 0;
        if (Math.abs(v.flow) > VE.damper_trip_fraction_per_s * ntot[i] && !refill) st.trip[i] = VE.damper_retry_s;
        else if (st.trip[i] > 0) {
          if (st.fall[i] > VE.damper_falling_pa_per_s) st.trip[i] = VE.damper_retry_s;
          else if ((st.trip[i] -= dt) <= 0) {
            const dpk = (P[DUCT] - P[i]) / 1000;
            if (Math.abs(dpk) < VE.damper_reset_kpa) st.trip[i] = 0;
            else if (P[i] / 1000 > VE.auto_repress_above_kpa && !st.hold[i]) { st.trip[i] = 0; repressurize(id); continue; }
            else st.trip[i] = dt; // isolated until the board acts
          }
        }
        if (!st.damperAuto) continue;
        const ppm = (n[SMOKE][i] / Math.max(1e-9, ntot[i])) * 1e6;
        const shut = fan <= 0 || st.trip[i] > 0 || P[i] / 1000 < VE.damper_close_below_kpa || ppm > VE.damper_close_smoke_ppm || ductLow;
        v.target = shut ? 0 : 1;
      }
      // Doors between two compartments close themselves on a pressure alarm: either side below
      // auto_close_below_kpa and falling faster than auto_close_fall_kpa_per_s, unless the
      // damage control board holds them. Doors to space are commanded, never automatic.
      if (st.pdoorAuto) for (const l of links) {
        if (l.target <= 0 || l.b === SPACE || PK.auto_close_kinds.indexOf(l.kind) < 0 || l.manualHold) continue;
        const alarm = (k) => P[k] / 1000 < PK.auto_close_below_kpa && st.fall[k] / 1000 > PK.auto_close_fall_kpa_per_s;
        if (alarm(l.a) || alarm(l.b)) { l.target = 0; log(l.id + " closing itself (pressure alarm)"); }
      }

      for (const id of FI.suppression.water_mist.compartments) {

      }

    }
    /** Portal motion: every door, vent, dump and valve toward its target at its own speed. */
    function movePortals() {
      for (const l of links) {
        if (l.open === l.target) continue;
        const opening = l.open < l.target, time = opening ? l.move : l.moveClose;
        const rate = time > 0 ? dt / time : 1;
        l.open = opening ? Math.min(l.target, l.open + rate) : Math.max(l.target, l.open - rate);
      }
    }

    // ======================================================= crew
    const CE = AT.crew_effects, MET = AT.metabolism, HE = opts.health || null;
    function addCrew(id, name, compId, o) {
      st.crew.push(Object.assign({ id, name, comp: idx[compId], working: false, suited: false, hp: 100, hyp: 0, hyc: 0, fed: 0, vac: 0, uncon: false, uncon_s: 0, dead: false, status: "ok", lastP: null }, o || {}));
    }
    function stepCrew() {
      derive();

        const m = c.working ? MET.work_multiplier : 1;
        const o2 = Math.min(n[O2][i], MET.o2_mol_s_rest * m * dt);

/** The subsystems' key in silkscreen (power-routing 3e), in deck C's empty aft corner: each family's light, and what a

/** The strip along the top: power delivered from the reactor and the battery against what the loads want. */

const DEFS = `<defs><pattern id="hatchR" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2.5" height="6" fill="${C.danger}" opacity="0.75"/></pattern>` +

  `<radialGradient id="redvig" cx="50%" cy="50%" r="75%"><stop offset="60%" stop-color="${C.alert}" stop-opacity="0"/><stop offset="100%" stop-color="${C.alert}" stop-opacity="0.22"/></radialGradient></defs>`;

  const order = EDGE_IDS.filter((id) => PATH[id]).sort((a, b) => (isSpare(b) - isSpare(a)) || (edgeNow(a).rated - edgeNow(b).rated));

// The diagram's view: fitted to the stage, then zoomed (wheel, pinch) and panned (drag) on top of the fit.
// A phone held upright opens it at the screen's height, aft end first (pan along it); Fit shows it whole.
const DZ = { z: 1, ox: 0, oy: 0, base: 1, bx: 0, by: 0, whole: false };
function fitDiagram() {

  DZ.base = Math.min((ax1 - ax0) / DW, (ay1 - ay0) / DH);
  DZ.bx = ax0 + ((ax1 - ax0) - DW * DZ.base) / 2; DZ.by = ay0 + (PORTRAIT ? ((ay1 - ay0) - DH * DZ.base) / 2 : 0);
  DZ.z = 1; DZ.ox = 0; DZ.oy = 0;

function applyDiagram() { DIAG.style.transform = `translate(${DZ.bx + DZ.ox}px, ${DZ.by + DZ.oy}px) scale(${DZ.base * DZ.z})`; }
function diagZoomAt(cx, cy, f) {

const dptr = new Map();
let ddrag = null, dpinch = null;
STAGE.addEventListener("pointerdown", (e) => {

// =================================================================== views, the loop, the shots
function setView(v) {
  view = v;
  for (const b of VIEWSW.querySelectorAll("button")) b.classList.toggle("on", b.dataset.v === v);
  canvas.style.display = v === "3d" ? "block" : "none";

let acc = 0, last = performance.now(), first = true, slow = 0, wasLeft = -1;

  const now = performance.now(), dt = Math.min(0.1, (now - last) / 1000);

  }
  if (n >= 400) acc = 0;
  LINE_U.uTime.value += dt;
  LINE_U.uRes.value.set(W, H);

  }

    updatePlan();

/** A shot: a fresh scenario run a fixed number of steps, then held still (time paused) so it is the same every run. */

  spread = spreadFor(); buildPlan(); PL.floors.material.opacity = roomsOn ? 0.9 : 0.55; legend();
