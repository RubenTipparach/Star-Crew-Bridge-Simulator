# The matchmaker (openspec/changes/matchmaker design 5): one small Machine, always running, so a listed
# server's long poll is never cut by an idle stop. HTTP on port 80 stays open as well as HTTPS, because
# the native client does not speak TLS yet (matchmaker task 2.4).
app = "star-crew-bridge-simulator"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = false
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 800
    hard_limit = 1000

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
