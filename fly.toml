# The matchmaker (openspec/changes/matchmaker design 5): one small Machine that runs only while someone uses it.
# Fly's proxy stops it after a few idle minutes and starts it again on the next request; a listed server's open
# connection counts as use, so it is never stopped under a server that is listed. HTTP on port 80 stays open as well as HTTPS, because
# the native client does not speak TLS yet (matchmaker task 2.4).
app = "star-crew-bridge-simulator"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = false
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 800
    hard_limit = 1000

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
