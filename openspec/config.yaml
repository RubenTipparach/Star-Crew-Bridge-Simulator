schema: spec-driven

# Read CLAUDE.md before planning anything. It is the only copy of this project's
# rules, and this field points at it rather than restating it: a summary here
# would be a second copy to keep in step.
context: |
  Read CLAUDE.md at the repository root first. It is the single source for this
  project's owner direction, performance and the Pis' role, architecture boundaries,
  ship and simulation invariants, deck design and verification rules, and it
  takes precedence over any summary. docs/design/vision.md is the game brief.

  Star Crew is a networked starship bridge simulator on a custom engine for the
  desktop and the browser (OpenGL ES 3.0, WebGL 2). Raspberry Pi 5s are for
  testing multiplayer, not a performance target (CLAUDE.md section 2). The ship
  simulation lives in an engine-independent core that the server runs and the
  client renders. The one layout source for a ship is data/ships/<id>/layout.json.

  openspec/specs holds what the game actually does today, and every requirement
  in it is pinned by a passing check. Work that is designed but not built
  belongs in openspec/changes, never in specs.

  No em or en dashes in any artifact. Numbers carry SI units. Tuning values live
  in validated data files, not code. Before claiming anything is done:
  openspec validate --all, python3 tools/layout_check.py,
  python3 tools/mockups/inline.py --check, and screenshots the owner can check.
