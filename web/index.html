<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Star Crew</title>
<meta name="description" content="Star Crew: walk the SCS Tern, take a station and fight the ship.">
<style>
  /* The page is only the game (openspec/changes/browser-page-fit design 2): the canvas fills it edge to edge, with no
     border, margin or text around it. SDL alone sizes the canvas's drawing buffer (design 1). Single-theme by choice
     (a game screen). */
  :root {
    --hull: #0b0f14;        /* the page, the colour of the ship's dark */
    --dim: #7d8fa3;         /* the loading line */
    --amber: #f0a347;       /* the ship's status amber, the one accent */
    /* No web fonts: the page draws one loading word, and the game draws its own type. */
    --display: "Arial Narrow", system-ui, sans-serif;
    --mono: ui-monospace, "SFMono-Regular", Menlo, monospace;
    color-scheme: dark;
  }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { background: var(--hull); color: var(--dim); font: 14px/1.5 var(--mono); }
  .screen { position: fixed; inset: 0; background: #000; }
  canvas#canvas { display: block; width: 100%; height: 100%; outline: none; cursor: crosshair; touch-action: none; }
  .status {
    position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
    font-family: var(--display); font-weight: 700; font-size: 1.3rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--amber);
    background: radial-gradient(circle at 50% 45%, #16202b 0%, #000 70%); pointer-events: none;
  }
  .status[hidden] { display: none; }
  /* A touch screen (touch-controls design 5): the game fills it inside the notch's insets; a drag never scrolls or
     zooms the page. */
  @media (pointer: coarse) {
    .screen { inset: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    body { touch-action: none; }
  }
  /* Held upright: a card asks for the phone to be turned; the game runs on behind it. */
  .turn { position: absolute; inset: 0; display: none; place-items: center; text-align: center; background: rgba(5, 8, 12, 0.94);
    font-family: var(--display); font-weight: 700; font-size: 1.4rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--amber); }
  @media (pointer: coarse) and (orientation: portrait) { .turn { display: grid; } }
</style>

<div class="screen">
  <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()" aria-label="Star Crew"></canvas>
  <div class="turn" aria-live="polite"><div><svg width="96" height="96" viewBox="0 0 96 96" aria-hidden="true">
    <rect x="30" y="10" width="36" height="64" rx="6" fill="none" stroke="currentColor" stroke-width="4"/>
    <path d="M 16 56 A 34 34 0 0 0 50 88" fill="none" stroke="currentColor" stroke-width="4"/></svg><div>Turn sideways</div></div></div>
  <div class="status" id="status">Loading</div>
</div>

<script>
  // SDL reads the page's pixel ratio to size the canvas's drawing buffer; it is capped at 2 here, where the old page
  // capped it, so a phone at 3 does not draw 2.25 times the pixels for no sharper a picture (browser-page-fit design 1).
  (function capPixelRatio() {
    const d = Object.getOwnPropertyDescriptor(window, "devicePixelRatio") || Object.getOwnPropertyDescriptor(Window.prototype, "devicePixelRatio");
    if (!d || !d.get) return;
    try {
      Object.defineProperty(window, "devicePixelRatio", { get: () => Math.min(d.get.call(window) || 1, 2), configurable: true });
    } catch (_) { /* a browser that will not let it be capped draws at its own ratio */ }
  })();
  const statusEl = document.getElementById("status");
  const canvas = document.getElementById("canvas");
  var Module = {
    canvas,
    print: (t) => console.log(t),
    printErr: (t) => console.warn(t),
    setStatus: (t) => {
      if (!t) { statusEl.hidden = true; return; }
      statusEl.hidden = false;
      statusEl.firstChild.nodeValue = t.replace(/\(\d+\/\d+\)/, "").trim() || "Loading";
    },
    onAbort: (what) => { statusEl.hidden = false; statusEl.firstChild.nodeValue = "The game stopped. Reload the page to start again."; console.warn(what); },
  };
  canvas.addEventListener("click", () => canvas.focus());
  // The first touch asks for full screen where the browser has it (Android Chrome, iPadOS Safari; iPhone Safari has
  // none, and the page fills the window), then tries to hold the screen sideways (most browsers refuse; the card
  // covers that). touch-controls design 5.
  canvas.addEventListener("pointerdown", function first(e) {
    if (e.pointerType !== "touch") return;
    canvas.removeEventListener("pointerdown", first);
    const el = document.documentElement, go = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!go || document.fullscreenElement) return;
    Promise.resolve(go.call(el)).then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock("landscape")).catch(() => {});
  });
</script>
<script src="sc-client.js"></script>
